# The shape of ansible/inventory-example: a gateway, masters under k3s.
---
gateway:
  hosts:
    pi-gw:
      ansible_host: 192.168.1.100
k3s:
  children:
    masters:
      hosts:
        pi1:
          ansible_host: 192.168.1.101
        pi2:
          ansible_host: 192.168.1.102
    workers:
      hosts:
        pi4:
          ansible_host: 192.168.1.104
