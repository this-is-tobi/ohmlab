# The cluster's Gateway, on the apex domain.
gateway:
  enabled: true
  namespace: traefik
  domain: customer-a.example.net
  manageCertificate: true
lanOnly:
  sourceRange:
    - 198.51.100.0/24
# No CrowdSec on this cluster: no bouncer on the entrypoints, and no key to
# read from Vault.
traefik:
  deployment:
    additionalVolumes: []
  additionalVolumeMounts: []
  ports:
    web:
      http:
        middlewares: []
    websecure:
      http:
        middlewares: []
crowdsecBouncer:
  enabled: false
vso:
  vaultAuth:
    default:
      enabled: false
  vaultStaticSecrets:
    traefikCrowdsecBouncerKey:
      enabled: false
