# The admins' Keycloak: the system realm, with the core apps' clients.
keycloak:
  keycloak:
    hostnameAdmin: "https://keycloak.platform.example.com"
    hostname: "https://keycloak.platform.example.com"
  database:
    host: keycloak-pg-cluster-rw
    port: "5432"
    name: keycloak
    existingSecret: keycloak-pg-cluster-app
    secretKeys:
      usernameKey: username
      passwordKey: password
gateway:
  enabled: true
  gatewayNamespace: traefik
  routes:
  - name: keycloak
    hostnames:
    - keycloak.platform.example.com
    rules:
    - backendService: keycloak
      backendPort: 8080
cnpg:
  cluster:
    # Any node of the managed cluster.
    affinity:
      nodeSelector: null
    superuserSecret: keycloak-pg-cluster-admin
    initdb:
      secret:
        name: keycloak-pg-cluster-app
  backups:
    enabled: false
