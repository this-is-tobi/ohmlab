# The cluster layer: what every instance of the cluster shares. The cluster's
# provider runs its CNI and storage.
apps:
- app: vault-operator
  enabled: "true"
  namespace: vault-operator-system
  syncWave: 10
- app: cert-manager
  enabled: "true"
  syncWave: 10
- app: traefik
  enabled: "true"
  namespace: traefik
  syncWave: 11
- app: kyverno
  enabled: "true"
  syncWave: 15
- app: cloudnative-pg
  enabled: "true"
  syncWave: 20
- app: prometheus-stack
  enabled: "true"
  syncWave: 50
