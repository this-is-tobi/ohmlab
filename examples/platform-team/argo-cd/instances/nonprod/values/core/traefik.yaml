# One Gateway for both environments of the cluster: a listener per
# environment's wildcard, all on one certificate.
gateway:
  enabled: true
  namespace: traefik
  domain: nonprod.example.com
  manageCertificate: true
  extraDnsNames:
    - "*.dev.example.com"
    - "*.preprod.example.com"
  extraWildcardListeners:
    - name: https-dev
      hostname: "*.dev.example.com"
    - name: https-preprod
      hostname: "*.preprod.example.com"
lanOnly:
  sourceRange:
    - 198.51.100.0/24
# No CrowdSec on this cluster: no bouncer on the entrypoints, and no key to
# read from Vault.
traefik:
  deployment:
    additionalVolumes: []
  additionalVolumeMounts: []
  ports:
    web:
      http:
        middlewares: []
    websecure:
      http:
        middlewares: []
crowdsecBouncer:
  enabled: false
vso:
  vaultAuth:
    default:
      enabled: false
  vaultStaticSecrets:
    traefikCrowdsecBouncerKey:
      enabled: false
