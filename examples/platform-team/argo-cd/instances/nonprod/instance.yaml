# The cluster layer of the shared non-production cluster, which runs dev and
# preprod: one instance, as cluster-wide objects have one owner.
instance:
  name: nonprod
  env: nonprod
destination:
  server: https://nonprod.example.com:6443
repoURL: https://git.example.org/platform-team/instances.git
targetRevision: main
catalogs:
  release:
    repoURL: oci://ghcr.io/this-is-tobi/ohmlab/catalog
    version: 0.16.0
defaultCatalog: release
vault:
  hub: platform
projects:
  core: nonprod-core
