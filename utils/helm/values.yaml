# Optional, DORMANT-by-default CoreDNS (templates/coredns.yaml) — see the
# comment there. Disabled: k3s's own
# bundled CoreDNS keeps serving 10.43.0.10. Do not flip `enabled: true`
# without also setting the k3s server flag `--disable coredns` (ansible
# inventory) first, or this will fight k3s's addon controller over the same
# objects. `replicas: 1` on purpose for now — HA (replicas: 2) is a
# deliberate later step, not bundled into turning this on.
coredns:
  enabled: false
  replicas: 1
  image: rancher/mirrored-coredns-coredns:1.15.0
  clusterIP: 10.43.0.10
  resources:
    requests:
      cpu: 100m
      memory: 70Mi
    limits:
      memory: 170Mi
  # Cluster-specific — leave empty in this generic chart default. Populate
  # per-instance (e.g. instances/homelab/values/core/ohmlab.yaml) with your
  # actual node IPs/hostnames: [{ip: 192.168.1.100, name: node0}, ...].
  nodeHosts: []

gateway:
  enabled: false
  gatewayName: ""
  gatewayNamespace: ""
  # Extra gateways to also attach routes to (e.g. during the APISIX→Traefik
  # migration): [{name, namespace?}] — sectionName is reused from the route.
  extraParentRefs: []
  routes: []
  # BackendTLSPolicy entries for TLS-serving backends (templates/
  # backendtlspolicy.yaml): [{name, serviceName, hostname, caConfigMap? |
  # wellKnownCACertificates?}]. Requires Gateway API ≥v1.6 CRDs.
  backendTLSPolicies: []

# Zero-trust NetworkPolicy for the argocd-system namespace (templates/
# networkpolicy.yaml). EGRESS ONLY — the upstream argo-cd chart already
# ships ingress NetworkPolicies for every component. Disabled by default —
# real rules live in the instance override. This is the CORE ArgoCD
# instance that syncs every other app in this rollout, including itself.
networkPolicy:
  enabled: false
  egressDeny: true
  # Namespace the Prometheus scraper runs in (source of the
  # allow-prometheus-scrape ingress rule). Same knob exists in every app
  # chart's networkpolicy template.
  prometheusNamespace: prometheus-stack
  prometheusScrapePorts: []
  extraIngress: []
  extraEgress: []

argo-cd:
  # -- Enable ArgoCD core deployment
  enabled: true
  fullnameOverride: argocd
  crds:
    install: true
    keep: true
  configs:
    secret:
      argocdServerAdminPassword: "" # Add your bcrypt hashed password here
    params:
      # TLS end-to-end: argocd-server serves TLS itself (self-signed at bootstrap,
      # then the cert-manager issued `argocd-server-tls` secret once the ingress
      # is enabled). Instance ingress must set the APISIX upstream-scheme
      # annotation — see instances/homelab/values/core/ohmlab.yaml.
      server.insecure: false
      # Feature gate for ApplicationSet RollingSync. Inert until an
      # instance-manager release opts in via `progressiveSync.enabled: true`
      # (see argo-cd/apps/instance-manager/values.yaml).
      applicationsetcontroller.enable.progressive.syncs: true
    # NOTE: `policy.default` and `scopes` must live INSIDE `configs.rbac` —
    # as siblings of it they are silently ignored by the chart and the
    # intended default-deny never applies.
    rbac:
      policy.csv: |
        p, role:none, *, *, */*, deny
        p, role:admin, *, *, */*, allow
        g, /admin, role:admin
      policy.default: role:none
      scopes: "[groups]"
    cm:
      url: "" # Add your ArgoCD URL here
      resource.customizations: |
        networking.k8s.io/Ingress:
          health.lua: |
            hs = {}
            hs.status = "Healthy"
            return hs
        ohmlab.fr/VaultSeed:
          health.lua: |
            hs = {}
            if obj.status == nil or obj.status.conditions == nil then
              hs.status = "Progressing"
              hs.message = "Waiting for the ohmlab controller"
              return hs
            end
            -- The controller has not looked at this version of the spec yet.
            if obj.status.observedGeneration ~= nil and obj.metadata.generation ~= nil and obj.status.observedGeneration < obj.metadata.generation then
              hs.status = "Progressing"
              hs.message = "Waiting for the ohmlab controller to reconcile the latest spec"
              return hs
            end
            local ready = nil
            for _, c in ipairs(obj.status.conditions) do
              if c.type == "Stalled" and c.status == "True" then
                hs.status = "Degraded"
                hs.message = c.message
                return hs
              end
              if c.type == "Ready" then ready = c end
            end
            if ready == nil then
              hs.status = "Progressing"
              hs.message = "Waiting for the ohmlab controller"
              return hs
            end
            if ready.status == "True" then
              hs.status = "Healthy"
              hs.message = ready.message
              return hs
            end
            -- Observe-only mode reports drift on purpose; it is not a failure.
            if ready.reason == "ObserveOnly" then
              hs.status = "Healthy"
              hs.message = ready.message
              return hs
            end
            hs.status = "Degraded"
            hs.message = ready.message
            return hs
  redis-ha:
    enabled: true
    fullnameOverride: argocd-redis-ha
    redis:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
    sentinel:
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 128Mi
    haproxy:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 256Mi
      init:
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
    init:
      resources:
        limits:
          cpu: 100m
          memory: 64Mi
    # The detection loop wakes every 60s and pipes redis-cli into a very
    # large grep, a ~1 CPU-second burst that throttles under a small quota.
    # The request is explicit: with only a limit set, Kubernetes defaults
    # the request to the limit and would reserve a full core per replica.
    splitBrainDetection:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: "1"
          memory: 64Mi
  redis:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
  # PreSync hook Job seeding the redis password, re-run on every sync;
  # require-resource-limits flags it without these.
  redisSecretInit:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi
  notifications:
    replicas: 1
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
  controller:
    replicas: 2
    # The request tracks the ~1Gi steady-state cluster cache: scheduling on
    # 512Mi let a shard stack with Prometheus and push a node into memory
    # pressure.
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        # 2-core burst: at 1000m the controller CPU-throttles during sync
        # storms and app refreshes queue for tens of minutes. Memory: the
        # startup cluster-cache rebuild peaks well above steady state — at
        # 1Gi the controller OOM-crash-loops (exit 137 ~100s after start),
        # and peaks came within a few MiB of a 2Gi limit.
        cpu: 2000m
        memory: 3Gi
    # Setting affinity replaces the chart's preset, so its soft
    # anti-affinity between shards is restated. The hard rule keeps the
    # controller off the node running Prometheus: the two largest memory
    # consumers otherwise kept landing together.
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: argocd-application-controller
            topologyKey: kubernetes.io/hostname
        requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: prometheus-stack
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
  server:
    replicas: 2
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 75
      targetMemoryUtilizationPercentage: 75
    ingress:
      enabled: false
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
  applicationSet:
    enabled: true
    replicas: 2
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
  dex:
    enabled: false
  repoServer:
    replicas: 2
    # Also applied to the copyutil init container (chart default fallback).
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 75
      targetMemoryUtilizationPercentage: 75
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

# VSO (Vault Secrets Operator) integration for the core ArgoCD in argocd-system.
# Disabled by default so bootstrap (run.sh) can run before vault-operator / VSO
# are deployed. Enabled in ohmlab.yaml once the full stack is running.
vso:
  # -- Enable VSO integration. Set to true in instance values AFTER vault-operator
  # is deployed so VaultStaticSecret CRDs are available.
  enabled: false
  extraObjects: []
  vaultAuth:
    default:
      method: kubernetes
      mount: kubernetes
      kubernetes:
        role: ""
        serviceAccount: vso
        # -- The audience of the token VSO logs in with: a token meant for Vault,
        # not a Kubernetes API credential. The Vault role can require it.
        audiences: [vault]
  vaultConnection:
    default:
      address: "https://vault.vault-operator-system.svc.cluster.local:8200"
      skipTLSVerify: false
      caCertSecretRef: vault-tls
  vaultStaticSecrets: {}

rootManager:
  # -- Enable the root `manager` ApplicationSet that discovers every instance
  # under `argo-cd/instances/*` and renders one per-instance Application
  # pointing at the `instance-manager` chart.
  enabled: true
  repoURL:
    # -- Where the `instance-manager` chart comes from: a git repository, or an
    # `oci://` bundle with the layout of this repository (the chart is read at
    # `argo-cd/apps/instance-manager`).
    sources: "https://github.com/this-is-tobi/homelab.git"
    # -- Git repository holding `argo-cd/instances/*`: the instances are
    # discovered there and their `instance.yaml` read from it. Defaults to
    # `sources`; required when `sources` is an `oci://` bundle.
    values: ""
  # -- Revision of `sources` alone: a git revision, or the exact version of an
  # `oci://` bundle (required then). Defaults to `targetRevision`.
  sourcesRevision: ""
  # -- Git revision (branch, tag, commit) of the `values` repository, and of
  # `sources` when `sourcesRevision` is empty.
  targetRevision: main

projects:
  # AppProjects are split per scope to mirror real platform/tenant boundaries.
  # Adjust whitelists per scope to enforce stricter RBAC on tenant apps.
  core:
    # -- Render the `core` AppProject.
    enabled: true
    # -- Project name (referenced by `argo-cd/instances/<inst>/instance.yaml.projects.core`).
    name: admin-core
    description: "Homelab platform/core tier (infra, identity, observability, security)"
    # -- Repositories the project's Applications may take sources from. Empty:
    # `rootManager.repoURL.sources`, `rootManager.repoURL.values` and
    # `extraSourceRepos`, without duplicates. A bundle is listed with its
    # `oci://` scheme, a registry path without one.
    sourceRepos: []
    # -- Added to the derived `sourceRepos` (registries, other catalogs).
    extraSourceRepos: []
    destinations:
    - namespace: "*"
      server: "https://kubernetes.default.svc"
    clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: scheduling.k8s.io
      kind: PriorityClass
    - group: storage.k8s.io
      kind: StorageClass
    - group: storage.k8s.io
      kind: CSIDriver
    - group: networking.k8s.io
      kind: IngressClass
    - group: apiregistration.k8s.io
      kind: APIService
    - group: cert-manager.io
      kind: "*"
    - group: kyverno.io
      kind: "*"
    - group: policies.kyverno.io
      kind: "*"
    - group: policy
      kind: PodSecurityPolicy
    - group: gateway.networking.k8s.io
      kind: "*"
    - group: cilium.io
      kind: "*"
    - group: postgresql.cnpg.io
      kind: ClusterImageCatalog
    - group: trust.cert-manager.io
      kind: Bundle
    clusterResourceBlacklist: []
    namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
    namespaceResourceBlacklist: []
    roles:
    - name: admin
      description: Admin keycloak group
      groups:
      - admin
      policies:
      - p, proj:admin-core:admin, applications, *, admin-core/*, allow
    sourceNamespaces: []
  tenant:
    # -- Render the `tenant` AppProject.
    enabled: true
    # -- Project name (referenced by `argo-cd/instances/<inst>/instance.yaml.projects.tenant`).
    name: admin-tenant
    # ⚠ TRUST BOUNDARY: with the defaults below the tenant tier is NOT a
    # security boundary — ClusterRole/ClusterRoleBinding/CRD stay
    # whitelisted because real tenant apps need them (actions-runner-
    # controller and the personal argo-cd ship CRDs, homepage needs a
    # ClusterRole for discovery), and a tenant app could therefore bind
    # itself cluster-admin. Both tiers are admin-managed in this repo. If
    # your tenants are NOT trusted admins, override this project per
    # instance: drop ClusterRole/ClusterRoleBinding/CustomResourceDefinition
    # from clusterResourceWhitelist, constrain `destinations` to the tenant
    # namespace pattern, and blacklist ResourceQuota/LimitRange in
    # namespaceResourceBlacklist so tenants cannot lift their own limits.
    description: Homelab tenant/apps tier (user-facing services)
    # -- Repositories the project's Applications may take sources from. Empty:
    # derived like the `core` project's.
    sourceRepos: []
    # -- Added to the derived `sourceRepos`.
    extraSourceRepos: []
    destinations:
    - namespace: "*"
      server: "https://kubernetes.default.svc"
    clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: IngressClass
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: cert-manager.io
      kind: "*"
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: gateway.networking.k8s.io
      kind: "*"
    clusterResourceBlacklist: []
    namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
    namespaceResourceBlacklist: []
    roles:
    - name: admin
      description: Admin keycloak group
      groups:
      - admin
      policies:
      - p, proj:admin-tenant:admin, applications, *, admin-tenant/*, allow
    sourceNamespaces: []

# Grafana dashboards shipped with this chart (templates/dashboards.yaml): the
# Argo CD dashboard. Off by default so a consumer without Grafana's sidecar
# does not get an unused ConfigMap.
monitoring:
  dashboards:
    enabled: false
    folder: Services
