apiVersion: v2
name: prometheus-stack
type: application
version: 0.1.0
dependencies:
- name: kube-prometheus-stack
  alias: kube-prometheus-stack
  version: 92.21.2
  repository: oci://ghcr.io/prometheus-community/charts
- name: vso-utils
  alias: vso
  version: 2.4.0
  repository: oci://ghcr.io/this-is-tobi/charts
# Grafana's database: rendered with Grafana only.
- name: cluster
  alias: cnpg
  version: 0.9.0
  repository: https://cloudnative-pg.github.io/charts
  condition: kube-prometheus-stack.grafana.enabled
- name: loki
  alias: loki
  version: 21.0.0
  repository: https://grafana-community.github.io/helm-charts
  condition: lokiStack.enabled
- name: alloy
  alias: alloy
  version: 1.15.0
  repository: https://grafana.github.io/helm-charts
  condition: alloy.enabled
