{{- if not (.Values.lanOnly | default dict).sourceRange }}
{{- fail "lanOnly.sourceRange is required: the source ranges the lan-only Middleware lets through (your LAN or VPN, and the pod range of in-cluster callers)" }}
{{- end }}
---
# Gate for the internal UIs (hubble, traefik dashboard, longhorn — see each
# app's HTTPRoute filters). Their hostnames may resolve publicly (a wildcard
# DNS record covers them), so this middleware is the actual access boundary,
# not DNS.
#
# Default remoteAddr strategy deliberately, NOT X-Forwarded-For: the gateway's
# HAProxy already speaks PROXY protocol v2 to traefik (same mechanism the
# crowdsec bouncer relies on for real client IPs), so remoteAddr is already
# correct and unspoofable from outside. Trusting XFF here would let anyone
# on the internet set their own header and walk straight through the gate.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-only
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: traefik
spec:
  ipAllowList:
    sourceRange:
    {{- toYaml .Values.lanOnly.sourceRange | nindent 4 }}
