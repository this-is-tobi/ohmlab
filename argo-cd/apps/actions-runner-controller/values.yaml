  template:
    spec:
      # The runner image's own user.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: runner
        # Pin a version: the Kyverno policy refuses the latest tag.
        image: ghcr.io/actions/actions-runner:2.338.2
        command:
