# The template the runners' container hook applies to the pods it creates for
# container jobs and steps (templates/hook-template.yaml): its pod fields
# replace the hook's and `$job` stands for the job container (ADR 0134 of
# actions/runner-container-hooks). Job and service containers run as the
# runner's user: an image that needs root fails, as require-non-root refuses
# its pod.
hookTemplate:
  spec:
    securityContext:
      runAsNonRoot: true
      runAsUser: 1001
      runAsGroup: 1001
      seccompProfile:
        type: RuntimeDefault
    containers:
    - name: $job
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "2"
          memory: 4Gi

vso:
  extraObjects:
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: vso
  # How every VaultAuth logs in: the method and mount the instance's manager
  # gives (global.ohmlab.vault.auth, jwt for an instance that reads another
  # instance's Vault), else kubernetes.
  vaultAuthDefaults:
    method: '{{ dig "ohmlab" "vault" "auth" "method" "kubernetes" (.Values.global | default dict) }}'
    mount: '{{ dig "ohmlab" "vault" "auth" "mount" "kubernetes" (.Values.global | default dict) }}'
  vaultAuth:
    default:
      login:
        role: actions-runner-controller
        serviceAccount: vso
        audiences: [vault]
  vaultConnection:
    default:
      address: "https://vault.vault-operator-system.svc.cluster.local:8200"
      skipTLSVerify: false
      caCertSecretRef: vault-tls
  # The mount and path of each secret that sets none: the ones the manager
  # gives this app's tier (global.ohmlab.vault.mount, and
  # global.ohmlab.vault.pathPrefix followed by actions-runner-controller).
  vaultStaticSecretDefaults:
    mount: '{{ dig "ohmlab" "vault" "mount" "" (.Values.global | default dict) }}'
    path: '{{ with dig "ohmlab" "vault" "pathPrefix" "" (.Values.global | default dict) }}{{ . }}/actions-runner-controller{{ end }}'
  vaultStaticSecrets:
    # GitHub App credentials, in the keys the runner scale sets expect. The
    # Vault path holds githubApp.{id,installationId,privateKey}.
    githubApp:
      type: kv-v2
      vaultAuthRef: actions-runner-controller-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: github-app
        create: true
        type: Opaque
        transformation:
          excludeRaw: true
          excludes:
          - ".*"
          templates:
            github_app_id:
              text: '{{ get .Secrets "githubApp" | dig "id" "" }}'
            github_app_installation_id:
              text: '{{ get .Secrets "githubApp" | dig "installationId" "" }}'
            github_app_private_key:
              text: '{{ get .Secrets "githubApp" | dig "privateKey" "" }}'

