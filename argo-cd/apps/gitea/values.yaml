gateway:
  enabled: false
  gatewayName: ""
  gatewayNamespace: ""
  # Extra gateways to also attach routes to (e.g. during the APISIX→Traefik
  # migration): [{name, namespace?}] — sectionName is reused from the route.
  extraParentRefs: []
  routes: []

# Zero-trust NetworkPolicy for this namespace (templates/networkpolicy.yaml).
# Disabled by default — real rules live in the instance override.
networkPolicy:
  enabled: false
  egressDeny: true
  prometheusScrapePorts: []
  extraIngress: []
  extraEgress: []

gitea:
  replicaCount: 3
  # The image is rootless (uid/gid 1000) but the chart leaves the security
  # context empty by default — declare it explicitly so the kyverno
  # require-non-root policy (which checks fields, not images) admits the pods.
  podSecurityContext:
    fsGroup: 1000
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    # Restricted PSS (tenant namespace); pod-level covers the init containers.
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
  # Exposed via Gateway API HTTPRoute (gateway.routes) — no Ingress.
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  initContainers:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 512Mi
  serviceAccount:
    create: true
    automountServiceAccountToken: true
  persistence:
    enabled: true
    size: 25Gi
    accessModes:
    - ReadWriteMany
  gitea:
    admin:
      username: ""
      password: ""
      email: ""
    oauth:
    - name: Keycloak
      provider: openidConnect
      existingSecret: gitea-sso
      autoDiscoverUrl: ""
      scopes: openid profile email roles groups
      adminGroup: /admin
      groupClaimName: groups
      # groupTeamMap: ""
      # groupTeamMapRemoval: true
    # Valkey URIs carry the auth password, so they arrive via GITEA__* env
    # vars from the gitea-valkey-auth secret (additionalConfigFromEnvs below)
    # instead of the plain-text app.ini.
    additionalConfigFromEnvs:
    - name: GITEA__CACHE__HOST
      valueFrom:
        secretKeyRef:
          name: gitea-valkey-auth
          key: cache-host
    - name: GITEA__SESSION__PROVIDER_CONFIG
      valueFrom:
        secretKeyRef:
          name: gitea-valkey-auth
          key: session-config
    - name: GITEA__QUEUE__CONN_STR
      valueFrom:
        secretKeyRef:
          name: gitea-valkey-auth
          key: queue-conn
    config:
      cache:
        ADAPTER: redis
      session:
        PROVIDER: redis
      queue:
        TYPE: redis
      database:
        DB_TYPE: postgres
        HOST: ""
        NAME: ""
        USER: ""
        PASSWD: ""
        # CNPG serves TLS by default — encrypt the connection (gitea default is disable).
        SSL_MODE: require
      cron.GIT_GC_REPOS:
        ENABLED: false
      server:
        DOMAIN: ""
        ROOT_URL: ""
        # Explicit on purpose: the upstream chart only defaults HTTP_PORT from
        # a helper that runs AFTER the http Service template is rendered, so
        # without this the Service ships `targetPort:` empty (the API server
        # silently defaults it — but rendered manifests fail schema checks).
        HTTP_PORT: 3000
        SSH_LISTEN_PORT: 2222
      openid:
        ENABLE_OPENID_SIGNIN: true
        ENABLE_OPENID_SIGNUP: true
        WHITELISTED_URIS: ""
      service:
        SHOW_REGISTRATION_BUTTON: false
        DISABLE_REGISTRATION: true
        ALLOW_ONLY_EXTERNAL_REGISTRATION: true
      oauth2_client:
        OPENID_CONNECT_SCOPES: openid profile email roles groups
        REGISTER_EMAIL_CONFIRM: false
        ENABLE_AUTO_REGISTRATION: true
        ACCOUNT_LINKING: auto
        USERNAME: email
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
  postgresql-ha:
    enabled: false
    primary:
      persistence:
        size: 25Gi
  valkey-cluster:
    enabled: false
  valkey:
    enabled: false

valkey:
  fullnameOverride: gitea-valkey
  architecture: standalone
  replicaCount: 1
  # Password auth — delivered from Vault via VSO (gitea-valkey-auth secret,
  # key `password`); gitea receives it embedded in the rediss:// URIs.
  auth:
    enabled: true
    existingSecret: gitea-valkey-auth
    existingSecretPasswordKey: password
  # Server TLS on port 6380 (chart switches service+container port when
  # enabled). Cert issued by templates/valkey-certificates.yaml; authClients
  # stays off because gitea's redis URI cannot carry a client cert.
  tls:
    enabled: true
    existingSecret: gitea-valkey-tls
    authClients: false
  service:
    port: 6379
  # Merged over the chart default (fsGroup 1000); the chart's container
  # context already meets the rest of restricted PSS.
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

cnpg:
  fullnameOverride: gitea-pg-cluster
  version:
    postgresql: "17"
  cluster:
    # Image resolved for the major above from the shared catalog (see the
    # cloudnative-pg app); bumping `version.postgresql` runs an in-place
    # pg_upgrade.
    imageCatalogRef:
      kind: ClusterImageCatalog
      name: postgresql-standard-trixie
    # Masters are excluded from CNPG scheduling (they run etcd), narrowing
    # placement to worker nodes. 2 instances + PDB is sufficient HA for
    # this workload's criticality at homelab scale.
    instances: 2
    # Protects against voluntary disruption (drain/descheduler): with
    # masters excluded from CNPG scheduling and only 2 instances, losing
    # one to an eviction would leave a single replica. A drain on the
    # node hosting a PDB-protected instance needs --disable-eviction/
    # --force until CNPG relocates it first.
    enablePDB: true
    enableSuperuserAccess: false
    initdb:
      database: gitea
      owner: gitea
    storage:
      size: 7Gi
    walStorage:
      enabled: true
      size: 3Gi
    postgresql:
      # Caps WAL retained by replication slots: a lagging/dead replica costs
      # a re-clone, not disk pressure on the primary.
      parameters:
        max_slot_wal_keep_size: 1GB
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    affinity:
      topologyKey: kubernetes.io/hostname
      # Masters run etcd — keep data-bearing workloads off them.
      nodeSelector:
        node-type: worker
    # PodMonitor for the cnpg_* metrics (chart default is disabled) — the
    # cloudnative-pg Grafana dashboard was showing no data for every cluster
    # in the repo until this was turned on.
    monitoring:
      enabled: true
      prometheusRule:
        # HAWarning fires permanently below 3 instances, and ZoneSpread
        # needs topology.kubernetes.io/zone labels the nodes don't carry.
        excludeRules:
        - CNPGClusterHAWarning
        - CNPGClusterZoneSpreadWarning
      instrumentation:
        # The chart renders this queries ConfigMap but never wires it into
        # the Cluster, so it would only sit there unused.
        logicalReplication: false
  backups:
    enabled: true
    method: plugin
    pluginConfiguration:
      name: barman-cloud.cloudnative-pg.io
    endpointURL: ""
    destinationPath: "s3://"
    # VSO-managed (never inline keys here). The chart hardcodes the
    # ACCESS_KEY_ID / ACCESS_SECRET_KEY key names.
    secret:
      create: false
      name: gitea-pg-cluster-backup
    # The chart has no S3 region setting; the barman sidecar picks it up
    # from the standard AWS env var instead.
    instanceSidecarConfiguration:
      env:
      - name: AWS_DEFAULT_REGION
        valueFrom:
          secretKeyRef:
            name: gitea-pg-cluster-backup
            key: S3_REGION
    # Chart default requests AES256 server-side encryption, which not every
    # S3-compatible store implements — defer to the bucket's own default.
    wal:
      encryption: ""
    data:
      encryption: ""
    retentionPolicy: 30d
    scheduledBackups:
    - name: daily
      schedule: "0 0 0 * * *"
      backupOwnerReference: self
      method: plugin
      pluginConfiguration:
        name: barman-cloud.cloudnative-pg.io

vso:
  extraObjects:
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: vso
  vaultAuth:
    default:
      method: kubernetes
      mount: kubernetes
      kubernetes:
        role: gitea
        serviceAccount: vso
        audiences: [vault]
  vaultConnection:
    default:
      address: "https://vault.vault-operator-system.svc.cluster.local:8200"
      skipTLSVerify: false
      caCertSecretRef: vault-tls
  vaultStaticSecrets:
    # Valkey password + full connection URIs (password embedded, so they are
    # delivered as a secret and injected via GITEA__* env vars rather than
    # living in the plain-text app.ini config).
    giteaValkeyAuth:
      mount: ""
      path: ""
      type: kv-v2
      vaultAuthRef: gitea-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: gitea-valkey-auth
        create: true
        type: Opaque
        transformation:
          excludeRaw: true
          excludes:
          - ".*"
          templates:
            password:
              text: '{{ get .Secrets "valkey" | dig "password" "" }}'
            cache-host:
              text: 'rediss://:{{ get .Secrets "valkey" | dig "password" "" }}@gitea-valkey:6380/0?pool_size=100&idle_timeout=180s&skipverify=true&'
            session-config:
              text: 'rediss://:{{ get .Secrets "valkey" | dig "password" "" }}@gitea-valkey:6380/0?pool_size=100&idle_timeout=180s&skipverify=true&'
            queue-conn:
              text: 'rediss://:{{ get .Secrets "valkey" | dig "password" "" }}@gitea-valkey:6380/0?pool_size=100&idle_timeout=180s&skipverify=true&'
    giteaAdmin:
      mount: ""
      path: ""
      type: kv-v2
      vaultAuthRef: gitea-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: gitea-admin
        create: true
        type: kubernetes.io/basic-auth
        transformation:
          excludeRaw: true
          excludes:
          - ".*"
          templates:
            username:
              text: '{{ get .Secrets "admin" | dig "username" "" }}'
            password:
              text: '{{ get .Secrets "admin" | dig "password" "" }}'
    giteaDbInfos:
      mount: ""
      path: ""
      type: kv-v2
      vaultAuthRef: gitea-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: gitea-db-infos
        create: true
        type: Opaque
        transformation:
          excludeRaw: true
          excludes:
          - ".*"
          templates:
            DB_URL:
              text: 'postgresql://{{ get .Secrets "postgres" | dig "app" "username" "" }}:{{ get .Secrets "postgres" | dig "app" "password" "" }}@{{ get .Secrets "postgres" | dig "host" "" }}:{{ get .Secrets "postgres" | dig "port" "" }}/{{ get .Secrets "postgres" | dig "database" "" }}'
            DB_HOST:
              text: '{{ get .Secrets "postgres" | dig "host" "" }}'
            DB_PORT:
              text: '{{ get .Secrets "postgres" | dig "port" "" }}'
    giteaDbAdmin:
      mount: ""
      path: ""
      type: kv-v2
      vaultAuthRef: gitea-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: gitea-pg-cluster-admin
        create: true
        type: kubernetes.io/basic-auth
        transformation:
          excludeRaw: true
          excludes:
          - ".*"
          templates:
            username:
              text: '{{ get .Secrets "postgres" | dig "admin" "username" "" }}'
            password:
              text: '{{ get .Secrets "postgres" | dig "admin" "password" "" }}'
    giteaDbApp:
      mount: ""
      path: ""
      type: kv-v2
      vaultAuthRef: gitea-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: gitea-pg-cluster-app
        create: true
        type: kubernetes.io/basic-auth
        transformation:
          excludeRaw: true
          excludes:
          - ".*"
          templates:
            username:
              text: '{{ get .Secrets "postgres" | dig "app" "username" "" }}'
            password:
              text: '{{ get .Secrets "postgres" | dig "app" "password" "" }}'
    giteaPgBackup:
      mount: ""
      path: ""
      type: kv-v2
      vaultAuthRef: gitea-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: gitea-pg-cluster-backup
        create: true
        type: Opaque
        transformation:
          excludeRaw: true
          excludes:
          - ".*"
          templates:
            S3_ENDPOINT:
              text: '{{ get .Secrets "postgres" | dig "s3" "endpoint" "" }}'
            S3_BUCKET_NAME:
              text: '{{ get .Secrets "postgres" | dig "s3" "bucketName" "" }}'
            S3_BUCKET_PREFIX:
              text: '{{ get .Secrets "postgres" | dig "s3" "bucketPrefix" "" }}'
            ACCESS_KEY_ID:
              text: '{{ get .Secrets "postgres" | dig "s3" "accessKey" "" }}'
            ACCESS_SECRET_KEY:
              text: '{{ get .Secrets "postgres" | dig "s3" "secretKey" "" }}'
            S3_REGION:
              text: '{{ get .Secrets "postgres" | dig "s3" "region" "" }}'
    giteaSso:
      mount: ""
      path: ""
      type: kv-v2
      vaultAuthRef: gitea-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: gitea-sso
        create: true
        type: Opaque
        transformation:
          excludeRaw: true
          excludes:
          - ".*"
          templates:
            OIDC_CLIENT_ID:
              text: '{{ get .Secrets "keycloak" | dig "clientId" "" }}'
            OIDC_CLIENT_SECRET:
              text: '{{ get .Secrets "keycloak" | dig "clientSecret" "" }}'
            key:
              text: '{{ get .Secrets "keycloak" | dig "clientId" "" }}'
            secret:
              text: '{{ get .Secrets "keycloak" | dig "clientSecret" "" }}'

# Grafana dashboards shipped with this app (templates/dashboards.yaml).
monitoring:
  dashboards:
    enabled: true
    folder: Services
