# Valkey's serving certificate (Gitea's cache, sessions and queue), from
# valkeyCertificate.issuerRef or else from a CA of this namespace. Server TLS
# only: Gitea's Redis URI cannot carry a client certificate, so Valkey runs
# with authClients off. Gitea verifies it against the CA in the same Secret.
{{- if not .Values.valkeyCertificate.issuerRef }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: gitea-valkey-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gitea-valkey-ca
spec:
  isCA: true
  commonName: gitea-valkey-ca
  secretName: gitea-valkey-ca
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: gitea-valkey-selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: gitea-valkey-ca
spec:
  ca:
    secretName: gitea-valkey-ca
---
{{- end }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gitea-valkey-tls
spec:
  secretName: gitea-valkey-tls
  duration: 2160h
  renewBefore: 360h
  usages:
  - server auth
  # valkey-cli health probes connect with --cert/--key: allow client usage too.
  - client auth
  dnsNames:
  - gitea-valkey
  - gitea-valkey.{{ .Release.Namespace }}
  - gitea-valkey.{{ .Release.Namespace }}.svc
  - gitea-valkey.{{ .Release.Namespace }}.svc.cluster.local
  - gitea-valkey-headless
  - "*.gitea-valkey-headless.{{ .Release.Namespace }}.svc.cluster.local"
  - localhost
  ipAddresses:
  - 127.0.0.1
  issuerRef:
  {{- with .Values.valkeyCertificate.issuerRef }}
    {{- toYaml . | nindent 4 }}
  {{- else }}
    name: gitea-valkey-ca
    kind: Issuer
  {{- end }}
