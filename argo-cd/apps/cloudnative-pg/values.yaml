# Zero-trust NetworkPolicy for this namespace (templates/networkpolicy.yaml).
# Disabled by default — real rules live in the instance override.
networkPolicy:
  enabled: false
  egressDeny: true
  prometheusScrapePorts: []
  extraIngress: []
  extraEgress: []

# Metrics, alerts and dashboard for the operator. The Postgres clusters are
# scraped and alerted on by the cluster chart in each app; these rules add
# only what that chart's rules lack.
monitoring:
  enabled: true
  # 2x the operator's ~650 samples.
  sampleLimit: 1500
  prometheusRule:
    enabled: true
  dashboards:
    enabled: true
    folder: Services

cloudnative-pg:
  crds:
    create: true
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

plugin-barman-cloud:
  crds:
    create: true
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

# -- Cluster-wide Postgres image catalogs. Every app's CNPG Cluster resolves
# its image through `imageCatalogRef` + its `version.postgresql` major, so a
# patch bump lands here once instead of in each app. Entries mirror the
# upstream catalogs (github.com/cloudnative-pg/artifacts, image-catalogs/)
# and stay digest-pinned; Renovate proposes the bumps.
clusterImageCatalogs:
  postgresql-standard-trixie:
  - major: 17
    image: ghcr.io/cloudnative-pg/postgresql:17.11-202611090810-standard-trixie@sha256:b310491521ece4ec0f5a44008ac607352e96bff20883833d0acd833d80d26c5b
  - major: 18
    image: ghcr.io/cloudnative-pg/postgresql:18.6-202611090812-standard-trixie@sha256:de572898499fab9406f0da51929da562f96f3be40ca79fafea8ec1a8d5b42065
