apiVersion: v2
name: vault-operator
type: application
version: 0.1.0
description: Bank Vaults operator for GitOps-native Vault management
dependencies:
- name: vault-operator
  version: 1.24.1
  repository: oci://ghcr.io/bank-vaults/helm-charts
  condition: vault-operator.enabled
- name: vault-secrets-operator
  alias: vso
  version: 2.0.0
  repository: https://helm.releases.hashicorp.com
  condition: vso.enabled
- name: backup-utils
  alias: backup-utils
  version: 2.6.1
  repository: oci://ghcr.io/this-is-tobi/charts
  condition: backup-utils.enabled
