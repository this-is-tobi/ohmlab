gateway:
  enabled: false
  gatewayName: ""
  gatewayNamespace: ""
  # Extra gateways to also attach routes to (e.g. during the APISIX→Traefik
  # migration): [{name, namespace?}] — sectionName is reused from the route.
  extraParentRefs: []
  routes: []
  # Source ranges Vault's routes admit, through the Traefik Middleware
  # vault-source-range, first in every rule's filters: for a hub, the remote
  # clusters' outbound addresses and the admins' networks. Empty: no
  # allowlist. It holds only where Traefik sees the client's own address
  # (PROXY protocol from the load balancer in front of it, or
  # externalTrafficPolicy: Local).
  sourceRange: []
  # BackendTLSPolicy so Gateway-API controllers connect to vault over TLS
  # (see templates/backendtlspolicy.yaml). Requires Gateway API ≥v1.6 CRDs.
  backendTLS: false

# Zero-trust NetworkPolicy for this namespace (templates/networkpolicy.yaml).
# Disabled by default — real rules live in the instance override.
networkPolicy:
  enabled: false
  egressDeny: true
  # The ports the chart's monitors scrape: 8200 (Vault), 8383 (the bank-vaults
  # operator) and 8443 (the Vault Secrets Operator, behind kube-rbac-proxy).
  prometheusScrapePorts: []
  extraIngress: []
  extraEgress: []

# Bank Vaults Operator Configuration. A cluster that reads a remote Vault keeps
# VSO alone: `enabled: false` here, with `vault.enabled` and
# `vaultOidcCredentials.enabled` false too.
vault-operator:
  enabled: true
  replicaCount: 1
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  # The operator is a plain Go binary — run it as nobody (matches the
  # webhook's upstream defaults).
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
      - ALL

# The KV mount of the core tier's secrets: the ohmlab system's, one for every
# instance. The tenant tier's secrets are in the instance's own mount
# (global.ohmlab.names.vaultMount). An instance whose core secrets are still in
# its own mount sets its name here.
systemMount: ohmlab

vault:
  enabled: true
  name: vault
  # size stays 3 (not reduced like CNPG) — raft consensus needs an odd
  # number for quorum; 2 would be strictly worse than 3 (zero fault
  # tolerance for writes, same failure surface). Masters run etcd,
  # latency-sensitive to disk/CPU contention on this cluster's Pi4/
  # SD-USB-class storage — keep this data-bearing workload off them
  # entirely.
  size: 3
  nodeSelector:
    node-type: worker
  image:
    repository: hashicorp/vault
    tag: 2.2.2
  bankVaultsImage: "ghcr.io/bank-vaults/bank-vaults:v1.33.2"
  service:
    type: ClusterIP
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9102"
  storage:
    raft:
      enabled: true
      size: 10Gi
      storageClass: longhorn
  unseal:
    kubernetes:
      enabled: true
      secretName: vault-unseal-keys
  config:
    ui: true
    tls:
      enabled: true
    telemetry:
      # /v1/sys/metrics exposes only operational telemetry (no secret
      # values), reachable exclusively via the internal ClusterIP service —
      # HashiCorp's own documented pattern for Prometheus scraping without
      # provisioning and rotating a dedicated Vault token. See
      # templates/vault-servicemonitor.yaml.
      unauthenticated: true
      retention: 10m
      disableHostname: true
  externalConfig:
    # Remote clusters whose instances read their secrets from this Vault, the
    # hub: other Kubernetes clusters, each running instances whose
    # instance.yaml sets `vault.hub` to this instance. Named "spoke" to keep
    # apart from the core/tenant tiers: a spoke instance has both tiers in its
    # own KV mount.
    #
    # Per instance, the chart renders a KV v2 mount, a `jwt` auth mount
    # jwt-<instance> that validates the cluster's projected ServiceAccount
    # tokens, and per app a read-only role and policy derived from this
    # Vault's own kubernetes role of that app: its one namespace with the
    # instance's prefix and suffix, its one service account, and the rules of
    # its policies (`policies` or `token_policies`), on the instance's mount
    # alone. Those rules must be HCL `path "..." { capabilities = [...] }`
    # stanzas with read, list or deny, comment lines aside: any other text,
    # a path outside that mount, a namespace another instance of the cluster
    # binds, or a name or mount this Vault already uses fails the render.
    # The jwt method is what makes this work: the `kubernetes` method
    # validates a token by calling TokenReview on the cluster that issued it,
    # so it needs a route from Vault INTO every remote API server, the
    # opposite of the direction that survives NAT and firewalls.
    #
    # Empty by default, so a single-cluster instance renders no jwt mounts.
    spokeClusters: []
    # - name: nonprod                # the cluster, named in errors
    #   # `iss` of that cluster's tokens. Default: oidcDiscoveryUrl, else
    #   # https://kubernetes.default.svc.cluster.local, the value k3s gives
    #   # every cluster, which pins nothing on its own: isolation then comes
    #   # from publicKeys.
    #   issuer: https://oidc.example.com/id/nonprod
    #   # Exactly one of oidcDiscoveryUrl and publicKeys. A managed cluster
    #   # publishes its keys at its issuer: Vault fetches them from there over
    #   # HTTPS (required), never from the cluster's API server, and follows
    #   # the provider's rotations. Vault reads the discovery document when the
    #   # mount is configured, so this Vault needs egress to every issuer: an
    #   # unreachable one stops the configuration of every instance.
    #   oidcDiscoveryUrl: https://oidc.example.com/id/nonprod
    #   # Else the cluster's PEM public keys, pinned:
    #   #   kubectl --context <ctx> get --raw /openid/v1/jwks
    #   # then each JWK converted to a PEM SubjectPublicKeyInfo. Public key
    #   # material, safe to commit. Re-pin when the cluster rotates its
    #   # ServiceAccount signing keys, or every login there fails with "no
    #   # known key successfully validated the token signature".
    #   # publicKeys:
    #   # - |
    #   #   -----BEGIN PUBLIC KEY-----
    #   #   ...
    #   #   -----END PUBLIC KEY-----
    #   audience: vault              # the audience VSO requests (default)
    #   tokenTtl: 1h                 # default; tokenMaxTtl: 4h by default
    #   instances:
    #   - name: dev                  # the instance; its jwt mount is jwt-dev
    #     mount: dev                 # its KV mount (default: the name)
    #     # An app's namespace is this prefix, the one namespace this Vault's
    #     # kubernetes role of the app binds, then this suffix.
    #     namespacePrefix: dev-
    #     namespaceSuffix: ""
    #     # The apps that read secrets there, each with a kubernetes role of
    #     # the same name in `auth` below. An entry may set its namespace and
    #     # service account instead of deriving them.
    #     apps:
    #     - gitea
    #     - name: keycloak
    #       namespace: dev-sso
    #       serviceAccount: vso
    # Each policy's rules go through tpl with two KV mounts: .systemMount, the
    # core tier's (systemMount), and .kvMount, the tenant tier's, the
    # instance's own (global.ohmlab.names.vaultMount, else ohmlab). An app reads
    # "{{ .systemMount }}/data/platforms/+/core/<app>" and
    # "{{ .kvMount }}/data/platforms/+/tenant/<app>". Vault's own templating
    # has to be escaped: {{ "{{identity.entity.id}}" }}.
    policies:
    - name: admin
      rules: |
        # Superadmin policy — equivalent to root token access.
        # Assigned via Vault OIDC role bound to the 'admin' Keycloak group.
        path "*" {
          capabilities = ["create", "read", "update", "delete", "list", "sudo", "patch"]
        }
    # Each Argo CD reads only its own tier's path, not both as the other apps
    # do: the core one's (the ohmlab chart, in argocd-system) holds the
    # credentials of the clusters it deploys to, which the tenant's personal
    # Argo CD must not read.
    - name: argo-cd
      rules: |
        path "{{ .kvMount }}/data/platforms/+/tenant/argo-cd" {
          capabilities = ["read", "list"]
        }
    - name: argo-cd-core
      rules: |
        path "{{ .systemMount }}/data/platforms/+/core/argo-cd" {
          capabilities = ["read", "list"]
        }
    - name: vault
      rules: |
        path "{{ .systemMount }}/data/platforms/+/core/keycloak" {
          capabilities = ["read", "list"]
        }
        path "{{ .kvMount }}/data/platforms/+/tenant/keycloak" {
          capabilities = ["read", "list"]
        }
        # The snapshot job's key: vault-operator's claim record.
        path "{{ .systemMount }}/data/platforms/+/core/vault-operator/s3" {
          capabilities = ["read"]
        }
    - name: cert-manager
      rules: |
        path "{{ .systemMount }}/data/platforms/+/core/cert-manager" {
          capabilities = ["read", "list"]
        }
        path "{{ .kvMount }}/data/platforms/+/tenant/cert-manager" {
          capabilities = ["read", "list"]
        }
    - name: coder
      rules: |
        path "{{ .systemMount }}/data/platforms/+/core/coder" {
          capabilities = ["read", "list"]
        }
        path "{{ .kvMount }}/data/platforms/+/tenant/coder" {
          capabilities = ["read", "list"]
        }
        path "{{ .systemMount }}/data/platforms/+/core/coder/s3" {
          capabilities = ["read"]
        }
        path "{{ .kvMount }}/data/platforms/+/tenant/coder/s3" {
          capabilities = ["read"]
        }
    - name: gitea
      rules: |
        path "{{ .systemMount }}/data/platforms/+/core/gitea" {
          capabilities = ["read", "list"]
        }
        path "{{ .kvMount }}/data/platforms/+/tenant/gitea" {
          capabilities = ["read", "list"]
        }
        path "{{ .systemMount }}/data/platforms/+/core/gitea/s3" {
          capabilities = ["read"]
        }
        path "{{ .kvMount }}/data/platforms/+/tenant/gitea/s3" {
          capabilities = ["read"]
        }
    - name: harbor
      rules: |
        path "{{ .systemMount }}/data/platforms/+/core/harbor" {
          capabilities = ["read", "list"]
        }
        path "{{ .kvMount }}/data/platforms/+/tenant/harbor" {
          capabilities = ["read", "list"]
        }
        path "{{ .systemMount }}/data/platforms/+/core/harbor/s3" {
          capabilities = ["read"]
        }
        path "{{ .kvMount }}/data/platforms/+/tenant/harbor/s3" {
          capabilities = ["read"]
        }
    - name: keycloak
      rules: |
        # Keycloak reads its own secret only — client credentials are centralized
        # under keycloak's path at .clients.<app>.{clientId,clientSecret}
        path "{{ .systemMount }}/data/platforms/+/core/keycloak" {
          capabilities = ["read", "list"]
        }
        path "{{ .kvMount }}/data/platforms/+/tenant/keycloak" {
          capabilities = ["read", "list"]
        }
        path "{{ .systemMount }}/data/platforms/+/core/keycloak/s3" {
          capabilities = ["read"]
        }
        path "{{ .kvMount }}/data/platforms/+/tenant/keycloak/s3" {
          capabilities = ["read"]
        }
    - name: mattermost
      rules: |
        path "{{ .systemMount }}/data/platforms/+/core/mattermost" {
          capabilities = ["read", "list"]
        }
        path "{{ .kvMount }}/data/platforms/+/tenant/mattermost" {
          capabilities = ["read", "list"]
        }
        path "{{ .systemMount }}/data/platforms/+/core/mattermost/s3" {
          capabilities = ["read"]
        }
        path "{{ .kvMount }}/data/platforms/+/tenant/mattermost/s3" {
          capabilities = ["read"]
        }
    - name: rustfs
      rules: |
        path "{{ .systemMount }}/data/platforms/+/core/rustfs" {
          capabilities = ["read", "list"]
        }
        path "{{ .kvMount }}/data/platforms/+/tenant/rustfs" {
          capabilities = ["read", "list"]
        }
    # The backups store (docs/10): a core app of the rustfs chart, whose root
    # keys the storage target reads too.
    - name: rustfs-backups
      rules: |
        path "{{ .systemMount }}/data/platforms/+/core/rustfs-backups" {
          capabilities = ["read", "list"]
        }
    - name: outline
      rules: |
        path "{{ .systemMount }}/data/platforms/+/core/outline" {
          capabilities = ["read", "list"]
        }
        path "{{ .kvMount }}/data/platforms/+/tenant/outline" {
          capabilities = ["read", "list"]
        }
        path "{{ .systemMount }}/data/platforms/+/core/outline/s3" {
          capabilities = ["read"]
        }
        path "{{ .kvMount }}/data/platforms/+/tenant/outline/s3" {
          capabilities = ["read"]
        }
    - name: prometheus-stack
      rules: |
        path "{{ .systemMount }}/data/platforms/+/core/prometheus-stack" {
          capabilities = ["read", "list"]
        }
        path "{{ .kvMount }}/data/platforms/+/tenant/prometheus-stack" {
          capabilities = ["read", "list"]
        }
        path "{{ .systemMount }}/data/platforms/+/core/prometheus-stack/s3" {
          capabilities = ["read"]
        }
        path "{{ .kvMount }}/data/platforms/+/tenant/prometheus-stack/s3" {
          capabilities = ["read"]
        }
    - name: argo-workflows
      rules: |
        path "{{ .systemMount }}/data/platforms/+/core/argo-workflows" {
          capabilities = ["read", "list"]
        }
        path "{{ .kvMount }}/data/platforms/+/tenant/argo-workflows" {
          capabilities = ["read", "list"]
        }
    - name: mlflow
      rules: |
        path "{{ .systemMount }}/data/platforms/+/core/mlflow" {
          capabilities = ["read", "list"]
        }
        path "{{ .kvMount }}/data/platforms/+/tenant/mlflow" {
          capabilities = ["read", "list"]
        }
        path "{{ .systemMount }}/data/platforms/+/core/mlflow/s3" {
          capabilities = ["read"]
        }
        path "{{ .kvMount }}/data/platforms/+/tenant/mlflow/s3" {
          capabilities = ["read"]
        }
    - name: vaultwarden
      rules: |
        path "{{ .systemMount }}/data/platforms/+/core/vaultwarden" {
          capabilities = ["read", "list"]
        }
        path "{{ .kvMount }}/data/platforms/+/tenant/vaultwarden" {
          capabilities = ["read", "list"]
        }
        path "{{ .systemMount }}/data/platforms/+/core/vaultwarden/s3" {
          capabilities = ["read"]
        }
        path "{{ .kvMount }}/data/platforms/+/tenant/vaultwarden/s3" {
          capabilities = ["read"]
        }
    - name: sonarqube
      rules: |
        path "{{ .systemMount }}/data/platforms/+/core/sonarqube" {
          capabilities = ["read", "list"]
        }
        path "{{ .kvMount }}/data/platforms/+/tenant/sonarqube" {
          capabilities = ["read", "list"]
        }
        path "{{ .systemMount }}/data/platforms/+/core/sonarqube/s3" {
          capabilities = ["read"]
        }
        path "{{ .kvMount }}/data/platforms/+/tenant/sonarqube/s3" {
          capabilities = ["read"]
        }
    - name: actions-runner-controller
      rules: |
        path "{{ .systemMount }}/data/platforms/+/core/actions-runner-controller" {
          capabilities = ["read", "list"]
        }
        path "{{ .kvMount }}/data/platforms/+/tenant/actions-runner-controller" {
          capabilities = ["read", "list"]
        }
    - name: sops
      rules: |
        path "{{ .systemMount }}/data/platforms/+/core/sops" {
          capabilities = ["read", "list"]
        }
        path "{{ .kvMount }}/data/platforms/+/tenant/sops" {
          capabilities = ["read", "list"]
        }
    - name: crowdsec
      rules: |
        path "{{ .systemMount }}/data/platforms/+/core/crowdsec" {
          capabilities = ["read", "list"]
        }
        path "{{ .kvMount }}/data/platforms/+/tenant/crowdsec" {
          capabilities = ["read", "list"]
        }
        path "{{ .systemMount }}/data/platforms/+/core/crowdsec/s3" {
          capabilities = ["read"]
        }
        path "{{ .kvMount }}/data/platforms/+/tenant/crowdsec/s3" {
          capabilities = ["read"]
        }
    - name: longhorn
      rules: |
        path "{{ .systemMount }}/data/platforms/+/core/longhorn" {
          capabilities = ["read", "list"]
        }
        path "{{ .kvMount }}/data/platforms/+/tenant/longhorn" {
          capabilities = ["read", "list"]
        }
    - name: apisix
      rules: |
        path "{{ .systemMount }}/data/platforms/+/core/apisix" {
          capabilities = ["read", "list"]
        }
        path "{{ .kvMount }}/data/platforms/+/tenant/apisix" {
          capabilities = ["read", "list"]
        }
    - name: traefik
      rules: |
        path "{{ .systemMount }}/data/platforms/+/core/traefik" {
          capabilities = ["read", "list"]
        }
        path "{{ .kvMount }}/data/platforms/+/tenant/traefik" {
          capabilities = ["read", "list"]
        }
    - name: traefik-dashboard
      rules: |
        path "{{ .systemMount }}/data/platforms/+/core/traefik-dashboard" {
          capabilities = ["read", "list"]
        }
        path "{{ .kvMount }}/data/platforms/+/tenant/traefik-dashboard" {
          capabilities = ["read", "list"]
        }
    - name: hubble
      rules: |
        path "{{ .systemMount }}/data/platforms/+/core/hubble" {
          capabilities = ["read", "list"]
        }
        path "{{ .kvMount }}/data/platforms/+/tenant/hubble" {
          capabilities = ["read", "list"]
        }
    auth:
    - type: kubernetes
      # Each role takes only tokens meant for Vault: every VaultAuth requests the
      # audience `vault` (kubernetes.audiences), and the API token of a pod of the
      # same ServiceAccount does not log in.
      roles:
      - name: argo-cd
        bound_service_account_names: [vso]
        bound_service_account_namespaces: [argo-cd]
        audience: vault
        policies: [argo-cd]
        ttl: 1h
      - name: argo-cd-core
        # VSO service account in argocd-system for the core ArgoCD OIDC secret
        bound_service_account_names: [vso]
        bound_service_account_namespaces: [argocd-system]
        audience: vault
        policies: [argo-cd-core]
        ttl: 1h
      - name: cert-manager
        bound_service_account_names: [vso]
        bound_service_account_namespaces: [cert-manager]
        audience: vault
        policies: [cert-manager]
        ttl: 1h
      - name: coder
        bound_service_account_names: [vso]
        bound_service_account_namespaces: [coder]
        audience: vault
        policies: [coder]
        ttl: 1h
      - name: gitea
        bound_service_account_names: [vso]
        bound_service_account_namespaces: [gitea]
        audience: vault
        policies: [gitea]
        ttl: 1h
      - name: harbor
        bound_service_account_names: [vso]
        bound_service_account_namespaces: [harbor]
        audience: vault
        policies: [harbor]
        ttl: 1h
      - name: keycloak
        bound_service_account_names: [vso]
        bound_service_account_namespaces: [keycloak-system]
        audience: vault
        policies: [keycloak]
        ttl: 1h
      - name: mattermost
        bound_service_account_names: [vso]
        bound_service_account_namespaces: [mattermost]
        audience: vault
        policies: [mattermost]
        ttl: 1h
      - name: rustfs
        bound_service_account_names: [vso]
        bound_service_account_namespaces: [rustfs]
        audience: vault
        policies: [rustfs]
        ttl: 1h
      - name: rustfs-backups
        bound_service_account_names: [vso]
        bound_service_account_namespaces: [rustfs-backups]
        audience: vault
        policies: [rustfs-backups]
        ttl: 1h
      - name: outline
        bound_service_account_names: [vso]
        bound_service_account_namespaces: [outline]
        audience: vault
        policies: [outline]
        ttl: 1h
      - name: prometheus-stack
        bound_service_account_names: [vso]
        bound_service_account_namespaces: [prometheus-stack]
        audience: vault
        policies: [prometheus-stack]
        ttl: 1h
      - name: argo-workflows
        bound_service_account_names: [vso]
        bound_service_account_namespaces: [argo-workflows]
        audience: vault
        policies: [argo-workflows]
        ttl: 1h
      - name: mlflow
        bound_service_account_names: [vso]
        bound_service_account_namespaces: [mlflow]
        audience: vault
        policies: [mlflow]
        ttl: 1h
      - name: vaultwarden
        bound_service_account_names: [vso]
        bound_service_account_namespaces: [vaultwarden]
        audience: vault
        policies: [vaultwarden]
        ttl: 1h
      - name: sonarqube
        bound_service_account_names: [vso]
        bound_service_account_namespaces: [sonarqube]
        audience: vault
        policies: [sonarqube]
        ttl: 1h
      - name: actions-runner-controller
        bound_service_account_names: [vso]
        bound_service_account_namespaces: [actions-runner-controller]
        audience: vault
        policies: [actions-runner-controller]
        ttl: 1h
      - name: sops
        bound_service_account_names: [vso]
        # The sops app deploys to its own `sops` namespace (catalog default =
        # app name); this previously said kube-system, which 403'd every sync.
        bound_service_account_namespaces: [sops]
        audience: vault
        policies: [sops]
        ttl: 1h
      - name: crowdsec
        bound_service_account_names: [vso]
        bound_service_account_namespaces: [crowdsec]
        audience: vault
        policies: [crowdsec]
        ttl: 1h
      - name: longhorn
        bound_service_account_names: [vso]
        bound_service_account_namespaces: [longhorn-system]
        audience: vault
        policies: [longhorn]
        ttl: 1h
      - name: apisix
        bound_service_account_names: [vso]
        bound_service_account_namespaces: [apisix]
        audience: vault
        policies: [apisix]
        ttl: 1h
      - name: traefik
        bound_service_account_names: [vso]
        bound_service_account_namespaces: [traefik]
        audience: vault
        policies: [traefik, traefik-dashboard]
        ttl: 1h
      - name: cilium
        # VSO service account in kube-system, for the Hubble UI oauth2-proxy
        # secret only (least-privilege: not a general kube-system grant).
        bound_service_account_names: [vso]
        bound_service_account_namespaces: [kube-system]
        audience: vault
        policies: [hubble]
        ttl: 1h
      # VSO service account in vault-operator-system for vault-oidc-credentials.
      # Uses the 'vault' policy (read <KV mount>/data/platforms/+/+/keycloak).
      - name: vault-operator
        bound_service_account_names: [vso]
        bound_service_account_namespaces: [vault-operator-system]
        audience: vault
        policies: [vault]
        ttl: 1h
    # Remote clusters get their jwt mounts from spokeClusters above, not from
    # an entry here: one at a spoke instance's jwt-<instance> path fails the
    # render, since its roles would accept that cluster's tokens.
    #
    # Vault UI OIDC auth via Keycloak.
    # Enabled per-instance via externalConfig.oidcEnabled: true.
    # vault-oidc-credentials K8s secret is created automatically by VSO
    # (vaultOidcCredentials.enabled: true + path in instance values).
    # Vault pod picks up VAULT_OIDC_CLIENT_SECRET via extraEnvsConfig (optional: true).
    # Role: 'admin' — only members of the Keycloak '/admin' group can log in.
    # Disabled by default — instances turn it on and provide the discovery URL
    # and the redirect URIs.
    oidcEnabled: false
    oidcDiscoveryUrl: ""
    oidcClientId: "vault-core"
    oidcDefaultRole: "admin"
    oidcRoleName: "admin"
    oidcBoundGroups:
    - "/admin"
    oidcRedirectUris: []
    # Rendered through tpl like the policies. When the system mount is the
    # instance's, the first entry of that path is kept.
    secrets:
    - path: "{{ .systemMount }}"
      type: kv
      description: "{{ .systemMount | title }} secrets KV store"
      options:
        version: 2
    - path: "{{ .kvMount }}"
      type: kv
      description: "{{ .kvMount | title }} secrets KV store"
      options:
        version: 2
  startupSecrets: []
  resources:
    vault:
      limits:
        cpu: "1"
        memory: 1Gi
      requests:
        cpu: 500m
        memory: 512Mi
    bankVaults:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi
  # Merged by container name into the operator-generated vault-configurer pod
  # (spec.vaultConfigurerPodSpec). resources.bankVaults above sizes both that
  # pod and the unseal sidecar inside every Vault pod, so raising it there
  # rolls the whole raft cluster; overriding here restarts only the
  # configurer. At 100m the configurer throttled in over a third of its CFS
  # periods, the unseal sidecars in under 4%.
  configurerPodSpec:
    containers:
    - name: bank-vaults
      resources:
        limits:
          cpu: 500m
  # Vault 2.0.0+ runs as vault user (UID 100, GID 1000) by default
  # runAsUser: 100 at pod level ensures the config-templating init container also writes
  # vault.json as UID 100, so the vault container can read it (fixes permission denied)
  securityContext:
    runAsUser: 100
    fsGroup: 1000
  serviceAccount: vault
  caNamespaces:
  - "*"
  # Exposed via Gateway API HTTPRoute + BackendTLSPolicy — no Ingress.
  ingress:
    enabled: false
  # Operator auto-generates this ServiceMonitor unconditionally with a
  # bearerTokenFile requirement (/etc/prometheus/config_out/.vault-token)
  # that was never provisioned — every scrape failed with "unable to read
  # authorization credentials", a local file-read error on Prometheus's
  # side that unauthenticated_metrics_access (below) can't fix by itself.
  # Disabled here; templates/vault-servicemonitor.yaml replaces it with a
  # git-managed one that needs no token at all.
  serviceMonitor:
    enabled: false
  statsd:
    enabled: true
    image: "prom/statsd-exporter:v0.31.0"
  # Additional env vars injected into the Vault pod (merged after the built-in
  # POD_NAME / VAULT_API_ADDR / SKIP_CHOWN / SKIP_SETCAP entries).
  # Set per-instance — empty by default.
  extraEnvsConfig: []
  # Env vars passed to ALL bank-vaults pods, including vault-configurer —
  # unlike extraEnvsConfig/vaultEnvsConfig above, which only reaches the
  # Vault server container. Anything referenced via ${ .Env.X } inside
  # externalConfig (e.g. oidc_client_secret) is templated by vault-configurer
  # itself when it pushes that config through Vault's API, so secrets needed
  # there MUST go here, not extraEnvsConfig.
  envsConfig: []
  agent:
    enabled: true

vaultOidcCredentials:
  # VaultStaticSecret in vault-operator-system that creates vault-oidc-credentials
  # from core/keycloak.clients.vault.clientSecret (generated by initSecrets).
  # The Vault pod picks up VAULT_OIDC_CLIENT_SECRET via extraEnvsConfig (optional: true).
  enabled: true
  # Empty: the mount the manager gives the core tier (global.ohmlab.vault.mount),
  # else the system mount (systemMount): where the core tier's keycloak secret is.
  mount: ""
  # Empty: <global.ohmlab.vault.pathPrefix>/keycloak when the manager gives a
  # prefix, else platforms/production/core/keycloak.
  path: ""

# PEM of the CA that signs a remote Vault's certificate, for VSO on a cluster
# that reaches the hub's Vault on a private path: rendered as the Secret
# vault-hub-ca (key ca.crt), which vso.defaultVaultConnection.caCertSecret then
# names. Public material. A hub behind a public certificate needs none. Such a
# cluster also sets vso.defaultVaultConnection.address to the hub's route, and
# caCertSecret to vault-hub-ca or empty: vault-tls exists only where
# Bank-Vaults writes it.
hubCA: ""

vso:
  enabled: true
  controller:
    replicas: 2
    manager:
      resources:
        requests:
          memory: 256Mi
          cpu: 100m
        limits:
          memory: 512Mi
          cpu: 500m
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65532
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
      fsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
    rbac:
      create: true
    serviceAccount:
      create: true
      name: vault-secrets-operator
  defaultVaultConnection:
    enabled: true
    address: "https://vault.vault-operator-system.svc.cluster.local:8200"
    skipTLSVerify: false
    caCertSecret: vault-tls
  defaultAuthMethod:
    enabled: false
    # Uncomment to enable global auth (not recommended for multi-tenant)
    # namespace: "vault-operator-system"
    # method: kubernetes
    # mount: kubernetes
    # allowedNamespaces: ["*"]
    # kubernetes:
    #   role: "default"  # Must exist in Vault
    #   serviceAccount: default
    #   tokenAudiences: ["vault"]
  # VSO resources: VaultConnection and VaultAuth for managing VSO secrets
  vaultConnection:
    default:
      address: "https://vault.vault-operator-system.svc.cluster.local:8200"
      skipTLSVerify: false
      caCertSecretRef: vault-tls
  vaultAuth:
    default:
      method: kubernetes
      mount: kubernetes
      kubernetes:
        role: vault-operator
        serviceAccount: vso
        audiences: [vault]
      vaultConnectionRef: default

# Vault's raft snapshot, daily, to vault-operator's claim (docs/10): the
# instance-manager turns it on with the claim, whose record VaultStaticSecret
# vault-backup copies into Secret vault-backup (key, bucket, endpoint, region,
# CA).
backup-utils:
  fullnameOverride: backup
  enabled: false
  backups:
    vaultSnapshot:
      enabled: true
      type: vault
      job:
        schedule: "0 22 * * *"
        successfulJobsHistoryLimit: 3
      # Logs in as ServiceAccount vault-backup (role and policy vault-backup:
      # the raft snapshot alone) with a projected token of the vault audience,
      # then runs the image's script, which reads VAULT_TOKEN.
      serviceAccountName: vault-backup
      automountServiceAccountToken: false
      podLabels:
        ohmlab.fr/storage-client: vault
      # The image's user alpine by number, which the kubelet can check as
      # non-root (kyverno's require-non-root). Its root stays writable: the
      # script writes the snapshot and rclone's config in its home.
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      env:
        VAULT_ADDR: "https://vault.vault-operator-system.svc.cluster.local:8200"
        VAULT_CACERT: /etc/ohmlab/vault-ca/ca.crt
        RCLONE_CA_CERT: /etc/ohmlab/store-ca/ca.crt
        # The image's rclone remote says provider AWS, which puts the bucket in
        # the host name whatever force_path_style says: a store's Service has
        # no such names. rclone reads this before its config file.
        RCLONE_S3_PROVIDER: Other
        RETENTION: 30d
      secrets: {}
      envFrom:
      - secretRef:
          name: vault-backup
      extraVolumes:
      - name: vault-ca
        secret:
          secretName: vault-tls
          items:
          - key: ca.crt
            path: ca.crt
      - name: store-ca
        secret:
          secretName: vault-backup
          items:
          - key: ca.crt
            path: ca.crt
      - name: vault-token
        projected:
          sources:
          - serviceAccountToken:
              audience: vault
              expirationSeconds: 600
              path: token
      extraVolumeMounts:
      - name: vault-ca
        mountPath: /etc/ohmlab/vault-ca
        readOnly: true
      - name: store-ca
        mountPath: /etc/ohmlab/store-ca
        readOnly: true
      - name: vault-token
        mountPath: /var/run/secrets/ohmlab/vault
        readOnly: true
      container:
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        command:
        - /bin/bash
        - -c
        - export VAULT_TOKEN="$(vault write -field=token auth/kubernetes/login role=vault-backup jwt=@/var/run/secrets/ohmlab/vault/token)" && exec ./scripts/vault-backup.sh

# Hierarchical configuration structure for ohmlab utilities
# Used to configure Vault and other services declaratively in Git
#
# Naming convention:
#   ohmlab.<service>.<config-type>
#
# Example:
#   ohmlab.vault.secrets   → VaultSeed objects for the ohmlab controller
#   ohmlab.vault.identity  → the Vault resource's externalConfig (bank-vaults)
#
ohmlab:
  vault:
    # The secrets Vault holds, one entry per path: path, data, and the
    # optional rotate, prune and deletionPolicy (docs/08-controller.md).
    secrets: []
    # Render the entries as VaultSeed objects for the ohmlab controller
    # (templates/vault-seeds.yaml), which seeds them and keeps them as
    # declared. Nothing writes these paths while this is off.
    seeds:
      enabled: false
      # Render the objects only on a cluster that already has the kind, so a
      # sync never fails for want of the controller's CRD.
      requireCRD: true
    # Identity groups and their OIDC aliases. Rendered into the Vault CR's
    # externalConfig (groups, group-aliases), where bank-vaults applies them.
    # groups: [{name, type, policies, metadata}], groupAliases: [{name, group,
    # mountPath}]. mountPath defaults to the value below; an alias needs no
    # mountAccessor (bank-vaults finds it).
    identity:
      mountPath: oidc
      groups: []
      groupAliases: []
  # The ohmlab controller's Vault target (chart ohmlab-controller): the policy
  # it is granted and the Kubernetes-auth role it logs in with.
  controller:
    enabled: false
    # The namespace and ServiceAccount of its Deployment. The ServiceAccount is
    # ohmlab-controller-<deployment>: with a custom grouping, name that one.
    namespace: ohmlab-system
    serviceAccount: ohmlab-controller-vault
    # Empty: the system mount (systemMount) and the instance's
    # (global.ohmlab.names.vaultMount), one pair of stanzas each. Set, that
    # mount alone.
    kvMount: ""
    # Grants delete on the metadata path, for deletionPolicy: Delete. Pair it
    # with targets.vault.allowDelete in the controller's chart.
    allowDelete: false
    # The only token audience the role accepts: the controller's chart logs in
    # with a projected token for this audience (targets.vault.backend.auth.audience),
    # so the pod's API token, or any other token of the ServiceAccount, cannot
    # log in. Empty accepts a token of any audience.
    audience: vault
    # The controller's storage target, in its own Deployment of the namespace
    # above. With stores (the instance-manager gives them from instance.yaml's
    # storage block, docs/10), it gets the policy ohmlab-controller-storage,
    # the claims' records on the mounts above and each store's root keys, and
    # a role of that name for its ServiceAccount, with the same audience.
    storage:
      serviceAccount: ohmlab-controller-storage
      # [{name, path}]: each store and its root keys, <mount>/<path>.
      stores: []

# Grafana dashboards shipped with this app (templates/dashboards.yaml).
monitoring:
  dashboards:
    enabled: true
    folder: Services
