{{- if .Values.vault.enabled }}
---
apiVersion: vault.banzaicloud.com/v1alpha1
kind: Vault
metadata:
  name: {{ .Values.vault.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  size: {{ .Values.vault.size }}
  {{- if .Values.vault.nodeSelector }}
  nodeSelector:
    {{- toYaml .Values.vault.nodeSelector | nindent 4 }}
  {{- end }}
  image: {{ .Values.vault.image.repository }}:{{ .Values.vault.image.tag }}
  bankVaultsImage: {{ .Values.vault.bankVaultsImage }}
  {{- if or .Values.vault.service.annotations .Values.vault.agent.enabled }}
  vaultAnnotations:
    {{- if .Values.vault.service.annotations }}
    {{- toYaml .Values.vault.service.annotations | nindent 4 }}
    {{- end }}
    {{- if .Values.vault.agent.enabled }}
    vault.security.banzaicloud.io/vault-addr: "https://{{ .Values.vault.name }}:8200"
    vault.security.banzaicloud.io/vault-role: "default"
    vault.security.banzaicloud.io/vault-skip-verify: "{{ not .Values.vault.config.tls.enabled }}"
    {{- end }}
  {{- end }}
  serviceType: {{ .Values.vault.service.type }}
  {{- if .Values.vault.storage.raft.enabled }}
  volumeClaimTemplates:
  - metadata:
      name: vault-raft
    spec:
      accessModes:
        - ReadWriteOnce
      {{- if .Values.vault.storage.raft.storageClass }}
      storageClassName: {{ .Values.vault.storage.raft.storageClass }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.vault.storage.raft.size }}
  {{- end }}
  unsealConfig:
    {{- if .Values.vault.unseal.kubernetes.enabled }}
    kubernetes:
      secretNamespace: {{ .Release.Namespace }}
      secretName: {{ .Values.vault.unseal.kubernetes.secretName }}
    {{- end }}
    {{- if .Values.vault.unseal.aws }}
    aws:
      {{- toYaml .Values.vault.unseal.aws | nindent 6 }}
    {{- end }}
    {{- if .Values.vault.unseal.gcp }}
    gcp:
      {{- toYaml .Values.vault.unseal.gcp | nindent 6 }}
    {{- end }}
    {{- if .Values.vault.unseal.azure }}
    azure:
      {{- toYaml .Values.vault.unseal.azure | nindent 6 }}
    {{- end }}
  # TLS configuration - let operator manage TLS certificate generation
  # When TLS is enabled, operator will automatically generate and manage certificates
  # with proper SANs including 127.0.0.1 for sidecar communication
  # {{- if .Values.vault.config.tls.enabled }}
  # existingTlsSecretName: vault-tls
  # {{- end }}
  vaultContainerSpec:
    name: vault
    securityContext:
      runAsNonRoot: true
      runAsUser: 100
      runAsGroup: 1000
      # The operator defaults to adding IPC_LOCK (for Vault's mlock), which
      # Kyverno's pod-security-baseline Enforce policy now rejects (no
      # non-default capabilities allowed). We already run with
      # disable_mlock: true above specifically so IPC_LOCK isn't needed —
      # explicitly declaring capabilities here (vaultContainerSpec is
      # merged field-by-field into the operator's container spec) is the
      # documented way to override that default instead of the operator
      # silently re-adding it.
      capabilities:
        drop:
        - ALL
    # vault-config (emptyDir) and vault-tls (Secret) are already mounted
    # automatically by the operator itself — see the TLS comment above.
    # Declaring them again here duplicates the operator's own auto-added
    # mounts (bank-vaults v1.24.0+) and makes the StatefulSet update fail
    # validation ("must be unique"), which silently blocks EVERY future
    # change to the Vault pod template. Only volumeClaimTemplate-backed
    # volumes (vault-raft) need an explicit mount — the operator has no way
    # to guess where those go.
    volumeMounts:
    - name: vault-raft
      mountPath: /vault/data
  config:
    ui: {{ .Values.vault.config.ui }}
    # disable_mlock: in Kubernetes, memory is managed by cgroups/resource limits
    # so mlock is unnecessary. Setting true allows running as non-root without
    # IPC_LOCK/SETFCAP capabilities, which is the more secure approach in containers.
    disable_mlock: true
    listener:
    - tcp:
        address: "0.0.0.0:8200"
        {{- if .Values.vault.config.tls.enabled }}
        tls_cert_file: /vault/tls/server.crt
        tls_key_file: /vault/tls/server.key
        {{- else }}
        tls_disable: true
        {{- end }}
        telemetry:
          unauthenticated_metrics_access: {{ .Values.vault.config.telemetry.unauthenticated }}
        cluster_address: "0.0.0.0:8201"
    storage:
      {{- if .Values.vault.storage.raft.enabled }}
      raft:
        path: /vault/data
        {{- if gt (.Values.vault.size | int) 1 }}
        retry_join:
          {{- range $i := until (.Values.vault.size | int) }}
          {{- if $.Values.vault.config.tls.enabled }}
          - leader_api_addr: https://{{ $.Values.vault.name }}-{{ $i }}.{{ $.Release.Namespace }}.svc.cluster.local:8200
            leader_ca_cert_file: /vault/tls/ca.crt
          {{- else }}
          - leader_api_addr: http://{{ $.Values.vault.name }}-{{ $i }}.{{ $.Release.Namespace }}.svc.cluster.local:8200
          {{- end }}
          {{- end }}
        {{- end }}
      {{- else if .Values.vault.storage.file }}
      file:
        path: /vault/file
      {{- end }}
    service_registration:
      kubernetes:
        namespace: {{ .Release.Namespace }}
    telemetry:
      prometheus_retention_time: {{ .Values.vault.config.telemetry.retention }}
      disable_hostname: {{ .Values.vault.config.telemetry.disableHostname }}
  externalConfig:
    {{- /*
      The controller's policy and role are added here, to copies of the lists,
      so an instance that replaces `policies` or `auth` wholesale (arrays are
      replaced, not merged) cannot lose them.
    */}}
    {{- $kv := dict "kvMount" (include "vault-operator.kvMount" .) "systemMount" (include "vault-operator.systemMount" .) "Template" .Template }}
    {{- $policies := list }}
    {{- range $p := .Values.vault.externalConfig.policies | default list }}
    {{- $p = deepCopy $p }}
    {{- if $p.rules }}{{ $_ := set $p "rules" (tpl $p.rules $kv) }}{{ end }}
    {{- $policies = append $policies $p }}
    {{- end }}
    {{- $auth := deepCopy (.Values.vault.externalConfig.auth | default list) }}
    {{- $spokes := include "vault-operator.spokes" (dict "Values" .Values "kv" $kv "auth" $auth) | fromYamlArray }}
    {{- $roles := list }}
    {{- if .Values.ohmlab.controller.enabled }}
    {{- $policies = append $policies (dict "name" "ohmlab-controller-vault" "rules" (include "vault-operator.controllerPolicy" .)) }}
    {{- $role := dict "name" "ohmlab-controller-vault" "bound_service_account_names" (list .Values.ohmlab.controller.serviceAccount) "bound_service_account_namespaces" (list .Values.ohmlab.controller.namespace) "policies" (list "ohmlab-controller-vault") "ttl" "15m" }}
    {{- with .Values.ohmlab.controller.audience }}{{ $_ := set $role "audience" . }}{{ end }}
    {{- $roles = append $roles $role }}
    {{- end }}
    {{- if .Values.ohmlab.controller.storage.stores }}
    {{- $policies = append $policies (dict "name" "ohmlab-controller-storage" "rules" (include "vault-operator.storagePolicy" .)) }}
    {{- $role := dict "name" "ohmlab-controller-storage" "bound_service_account_names" (list .Values.ohmlab.controller.storage.serviceAccount) "bound_service_account_namespaces" (list .Values.ohmlab.controller.namespace) "policies" (list "ohmlab-controller-storage") "ttl" "15m" }}
    {{- with .Values.ohmlab.controller.audience }}{{ $_ := set $role "audience" . }}{{ end }}
    {{- $roles = append $roles $role }}
    {{- end }}
    {{- /* The snapshot job reads the raft snapshot and nothing else. */}}
    {{- if (index .Values "backup-utils").enabled }}
    {{- $policies = append $policies (dict "name" "vault-backup" "rules" "path \"sys/storage/raft/snapshot\" { capabilities = [\"read\"] }\n") }}
    {{- $roles = append $roles (dict "name" "vault-backup" "bound_service_account_names" (list "vault-backup") "bound_service_account_namespaces" (list .Release.Namespace) "policies" (list "vault-backup") "ttl" "15m" "audience" "vault") }}
    {{- end }}
    {{- if $roles }}
    {{- $placed := false }}
    {{- range $a := $auth }}
    {{- if eq $a.type "kubernetes" }}
    {{- $_ := set $a "roles" (concat ($a.roles | default list) $roles) }}
    {{- $placed = true }}
    {{- end }}
    {{- end }}
    {{- if not $placed }}
    {{- $names := list }}{{ range $roles }}{{ $names = append $names .name }}{{ end }}
    {{- fail (printf "the roles %s need a kubernetes entry in vault.externalConfig.auth" (join ", " $names)) }}
    {{- end }}
    {{- end }}
    {{- if or $policies $spokes }}
    policies:
      {{- with $policies }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- /*
        One policy per app of a spoke instance: the rules of the policies its
        kubernetes role here lists, on the instance's own mount alone, and
        read-only (vault-operator.spokes). The shared policies above read
        their app's path in every environment of this Vault's own mounts:
        never hand a remote cluster one of those.
      */}}
      {{- range $i := $spokes }}
      {{- range $app := $i.apps }}
      - name: {{ $app.policy | quote }}
        rules: |
          {{- $app.rules | nindent 10 }}
      {{- end }}
      {{- end }}
    {{- end }}
    {{- if or $auth .Values.vault.externalConfig.oidcEnabled $spokes }}
    auth:
      {{- if $auth }}
      {{- toYaml $auth | nindent 6 }}
      {{- end }}
      {{- /*
        One jwt mount per spoke instance, validating its cluster's
        ServiceAccount tokens with that cluster's keys, so Vault never calls
        into the cluster's API server, unlike the kubernetes method, whose
        TokenReview call needs a route from Vault to every remote cluster.
        Every instance has apps (vault-operator.spokes): the configurer casts
        the roles unconditionally, and a mount with none fails the whole
        external config.
      */}}
      {{- range $i := $spokes }}
      - type: jwt
        path: {{ printf "jwt-%s" $i.name | quote }}
        config:
          {{- with $i.oidcDiscoveryUrl }}
          # The keys the cluster's issuer publishes, fetched over HTTPS: Vault
          # calls the issuer, never the cluster's API server, and follows the
          # provider's key rotations.
          oidc_discovery_url: {{ . | quote }}
          {{- else }}
          # Pinned keys: Vault calls nothing to validate a token.
          jwt_validation_pubkeys: {{ $i.publicKeys | toJson }}
          {{- end }}
          bound_issuer: {{ $i.issuer | quote }}
        roles:
        {{- range $app := $i.apps }}
        - name: {{ $app.name | quote }}
          # role_type must be explicit: a mount that has ever seen an oidc
          # role otherwise defaults new roles to oidc, which rejects a direct
          # JWT login.
          role_type: jwt
          user_claim: sub
          bound_audiences: [{{ $i.audience | quote }}]
          bound_subject: {{ printf "system:serviceaccount:%s:%s" $app.namespace $app.serviceAccount | quote }}
          bound_claims:
            # JSON-pointer syntax is required for nested claims: the token
            # carries kubernetes.io as an object, so a flat
            # "kubernetes.io/namespace" key fails login with `claim ... is
            # missing` — which reads like a policy fault, not a syntax one.
            "/kubernetes.io/namespace": {{ $app.namespace | quote }}
          token_policies: [{{ $app.policy | quote }}]
          # `default` is intentionally left in place (Vault appends it): VSO
          # renews its own token via auth/token/renew-self, which that policy
          # grants and nothing else here does.
          token_ttl: {{ $i.tokenTtl | quote }}
          token_max_ttl: {{ $i.tokenMaxTtl | quote }}
        {{- end }}
      {{- end }}
      {{- if .Values.vault.externalConfig.oidcEnabled }}
      - type: oidc
        path: oidc
        options:
          listing_visibility: "unauth"
        config:
          oidc_discovery_url: {{ .Values.vault.externalConfig.oidcDiscoveryUrl | quote }}
          oidc_client_id: {{ .Values.vault.externalConfig.oidcClientId | quote }}
          oidc_client_secret: ${ .Env.VAULT_OIDC_CLIENT_SECRET }
          default_role: {{ .Values.vault.externalConfig.oidcDefaultRole | quote }}
        roles:
        - name: {{ .Values.vault.externalConfig.oidcRoleName | quote }}
          user_claim: preferred_username
          groups_claim: groups
          bound_audiences:
          - {{ .Values.vault.externalConfig.oidcClientId | quote }}
          bound_claims:
            # toJson keeps valid (flow-style) YAML even when the list is empty.
            groups: {{ .Values.vault.externalConfig.oidcBoundGroups | toJson }}
          allowed_redirect_uris: {{ .Values.vault.externalConfig.oidcRedirectUris | toJson }}
          oidc_scopes:
          - openid
          - profile
          - email
          - groups
          policies:
          - {{ .Values.vault.externalConfig.oidcRoleName | quote }}
          ttl: 1h
      {{- end }}
    {{- end }}
    {{- /*
      Identity groups and their aliases (OIDC group mapping). bank-vaults adopts
      a group or alias that already exists by name and keeps its id.
    */}}
    {{- $identity := .Values.ohmlab.vault.identity }}
    {{- if $identity.groups }}
    groups:
    {{- range $g := $identity.groups }}
    - name: {{ $g.name | quote }}
      type: {{ $g.type | default "internal" | quote }}
      policies: {{ $g.policies | default list | toJson }}
      {{- with $g.metadata }}
      metadata:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    {{- end }}
    {{- if $identity.groupAliases }}
    {{- if and (eq ($identity.mountPath | default "oidc") "oidc") (not .Values.vault.externalConfig.oidcEnabled) }}
    {{- fail "ohmlab.vault.identity.groupAliases map groups of the oidc auth method: set vault.externalConfig.oidcEnabled, or mountPath to another auth method" }}
    {{- end }}
    group-aliases:
    {{- range $a := $identity.groupAliases }}
    - name: {{ $a.name | quote }}
      mountpath: {{ $a.mountPath | default $identity.mountPath | default "oidc" | quote }}
      group: {{ $a.group | quote }}
    {{- end }}
    {{- end }}
    {{- if or .Values.vault.externalConfig.secrets $spokes }}
    {{- /*
      The system mount and the instance's are one mount when an instance keeps
      its core secrets in its own: the first entry of a path is kept (a path
      left out is the engine type, as bank-vaults mounts it). Each spoke
      instance adds its own KV mount, which no other engine has.
    */}}
    {{- $secrets := list }}
    {{- $seen := dict }}
    {{- range $s := tpl (toYaml (.Values.vault.externalConfig.secrets | default list)) $kv | fromYamlArray }}
    {{- $path := toString ($s.path | default $s.type) }}
    {{- if not (hasKey $seen $path) }}
    {{- $_ := set $seen $path true }}
    {{- $secrets = append $secrets $s }}
    {{- end }}
    {{- end }}
    {{- range $i := $spokes }}
    {{- $secrets = append $secrets (dict "path" $i.mount "type" "kv" "description" (printf "%s secrets KV store" (title $i.mount)) "options" (dict "version" 2)) }}
    {{- end }}
    secrets:
      {{- toYaml $secrets | nindent 6 }}
    {{- end }}
    {{- if .Values.vault.externalConfig.startupSecrets }}
    startupSecrets:
      {{- toYaml .Values.vault.externalConfig.startupSecrets | nindent 6 }}
    {{- end }}
  {{- if .Values.vault.resources }}
  resources:
    {{- toYaml .Values.vault.resources | nindent 4 }}
  {{- end }}
  {{- if .Values.vault.securityContext }}
  securityContext:
    {{- toYaml .Values.vault.securityContext | nindent 4 }}
  {{- end }}
  {{- with .Values.vault.configurerPodSpec }}
  vaultConfigurerPodSpec:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  vaultEnvsConfig:
  - name: POD_NAME
    valueFrom:
      fieldRef:
        fieldPath: metadata.name
  - name: VAULT_API_ADDR
    value: "https://$(POD_NAME).{{ .Release.Namespace }}.svc.cluster.local:8200"
  - name: VAULT_CLUSTER_ADDR
    value: "https://$(POD_NAME).{{ .Release.Namespace }}.svc.cluster.local:8201"
  # Skip chown/setcap in the Vault entrypoint:
  # - SKIP_CHOWN: /vault/config is an operator-managed projected volume that cannot be chowned
  # - SKIP_SETCAP: setcap requires SETFCAP capability; not needed since disable_mlock is true
  # Both are required when running as the non-root vault user (Vault 2.0.0+ default).
  - name: SKIP_CHOWN
    value: "true"
  - name: SKIP_SETCAP
    value: "true"
  {{- if .Values.vault.extraEnvsConfig }}
  {{- toYaml .Values.vault.extraEnvsConfig | nindent 2 }}
  {{- end }}
  {{- if .Values.vault.envsConfig }}
  envsConfig:
  {{- toYaml .Values.vault.envsConfig | nindent 2 }}
  {{- end }}
  serviceAccount: {{ .Values.vault.serviceAccount }}
  {{- if .Values.vault.caNamespaces }}
  caNamespaces:
    {{- toYaml .Values.vault.caNamespaces | nindent 4 }}
  {{- end }}
  {{- if .Values.vault.ingress.enabled }}
  ingress:
    annotations:
      {{- toYaml .Values.vault.ingress.annotations | nindent 6 }}
    spec:
      ingressClassName: {{ .Values.vault.ingress.ingressClassName }}
      rules:
      - host: {{ .Values.vault.ingress.host }}
        http:
          paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.vault.name }}
                port:
                  number: 8200
      {{- if .Values.vault.ingress.tls.enabled }}
      tls:
      - hosts:
        - {{ .Values.vault.ingress.host }}
        secretName: {{ .Values.vault.ingress.tls.secretName }}
      {{- end }}
  {{- end }}
  {{- if .Values.vault.serviceMonitor.enabled }}
  serviceMonitorEnabled: true
  {{- end }}
  statsdDisabled: {{ not .Values.vault.statsd.enabled }}
  {{- if .Values.vault.statsd.enabled }}
  statsdImage: {{ .Values.vault.statsd.image }}
  {{- end }}
{{- end }}
