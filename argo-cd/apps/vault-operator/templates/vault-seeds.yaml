{{- /*
One VaultSeed per entry of ohmlab.vault.secrets, for the ohmlab controller. The
entries keep their shape: path, data, plus the optional rotate, prune and
deletionPolicy that the controller adds. The controller is the only writer of
these paths.

The kind exists once the controller's chart has synced. requireCRD keeps this
file from failing a sync on a cluster that does not have it yet; Argo CD renders
the app again at its next reconciliation once the CRD is there, because the
cluster's API versions are part of its manifest cache key.

The objects are the app's last sync wave. Argo CD waits for every object it
applies to be Healthy, and a seed is Healthy once the controller has reconciled
it: everything else in the app is applied first, so a seed that waits (the
controller down, a reference pending) holds nothing else back.
*/}}
{{- if and .Values.vault.enabled .Values.ohmlab.vault.seeds.enabled }}
{{- if or (not .Values.ohmlab.vault.seeds.requireCRD) (.Capabilities.APIVersions.Has "ohmlab.fr/v1alpha1/VaultSeed") }}
{{- $names := dict }}
{{- range $entry := .Values.ohmlab.vault.secrets }}
{{- $name := include "vault-operator.seedName" $entry.path }}
{{- if hasKey $names $name }}
{{- fail (printf "ohmlab.vault.secrets: %q and %q both become the VaultSeed %q" (get $names $name) $entry.path $name) }}
{{- end }}
{{- $_ := set $names $name $entry.path }}
---
apiVersion: ohmlab.fr/v1alpha1
kind: VaultSeed
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: vault-seed
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/part-of: ohmlab
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  path: {{ $entry.path | quote }}
  data:
    {{- toYaml $entry.data | nindent 4 }}
  {{- with $entry.rotate }}
  rotate:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if $entry.prune }}
  prune: true
  {{- end }}
  {{- with $entry.deletionPolicy }}
  deletionPolicy: {{ . }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
