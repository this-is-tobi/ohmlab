{{- if (index .Values "backup-utils").enabled }}
# The snapshot job's identity: the Kubernetes-auth role vault-backup is bound to
# it alone, and the job logs in with a projected token, not this API token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-backup
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: false
{{- end }}
