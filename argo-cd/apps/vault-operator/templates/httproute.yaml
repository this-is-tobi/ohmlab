{{- if .Values.gateway.enabled }}
{{- $gatewayName := .Values.gateway.gatewayName | default (dig "ohmlab" "names" "gateway" "ohmlab-gateway" (.Values.global | default dict)) }}
{{- $gatewayNamespace := .Values.gateway.gatewayNamespace | default "kube-system" }}
{{- range .Values.gateway.routes }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .name }}
spec:
  {{- $listener := .listener | default "https-wildcard" }}
  parentRefs:
    # Primary gateway first; extraParentRefs lets a route attach to a second
    # gateway (same listener names) during an ingress-controller migration —
    # the gateway HAProxy then decides which controller receives the traffic.
    - name: {{ $gatewayName }}
      namespace: {{ $gatewayNamespace }}
      sectionName: {{ $listener }}
    {{- range $.Values.gateway.extraParentRefs }}
    - name: {{ .name }}
      namespace: {{ .namespace | default $gatewayNamespace }}
      sectionName: {{ $listener }}
    {{- end }}
  hostnames:
    {{- range .hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    {{- range .rules }}
    {{- $filters := .filters | default list }}
    {{- if $.Values.gateway.sourceRange }}
    {{- $filters = prepend $filters (dict "type" "ExtensionRef" "extensionRef" (dict "group" "traefik.io" "kind" "Middleware" "name" "vault-source-range")) }}
    {{- end }}
    - matches:
        - path:
            type: {{ .pathType | default "PathPrefix" }}
            value: {{ .path | default "/" | quote }}
      {{- with $filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - name: {{ .backendService }}
          port: {{ .backendPort }}
    {{- end }}
{{- end }}
{{- end }}
