{{- $vault := dig "ohmlab" "vault" dict (.Values.global | default dict) }}
{{- $backup := dig "ohmlab" "storage" "vault" "enabled" false (.Values.global | default dict) }}
{{- if or .Values.vaultOidcCredentials.enabled $backup }}
---
# ServiceAccount used by VSO to authenticate against Vault in vault-operator-system.
# The 'vault-operator' Kubernetes auth role is bound to this SA with the 'vault'
# policy (read <system mount>/data/platforms/+/core/keycloak, and
# vault-operator's claim record).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vso
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
# VaultAuth using the namespace-default VaultConnection. Role: vault-operator → policy: vault.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-operator-vso-default
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  method: kubernetes
  mount: kubernetes
  vaultConnectionRef: default
  kubernetes:
    role: vault-operator
    serviceAccount: vso
    audiences: [vault]
    tokenExpirationSeconds: 600
{{- end }}
{{- if .Values.vaultOidcCredentials.enabled }}
---
# Reads core/keycloak from Vault (generated by initSecrets) and creates the
# vault-oidc-credentials K8s secret with VAULT_OIDC_CLIENT_SECRET.
# The Vault pod picks this up via extraEnvsConfig (optional: true) — OIDC auth
# becomes active on next pod restart once the env var is set.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vault-oidc-credentials
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  type: kv-v2
  mount: {{ .Values.vaultOidcCredentials.mount | default $vault.mount | default (include "vault-operator.systemMount" .) | quote }}
  path: {{ .Values.vaultOidcCredentials.path | default (ternary (printf "%s/keycloak" ($vault.pathPrefix | default "")) "platforms/production/core/keycloak" (not (empty $vault.pathPrefix))) | quote }}
  vaultAuthRef: vault-operator-vso-default
  refreshAfter: 1h
  hmacSecretData: true
  destination:
    name: vault-oidc-credentials
    create: true
    type: Opaque
    transformation:
      excludeRaw: true
      excludes:
        - ".*"
      templates:
        VAULT_OIDC_CLIENT_SECRET:
          text: >-
            {{`{{ get .Secrets "clients" | dig "vault-core" "clientSecret" "" }}`}}
{{- end }}
{{- if $backup }}
---
# The snapshot job's key to its bucket: vault-operator's claim record, which
# the controller's storage target writes, into Secret vault-backup. The job
# reads its S3_* keys and mounts its ca.crt as the store's CA.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vault-backup
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  type: kv-v2
  mount: {{ $vault.mount | default (include "vault-operator.systemMount" .) | quote }}
  path: {{ printf "%s/vault-operator/s3" (required "global.ohmlab.vault.pathPrefix is required for the vault claim's record" $vault.pathPrefix) | quote }}
  vaultAuthRef: vault-operator-vso-default
  refreshAfter: 1h
  hmacSecretData: true
  destination:
    name: vault-backup
    create: true
    type: Opaque
    transformation:
      excludeRaw: true
      excludes:
        - ".*"
      templates:
        S3_ENDPOINT:
          text: >-
            {{`{{ get .Secrets "vault" | dig "endpoint" "" }}`}}
        S3_ACCESS_KEY:
          text: >-
            {{`{{ get .Secrets "vault" | dig "accessKey" "" }}`}}
        S3_SECRET_KEY:
          text: >-
            {{`{{ get .Secrets "vault" | dig "secretKey" "" }}`}}
        S3_BUCKET_NAME:
          text: >-
            {{`{{ get .Secrets "vault" | dig "bucket" "" }}`}}
        S3_PATH_STYLE:
          text: >-
            {{`{{ get .Secrets "vault" | dig "pathStyle" "" }}`}}
        ca.crt:
          text: >-
            {{`{{ get .Secrets "vault" | dig "ca" "" }}`}}
{{- end }}
