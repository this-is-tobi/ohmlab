outline:
  image:
    repository: ghcr.io/this-is-tobi/mirror/outline
    tag: 1.12.0
  ingress:
    enabled: true
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-dns-prod
    hosts:
    - host: ""
      paths:
      - path: /
        pathType: Prefix
    tls:
    - hosts:
      - ""
      secretName: ""
  url: ""
  defaultLanguage: en_US
  # The chart auto-generates SECRET_KEY/UTILS_SECRET when no external secret is
  # given, which would re-roll them on every render and invalidate every stored
  # session and encrypted field. Both come from Vault instead.
  secretKeyExternalSecret:
    name: outline-config
    key: SECRET_KEY
  utilsSecretExternalSecret:
    name: outline-config
    key: UTILS_SECRET
  fileStorage:
    mode: s3
    uploadMaxSize: "26214400"
    s3:
      existingSecret: outline-s3
      accessKeyIdSecretKey: S3_ACCESS_KEY
      secretAccessKeySecretKey: S3_SECRET_KEY
      bucket: outline
      bucketUrl: ""
      region: ""
      forcePathStyle: true
      acl: private
  auth:
    oidc:
      enabled: true
      clientId: outline
      authUri: ""
      tokenUri: ""
      userInfoUri: ""
      usernameClaim: email
      displayName: Keycloak
      scopes:
      - openid
      - profile
      - email
      - groups
      - roles
      existingSecret:
        name: outline-sso
        clientSecretKey: OIDC_CLIENT_SECRET
  # Bundled subcharts are all off: postgres is the CNPG cluster below, redis is
  # the valkey release below, and object storage is external.
  redis:
    enabled: false
  postgresql:
    enabled: false
  minio:
    enabled: false
  externalRedis:
    host: outline-valkey
    port: 6379
    existingSecret: outline-valkey-auth
    usernameSecretKey: username
    passwordSecretKey: password
  externalPostgresql:
    host: outline-pg-cluster-rw
    port: 5432
    username: outline
    database: outline
    existingSecret: outline-pg-cluster-app
    passwordSecretKey: password
  database:
    sslMode: require
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: "1"
  # Pod Security restricted wants a seccomp profile set: the container
  # runtime's default (merged with the chart's own fsGroup).
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault

valkey:
  fullnameOverride: outline-valkey
  architecture: standalone
  replicaCount: 1
  # Password auth — delivered from Vault via VSO (outline-valkey-auth secret);
  # outline reads host/port/username/password and assembles the ioredis URL in
  # its entrypoint.
  auth:
    enabled: true
    existingSecret: outline-valkey-auth
    existingSecretPasswordKey: password
  # Plain TCP: the outline chart's entrypoint builds the ioredis connection
  # from host/port/username/password only, so it has no way to carry a CA or
  # switch the scheme to TLS.
  tls:
    enabled: false
  service:
    port: 6379
  persistence:
    enabled: true
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  # As for Outline, merged with this chart's own fsGroup.
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault

cnpg:
  fullnameOverride: outline-pg-cluster
  version:
    postgresql: "17"
  cluster:
    # Image resolved for the major above from the shared catalog (see the
    # cloudnative-pg app); bumping `version.postgresql` runs an in-place
    # pg_upgrade.
    imageCatalogRef:
      kind: ClusterImageCatalog
      name: postgresql-standard-trixie
    instances: 3
    enableSuperuserAccess: false
    initdb:
      database: outline
      owner: outline
    storage:
      size: 3Gi
    walStorage:
      enabled: true
      size: 3Gi
    postgresql:
      # Caps WAL retained by replication slots: a lagging/dead replica costs
      # a re-clone, not disk pressure on the primary.
      parameters:
        max_slot_wal_keep_size: 1GB
      # Refuses plaintext clients: CNPG's last rule (host all all all
      # scram-sha-256) would take them.
      pg_hba:
      - hostnossl all all all reject
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    affinity:
      topologyKey: kubernetes.io/hostname
    monitoring:
      instrumentation:
        # The chart renders this queries ConfigMap but never wires it into
        # the Cluster, so it would only sit there unused.
        logicalReplication: false
  backups:
    # The instance-manager turns it on with the app's pg claim (docs/10).
    enabled: false
    method: plugin
    pluginConfiguration:
      name: barman-cloud.cloudnative-pg.io
    endpointURL: ""
    destinationPath: "s3://<bucket-name>/<bucket-prefix>"
    # VSO-managed (never inline keys here). The chart hardcodes the
    # ACCESS_KEY_ID / ACCESS_SECRET_KEY key names.
    secret:
      create: false
      name: outline-pg-cluster-backup
    # The chart has no S3 region setting; the barman sidecar picks it up
    # from the standard AWS env var instead.
    instanceSidecarConfiguration:
      env:
      - name: AWS_DEFAULT_REGION
        valueFrom:
          secretKeyRef:
            name: outline-pg-cluster-backup
            key: S3_REGION
    # A plain resource synced before the Cluster: as a Helm hook, Argo CD runs
    # it as an untracked PreSync hook that outlives a disabled backup.
    objectStore:
      helmHook: false
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
    # Chart default requests AES256 server-side encryption, which not every
    # S3-compatible store implements — defer to the bucket's own default.
    wal:
      encryption: ""
      compression: gzip
    data:
      encryption: ""
      compression: gzip
    retentionPolicy: 30d
    scheduledBackups:
    - name: daily
      schedule: "0 25 20 * * *"
      backupOwnerReference: self
      method: plugin
      pluginConfiguration:
        name: barman-cloud.cloudnative-pg.io

vso:
  extraObjects:
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: vso
  # How every VaultAuth logs in: the method and mount the instance's manager
  # gives (global.ohmlab.vault.auth, jwt for an instance that reads another
  # instance's Vault), else kubernetes.
  vaultAuthDefaults:
    method: '{{ dig "ohmlab" "vault" "auth" "method" "kubernetes" (.Values.global | default dict) }}'
    mount: '{{ dig "ohmlab" "vault" "auth" "mount" "kubernetes" (.Values.global | default dict) }}'
  vaultAuth:
    default:
      login:
        role: outline
        serviceAccount: vso
        audiences: [vault]
  # The mount and path of each secret that sets none: the ones the manager
  # gives this app's tier (global.ohmlab.vault.mount, and
  # global.ohmlab.vault.pathPrefix followed by outline).
  vaultStaticSecretDefaults:
    mount: '{{ dig "ohmlab" "vault" "mount" "" (.Values.global | default dict) }}'
    path: '{{ with dig "ohmlab" "vault" "pathPrefix" "" (.Values.global | default dict) }}{{ . }}/outline{{ end }}'
  vaultStaticSecrets:
    outlineConfig:
      type: kv-v2
      vaultAuthRef: outline-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: outline-config
        create: true
        type: Opaque
        transformation:
          excludeRaw: true
          excludes:
          - ".*"
          templates:
            SECRET_KEY:
              text: '{{ get .Secrets "app" | dig "secretKey" "" }}'
            UTILS_SECRET:
              text: '{{ get .Secrets "app" | dig "utilsSecret" "" }}'
    outlineS3:
      type: kv-v2
      vaultAuthRef: outline-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: outline-s3
        create: true
        type: Opaque
        transformation:
          excludeRaw: true
          excludes:
          - ".*"
          templates:
            S3_ACCESS_KEY:
              text: '{{ get .Secrets "s3" | dig "accessKey" "" }}'
            S3_SECRET_KEY:
              text: '{{ get .Secrets "s3" | dig "secretKey" "" }}'
    outlineValkeyAuth:
      type: kv-v2
      vaultAuthRef: outline-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: outline-valkey-auth
        create: true
        type: Opaque
        transformation:
          excludeRaw: true
          excludes:
          - ".*"
          templates:
            # Valkey has no ACL users configured, so outline authenticates as
            # the built-in `default` user with the requirepass secret.
            username:
              text: default
            password:
              text: '{{ get .Secrets "valkey" | dig "password" "" }}'
    outlineDbAdmin:
      type: kv-v2
      vaultAuthRef: outline-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: outline-pg-cluster-admin
        create: true
        type: kubernetes.io/basic-auth
        transformation:
          excludeRaw: true
          excludes:
          - ".*"
          templates:
            username:
              text: '{{ get .Secrets "postgres" | dig "admin" "username" "" }}'
            password:
              text: '{{ get .Secrets "postgres" | dig "admin" "password" "" }}'
    outlineDbApp:
      type: kv-v2
      vaultAuthRef: outline-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: outline-pg-cluster-app
        create: true
        type: kubernetes.io/basic-auth
        transformation:
          excludeRaw: true
          excludes:
          - ".*"
          templates:
            username:
              text: '{{ get .Secrets "postgres" | dig "app" "username" "" }}'
            password:
              text: '{{ get .Secrets "postgres" | dig "app" "password" "" }}'
    # The plugin's key: the pg claim's record once the claim is on
    # (global.ohmlab.storage.pg), else postgres.s3 at the app's own path.
    outlinePgBackup:
      type: kv-v2
      path: '{{ with dig "ohmlab" "vault" "pathPrefix" "" (.Values.global | default dict) }}{{ . }}/outline{{ if dig "ohmlab" "storage" "pg" "enabled" false ($.Values.global | default dict) }}/s3{{ end }}{{ end }}'
      vaultAuthRef: outline-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: outline-pg-cluster-backup
        create: true
        type: Opaque
        transformation:
          excludeRaw: true
          excludes:
          - ".*"
          templates:
            ACCESS_KEY_ID:
              text: '{{ with get .Secrets "pg" }}{{ dig "accessKey" "" . }}{{ else }}{{ get .Secrets "postgres" | dig "s3" "accessKey" "" }}{{ end }}'
            ACCESS_SECRET_KEY:
              text: '{{ with get .Secrets "pg" }}{{ dig "secretKey" "" . }}{{ else }}{{ get .Secrets "postgres" | dig "s3" "secretKey" "" }}{{ end }}'
            S3_REGION:
              text: '{{ with get .Secrets "pg" }}{{ dig "region" "" . }}{{ else }}{{ get .Secrets "postgres" | dig "s3" "region" "" }}{{ end }}'
            ca.crt:
              text: '{{ with get .Secrets "pg" }}{{ dig "ca" "" . }}{{ end }}'
    outlineSso:
      type: kv-v2
      vaultAuthRef: outline-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: outline-sso
        create: true
        type: Opaque
        transformation:
          excludeRaw: true
          excludes:
          - ".*"
          templates:
            OIDC_CLIENT_ID:
              text: '{{ get .Secrets "keycloak" | dig "clientId" "" }}'
            OIDC_CLIENT_SECRET:
              text: '{{ get .Secrets "keycloak" | dig "clientSecret" "" }}'
