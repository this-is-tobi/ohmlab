vaultwarden:
  # One replica whose data (the JWT signing key, attachments, sends) sits on a
  # ReadWriteOnce volume: a StatefulSet replaces its pod in place, where a
  # Deployment's rolling update waits on the volume the old pod still holds.
  # The chart would pick a Deployment once both a database and a data volume
  # are set.
  resourceType: StatefulSet
  domain: ""
  # The admin page's token, from Vault (admin.token): best an Argon2 PHC string
  # from `vaultwarden hash`, so the token itself is stored nowhere. Empty, the
  # page stays off.
  adminToken:
    existingSecret: vaultwarden-admin
    existingSecretKey: token
  # The CNPG cluster below, through the URL vaultwardenDbInfos writes, which
  # requires TLS.
  database:
    type: postgresql
    existingSecret: vaultwarden-db-infos
    existingSecretKey: DB_URL
  storage:
    data:
      name: vaultwarden-data
      size: 2Gi
      path: /data
      accessMode: ReadWriteOnce
  # Accounts by invitation only: open signups let anyone who reaches the
  # ingress create one.
  signupsAllowed: false
  signupsVerify: true
  invitationsAllowed: true
  invitationOrgName: ""
  ingress:
    enabled: true
    class: traefik
    nginxIngressAnnotations: false
    additionalAnnotations:
      cert-manager.io/cluster-issuer: letsencrypt-dns-prod
    hostname: ""
    tls: true
    tlsSecret: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  # Pod Security restricted, as a user that owns the data volume (fsGroup).
  # The image runs as root by default, but the server needs no privilege: its
  # port (rocket.port, 8080) is above 1024.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

cnpg:
  fullnameOverride: vaultwarden-pg-cluster
  version:
    postgresql: "17"
  cluster:
    # Image resolved for the major above from the shared catalog (see the
    # cloudnative-pg app); bumping `version.postgresql` runs an in-place
    # pg_upgrade.
    imageCatalogRef:
      kind: ClusterImageCatalog
      name: postgresql-standard-trixie
    instances: 3
    enableSuperuserAccess: false
    initdb:
      database: vaultwarden
      owner: vaultwarden
    storage:
      size: 3Gi
    walStorage:
      enabled: true
      size: 3Gi
    postgresql:
      # Caps WAL retained by replication slots: a lagging/dead replica costs
      # a re-clone, not disk pressure on the primary.
      parameters:
        max_slot_wal_keep_size: 1GB
      # Refuses plaintext clients: CNPG's last rule (host all all all
      # scram-sha-256) would take them.
      pg_hba:
      - hostnossl all all all reject
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    affinity:
      topologyKey: kubernetes.io/hostname
    monitoring:
      instrumentation:
        # The chart renders this queries ConfigMap but never wires it into
        # the Cluster, so it would only sit there unused.
        logicalReplication: false
  backups:
    enabled: false
    method: plugin
    pluginConfiguration:
      name: barman-cloud.cloudnative-pg.io
    endpointURL: ""
    destinationPath: "s3://<bucket-name>/<bucket-prefix>"
    # VSO-managed (never inline keys here). The chart hardcodes the
    # ACCESS_KEY_ID / ACCESS_SECRET_KEY key names.
    secret:
      create: false
      name: vaultwarden-pg-cluster-backup
    # The chart has no S3 region setting; the barman sidecar picks it up
    # from the standard AWS env var instead.
    instanceSidecarConfiguration:
      env:
      - name: AWS_DEFAULT_REGION
        valueFrom:
          secretKeyRef:
            name: vaultwarden-pg-cluster-backup
            key: S3_REGION
    # Chart default requests AES256 server-side encryption, which not every
    # S3-compatible store implements — defer to the bucket's own default.
    wal:
      encryption: ""
    data:
      encryption: ""
    retentionPolicy: 30d
    scheduledBackups:
    - name: daily
      schedule: "0 0 0 * * *"
      backupOwnerReference: self
      method: plugin
      pluginConfiguration:
        name: barman-cloud.cloudnative-pg.io

vso:
  extraObjects:
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: vso
  # How every VaultAuth logs in: the method and mount the instance's manager
  # gives (global.ohmlab.vault.auth, jwt for an instance that reads another
  # instance's Vault), else kubernetes.
  vaultAuthDefaults:
    method: '{{ dig "ohmlab" "vault" "auth" "method" "kubernetes" (.Values.global | default dict) }}'
    mount: '{{ dig "ohmlab" "vault" "auth" "mount" "kubernetes" (.Values.global | default dict) }}'
  vaultAuth:
    default:
      login:
        role: vaultwarden
        serviceAccount: vso
        audiences: [vault]
  vaultConnection:
    default:
      address: "https://vault.vault-operator-system.svc.cluster.local:8200"
      skipTLSVerify: false
      caCertSecretRef: vault-tls
  # The mount and path of each secret that sets none: the ones the manager
  # gives this app's tier (global.ohmlab.vault.mount, and
  # global.ohmlab.vault.pathPrefix followed by vaultwarden).
  vaultStaticSecretDefaults:
    mount: '{{ dig "ohmlab" "vault" "mount" "" (.Values.global | default dict) }}'
    path: '{{ with dig "ohmlab" "vault" "pathPrefix" "" (.Values.global | default dict) }}{{ . }}/vaultwarden{{ end }}'
  vaultStaticSecrets:
    vaultwardenAdmin:
      type: kv-v2
      vaultAuthRef: vaultwarden-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: vaultwarden-admin
        create: true
        type: Opaque
        transformation:
          excludeRaw: true
          excludes:
          - ".*"
          templates:
            token:
              text: '{{ get .Secrets "admin" | dig "token" "" }}'
    vaultwardenDbInfos:
      type: kv-v2
      vaultAuthRef: vaultwarden-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: vaultwarden-db-infos
        create: true
        type: Opaque
        transformation:
          excludeRaw: true
          excludes:
          - ".*"
          templates:
            DB_URL:
              text: 'postgresql://{{ get .Secrets "postgres" | dig "app" "username" "" }}:{{ get .Secrets "postgres" | dig "app" "password" "" }}@{{ get .Secrets "postgres" | dig "host" "" }}:{{ get .Secrets "postgres" | dig "port" "" }}/{{ get .Secrets "postgres" | dig "database" "" }}?sslmode=require'
            DB_HOST:
              text: '{{ get .Secrets "postgres" | dig "host" "" }}'
            DB_PORT:
              text: '{{ get .Secrets "postgres" | dig "port" "" }}'
    vaultwardenDbAdmin:
      type: kv-v2
      vaultAuthRef: vaultwarden-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: vaultwarden-pg-cluster-admin
        create: true
        type: kubernetes.io/basic-auth
        transformation:
          excludeRaw: true
          excludes:
          - ".*"
          templates:
            username:
              text: '{{ get .Secrets "postgres" | dig "admin" "username" "" }}'
            password:
              text: '{{ get .Secrets "postgres" | dig "admin" "password" "" }}'
    vaultwardenDbApp:
      type: kv-v2
      vaultAuthRef: vaultwarden-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: vaultwarden-pg-cluster-app
        create: true
        type: kubernetes.io/basic-auth
        transformation:
          excludeRaw: true
          excludes:
          - ".*"
          templates:
            username:
              text: '{{ get .Secrets "postgres" | dig "app" "username" "" }}'
            password:
              text: '{{ get .Secrets "postgres" | dig "app" "password" "" }}'
    vaultwardenPgBackup:
      type: kv-v2
      vaultAuthRef: vaultwarden-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: vaultwarden-pg-cluster-backup
        create: true
        type: Opaque
        transformation:
          excludeRaw: true
          excludes:
          - ".*"
          templates:
            S3_ENDPOINT:
              text: '{{ get .Secrets "postgres" | dig "s3" "endpoint" "" }}'
            S3_BUCKET_NAME:
              text: '{{ get .Secrets "postgres" | dig "s3" "bucketName" "" }}'
            S3_BUCKET_PREFIX:
              text: '{{ get .Secrets "postgres" | dig "s3" "bucketPrefix" "" }}'
            ACCESS_KEY_ID:
              text: '{{ get .Secrets "postgres" | dig "s3" "accessKey" "" }}'
            ACCESS_SECRET_KEY:
              text: '{{ get .Secrets "postgres" | dig "s3" "secretKey" "" }}'
            S3_REGION:
              text: '{{ get .Secrets "postgres" | dig "s3" "region" "" }}'
    vaultwardenSso:
      type: kv-v2
      vaultAuthRef: vaultwarden-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: vaultwarden-sso
        create: true
        type: Opaque
        transformation:
          excludeRaw: true
          excludes:
          - ".*"
          templates:
            OIDC_CLIENT_ID:
              text: '{{ get .Secrets "keycloak" | dig "clientId" "" }}'
            OIDC_CLIENT_SECRET:
              text: '{{ get .Secrets "keycloak" | dig "clientSecret" "" }}'
