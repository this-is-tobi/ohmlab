{{- /* Keep in sync across the apps that render it (cilium, longhorn). */}}
{{- with index .Subcharts "sso" }}
{{- if and $.Values.gateway.enabled (eq (toString .Values.httpScheme) "https") }}
{{- $svc := include "oauth2-proxy.fullname" . }}
{{- $ns := include "oauth2-proxy.namespace" . }}
{{- $port := toString .Values.service.portNumber }}
{{- $routed := false }}
{{- range $.Values.gateway.routes }}
{{- range .rules }}
{{- if and (eq (toString .backendService) $svc) (eq (toString .backendPort) $port) }}
{{- $routed = true }}
{{- end }}
{{- end }}
{{- end }}
{{- if $routed }}
---
# Gateway API HTTPS-upstream validation of the oauth2-proxy, once a route
# reaches its https port: only a route using the policy gives it a status,
# which Argo CD waits for. Synced after the rollout.
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: {{ $svc }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # The Gateway API CRDs may not exist yet on a fresh cluster.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: {{ $svc }}
    sectionName: https
  validation:
    caCertificateRefs:
    {{- if $.Values.ssoCertificate.caConfigMap }}
    - group: ""
      kind: ConfigMap
      name: {{ $.Values.ssoCertificate.caConfigMap }}
    {{- else }}
    - group: ""
      kind: Secret
      name: {{ $svc }}-tls
    {{- end }}
    # SNI sent to and validated against the proxy's certificate.
    hostname: {{ $svc }}.{{ $ns }}.svc
{{- end }}
{{- end }}
{{- end }}
