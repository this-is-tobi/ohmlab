# Zero-trust NetworkPolicy for this namespace (templates/networkpolicy.yaml).
# Disabled by default — real rules live in the instance override.
networkPolicy:
  enabled: false
  egressDeny: true
  prometheusScrapePorts: []
  extraIngress: []
  extraEgress: []

# Publishes the Vault CA as a ConfigMap for the Gateway API BackendTLSPolicy,
# which only accepts ConfigMap CA references. Everything else reads the
# bank-vaults Secret copies directly.
vaultCaBundle:
  enabled: true
  name: vault-ca-bundle
  sourceSecret: vault-tls

# Publishes the internal CA root (internalCA in the cert-manager app, which
# this needs) as the ConfigMap `name` (key ca.crt) in the target namespaces.
# The root's Secret stays in cert-manager's namespace: an anchor certificate
# issued by `issuer` in the trust namespace carries the root as its ca.crt,
# and the Bundle reads that.
internalCaBundle:
  enabled: false
  name: ohmlab-internal-ca
  issuer: ohmlab-internal-ca

trust-manager:
  app:
    trust:
      # The only namespace trust-manager may read Secrets from: its own, where
      # the only Secrets are public CA copies (bank-vaults copies Vault's
      # ca.crt to every namespace), so it never reads another app's keys.
      # Follows the app's namespace.
      namespace: trust-manager
    # The namespaces it may write bundles to.
    targetNamespaces:
    - vault-operator-system
  # Secret targets would grant cluster-wide Secret reads; the ConfigMap
  # target does not need them.
  secretTargets:
    enabled: false
  # Only enables the `useDefaultCAs` Bundle source, which nothing uses here.
  defaultPackage:
    enabled: false
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    # Idle use is ~15Mi and ~1m CPU; the limits only bound a runaway.
    limits:
      cpu: 100m
      memory: 64Mi
