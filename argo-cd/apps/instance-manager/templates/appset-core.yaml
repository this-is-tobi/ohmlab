{{- if .Values.scopes.core.enabled }}
{{- $instance := required ".Values.instance.name is required" .Values.instance.name -}}
{{- $repo := required ".Values.repoURL is required" .Values.repoURL -}}
{{- include "instance-manager.validateCatalogs" . -}}
{{- $valuesRepo := include "instance-manager.valuesRepo" . | trim -}}
{{- $rev := .Values.targetRevision | default "main" -}}
{{- $defaultServer := .Values.destination.server | default "https://kubernetes.default.svc" -}}
{{- $project := .Values.projects.core | default "admin-core" -}}
{{- $prefix := .Values.namespacePrefix | default "" -}}
{{- $suffix := .Values.namespaceSuffix | default "" -}}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: core-{{ $instance }}
  namespace: {{ .Values.argocdNamespace | default "argocd-system" }}
  labels:
    {{- include "instance-manager.labels" . | nindent 4 }}
    ohmlab.fr/instance-scope: "core"
spec:
  goTemplate: true
  {{- if .Values.progressiveSync.enabled }}
  {{- include "instance-manager.rollingSyncStrategy" . | nindent 2 }}
  {{- end }}
  generators:
  - matrix:
      generators:
      - git:
          repoURL: {{ $repo | quote }}
          revision: {{ $rev | quote }}
          files:
          - path: 'argo-cd/instances/{{ $instance }}/core.yaml'
      - list:
          elementsYaml: "{{ `{{ .apps | toJson }}` }}"
        selector:
          matchExpressions:
          - key: enabled
            operator: In
            values:
            - "true"
  template:
    metadata:
      name: '{{ $instance }}-{{ `{{ .app }}` }}'
      annotations:
        argocd.argoproj.io/compare-options: ServerSideDiff=true
        argocd.argoproj.io/sync-wave: '{{ `{{ default 0 .syncWave }}` }}'
      labels:
        {{- include "instance-manager.labels" . | nindent 8 }}
        ohmlab.fr/instance-scope: "core"
        ohmlab.fr/app-name: '{{ `{{ .app }}` }}'
        # Consumed by the RollingSync steps (see values.progressiveSync).
        # "w" prefix: a bare "-10" is not a valid label value. `default 0`
        # so a catalogue entry without syncWave still yields a valid label
        # (a bare "w<no value>" would make the Application unschedulable).
        ohmlab.fr/sync-wave: 'w{{ `{{ default 0 .syncWave }}` }}'
      # NO resources-finalizer here, deliberately: with it, deleting an
      # Application (UI click, kubectl, generator hiccup) cascades into
      # deleting the app's live resources — for an ingress controller or
      # other shared infra app, that risks taking down production traffic
      # and leaving the Application itself stuck Terminating, which
      # freezes auto-sync cluster-wide. Disabling an app in core.yaml now
      # orphans its resources; clean them up explicitly if that is what
      # you want.
    spec:
      project: {{ $project | quote }}
      revisionHistoryLimit: 3
      sources:
      - repoURL: '{{ printf "{{ %s }}" (include "instance-manager.catalogRepoURL" .) }}'
        # A registry catalog is a Helm chart (chart + exact version); every
        # other catalog, `git` included, is a folder with the layout of this
        # repository.
        path: '{{ printf "{{ if not (has %s (list %s)) }}{{ default (printf \"argo-cd/apps/%%s\" (default .app .chart)) .chartPath }}{{ end }}" (include "instance-manager.catalogName" .) (include "instance-manager.chartCatalogs" .) }}'
        chart: '{{ printf "{{ if has %s (list %s) }}{{ default .app .chart }}{{ end }}" (include "instance-manager.catalogName" .) (include "instance-manager.chartCatalogs" .) }}'
        # No default revision for a registry catalog or a bundle without
        # version: an unset version must not resolve to the newest one, so it
        # becomes an invalid constraint.
        targetRevision: '{{ printf "{{ default (%s) .targetRevision }}" (include "instance-manager.catalogRevision" .) }}'
        helm:
          releaseName: '{{ `{{ default .app .releaseName }}` }}'
          valueFiles:
          - '$values/{{ printf "{{ default (printf \"argo-cd/instances/%s/values/core/%%s.yaml\" .app) .valuesPath }}" $instance }}'
          {{- with include "instance-manager.namesParameters" . | trim }}
          parameters:
            {{- . | nindent 10 }}
          {{- end }}
      - repoURL: {{ $valuesRepo | quote }}
        ref: values
        targetRevision: {{ $rev | quote }}
      destination:
        server: '{{ printf "{{ default %q .destination.server }}" $defaultServer }}'
        namespace: '{{ printf "{{ default (printf \"%s%%s%s\" .app) .namespace }}" $prefix $suffix }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        # Label every managed namespace declaratively (manual labels do not
        # survive re-creates).
        managedNamespaceMetadata:
          labels:
            ohmlab.fr/managed-by: '{{ $instance }}'
            # Tier label: kyverno's pod-security-restricted policy keys on
            # instance-scope=tenant namespaces.
            ohmlab.fr/instance-scope: "core"
        syncOptions:
        - CreateNamespace=true
        - ApplyOutOfSyncOnly=true
        - ServerSideApply=true
        - RespectIgnoreDifferences=true
        retry:
          limit: 3
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 3m
  templatePatch: |
    {{ "{{- if .ignoreDifferences }}" }}
    spec:
      ignoreDifferences: {{ "{{ .ignoreDifferences | toJson }}" }}
    {{ "{{- end }}" }}
  syncPolicy:
    preserveResourcesOnDeletion: true
{{- end }}
