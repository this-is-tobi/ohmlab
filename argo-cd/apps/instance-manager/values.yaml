# Default values for the per-instance manager chart.
#
# These are normally overridden by:
#   - $values mapped to argo-cd/instances/<instance>/instance.yaml
#   - inline `helm.parameters` set by the root `manager` AppSet (instance.name).

instance:
  name: ""
  env: ""
  provider: ""
  region: ""

destination:
  server: https://kubernetes.default.svc

# Namespace the ArgoCD instance (and therefore the generated ApplicationSets)
# lives in. Passed down by the root manager — do not hardcode elsewhere.
argocdNamespace: argocd-system

repoURL: ""
valuesRepoURL: ""
targetRevision: main

# Where the charts of the catalogue entries come from. `git` is the repository
# of the instance itself (`repoURL` at `targetRevision`, the folder
# argo-cd/apps/<chart>) and is what an entry gets when nothing else is set.
# Named catalogs add other sources; an entry opts in with `catalog: <name>`:
#   - a bundle, {repoURL, version}: a repository with the layout of this one,
#     git or an `oci://` artifact of the whole catalog. Every entry of the
#     catalog runs `version` unless it sets `targetRevision`.
#   - a registry path (a string, no scheme): a Helm chart per app, the chart
#     name taken from the entry's `chart` (default the app), at the exact
#     version the entry pins in `targetRevision`.
# The AppProject of the tier has to list the same repository in `sourceRepos`
# (for a bundle with its scheme, for a registry path as written here).
#   catalogs:
#     ohmlab:
#       repoURL: oci://ghcr.io/example/ohmlab/catalog
#       version: 0.2.0
#     charts: ghcr.io/example/charts
catalogs: {}

# The catalog of every entry that names none: a key of `catalogs`, or `git`
# (empty means git). An entry opts out with `catalog: git`.
defaultCatalog: ""

# The names of the instance's own resources. Each derives from `instance.name`
# and goes to every generated Application as the Helm parameter
# `global.ohmlab.names.<key>`; a chart takes its own explicit value first, then
# this name. A key set here overrides only itself. A running cluster whose
# resources carry other names pins them here: a renamed KV mount no longer
# holds the secrets, a renamed Gateway is recreated.
#   names:
#     vaultMount: mylab                  # Vault KV v2 mount of the instance's secrets (default: <instance>)
#     keycloakRealm: mylab               # Keycloak realm of the instance's users (default: <instance>)
#     keycloakRealmDisplayName: My lab   # name that realm shows (default: <instance>, capitalized)
#     gateway: mylab-gateway             # Gateway of every implementation, the routes' parent (default: <instance>-gateway)
names: {}

# The instance whose Vault this one reads, for an instance on another cluster
# than that Vault (empty: the instance's own cluster runs it). Both tiers then
# read the instance's own KV mount (names.vaultMount), and every app logs in
# with the jwt method at the mount jwt-<instance>, which that hub's
# vault-operator values declare under spokeClusters.
vault:
  hub: ""

projects:
  core: admin-core
  tenant: admin-tenant

scopes:
  core:
    enabled: true
  tenant:
    enabled: true

# Default namespace pattern for generated apps: "<prefix><app><suffix>".
namespacePrefix: ""
namespaceSuffix: ""

# Progressive sync (ApplicationSet RollingSync): actually ENFORCES the
# syncWave ordering between generated Applications. Without it, syncWave on
# an AppSet-generated Application orders nothing — all apps sync in parallel
# and converge by retry.
#
# OPT-IN because it needs the alpha ApplicationSetProgressiveSyncs feature
# gate on the ArgoCD instance (charts/ohmlab values set
# `applicationsetcontroller.enable.progressive.syncs: true`) and it changes
# rollout behaviour: the AppSet controller drives each step's sync itself
# and turns `syncPolicy.automated` off on the generated Applications (prune
# is carried into the triggered sync). It syncs an app again only when the
# app's revision changes: drift at the same commit (a hand edit, a chart that
# renders more once a CRD exists, such as vault-operator's VaultSeeds) stays
# OutOfSync until the next commit or a manual sync — expected, not a bug.
# Generated Applications carry a `ohmlab.fr/sync-wave: w<syncWave>` label
# ("w" prefix because a bare "-10" is not a valid label value); each step
# below lists the wave values it syncs, in order, and everything not listed
# lands in an automatic final catch-all step. The SAME steps apply to the
# core and the tenant AppSet: list your tenant waves (e.g. 80, 85, ...) here
# too, otherwise every tenant app lands in the catch-all step unordered.
progressiveSync:
  enabled: false
  steps:
  - [-10]
  - [0, 5]
  - [10]
  - [11, 12, 13, 15]
  - [20]
  - [30, 40]
  - [50, 55, 60]

# Object storage (docs/10). Each role names the store its claims go to; while
# no role names one, nothing of this renders. Every enabled app with an
# enabled claim then gets a bucket of its own, a key in its record
# (<mount>/platforms/<env>/<scope>/<app>/s3) and, with wireConsumers, the
# values that point it at the bucket.
storage:
  # <name>: a store the controller runs claims in.
  #   type: rustfs          the only type so far (default)
  #   app: rustfs-backups   the core.yaml entry that runs it; its root keys are
  #                         that app's record, <ohmlab mount>/platforms/<env>/core/<app>, key admin
  #   namespace: rustfs-backups
  #   endpoint: https://rustfs-svc.rustfs-backups.svc:9000
  #   region: us-east-1     (default) set on the store as well, so both agree
  #   size: 50Gi            its data volume, which the quotas are counted against
  #   storageClass: ""      that volume's class (empty: the app's own)
  stores: {}
  # The store of each role; empty leaves that role's claims out.
  backups: ""
  data: ""
  # false renders the claims, the store and the controller's target but wires
  # no consumer: a first rollout writes every record before an app reads one.
  wireConsumers: true
  # The store's NetworkPolicy, admitting each claim's pods and the controller,
  # always renders. This adds the egress policies from each claim's pods to its
  # store, for an instance whose apps deny egress by default
  # (networkPolicy.enabled): on a pod no other egress policy selects, the
  # claim's would deny the rest of its egress (DNS, the API server, its peers).
  networkPolicies: false
  # What a claim takes unless the registry or instance.yaml sets it.
  claimDefaults:
    enabled: true
    access: readWrite
    versioning: true
    lifecycle:
      noncurrentDays: 7
      expireDays: 0
    replicate: true
    # With networkPolicies, the claim's pods get their egress policy to the
    # store. false for an app whose namespace keeps its egress open: its pods
    # reach the store without one, and it would be their only egress policy.
    networkPolicy: true
  # The catalog's registry, <app>: {<claim>: {...}}: the claim's role, its
  # quota, how the app is pointed at its bucket (wiring: cnpg, backup-utils,
  # or none for an app that reads global.ohmlab.storage.<claim> itself) and
  # the labels of the pods that talk to the store (clients). instance.yaml
  # overrides any field (storage.claims.gitea.pg.quota: 3Gi, enabled: false).
  claims:
    coder:
      pg: {role: backups, quota: 2Gi, wiring: cnpg, clients: {cnpg.io/cluster: coder-pg-cluster}}
    crowdsec:
      pg: {role: backups, quota: 5Gi, wiring: cnpg, clients: {cnpg.io/cluster: crowdsec-pg-cluster}}
    gitea:
      pg: {role: backups, quota: 2Gi, wiring: cnpg, clients: {cnpg.io/cluster: gitea-pg-cluster}}
    harbor:
      pg: {role: backups, quota: 2Gi, wiring: cnpg, clients: {cnpg.io/cluster: harbor-pg-cluster}}
    keycloak:
      pg: {role: backups, quota: 2Gi, wiring: cnpg, clients: {cnpg.io/cluster: keycloak-pg-cluster}}
    mattermost:
      pg: {role: backups, quota: 4Gi, wiring: cnpg, clients: {cnpg.io/cluster: mattermost-pg-cluster}}
    mlflow:
      pg: {role: backups, quota: 2Gi, wiring: cnpg, clients: {cnpg.io/cluster: mlflow-pg-cluster}}
    outline:
      pg: {role: backups, quota: 2Gi, wiring: cnpg, clients: {cnpg.io/cluster: outline-pg-cluster}}
    # Its chart never denies egress (Prometheus scrapes every namespace): no
    # egress policy for its claim.
    prometheus-stack:
      pg: {role: backups, quota: 2Gi, wiring: cnpg, clients: {cnpg.io/cluster: prometheus-stack-pg-cluster}, networkPolicy: false}
    sonarqube:
      pg: {role: backups, quota: 2Gi, wiring: cnpg, clients: {cnpg.io/cluster: sonarqube-pg-cluster}}
    vault-operator:
      vault: {role: backups, quota: 3Gi, wiring: backup-utils, clients: {ohmlab.fr/storage-client: vault}}
    vaultwarden:
      pg: {role: backups, quota: 2Gi, wiring: cnpg, clients: {cnpg.io/cluster: vaultwarden-pg-cluster}}
