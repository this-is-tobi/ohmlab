# The instance-manager renders these from instance.yaml's storage block and
# the catalog's claims (storage-<tier>-<instance>, docs/10): nothing here is
# meant to be set by hand.

# The tier: core or tenant.
scope: ""
# The namespace of an app is its tier entry's, else <prefix><app><suffix>.
namespacePrefix: ""
namespaceSuffix: ""
# The namespace the storage target watches, where the S3Buckets go.
controller:
  namespace: ohmlab-system
# The egress NetworkPolicies from each claim's pods to its store
# (instance-manager's storage.networkPolicies, which says when they are safe),
# except for a claim whose networkPolicy is false. The store's own, admitting
# them, always renders.
networkPolicies: false
# <name>: {namespace, port, size}
stores: {}
# <app>: {<claim>: {store, bucket, record, key, quota, versioning, lifecycle, replicate, access, clients, networkPolicy}}
claims: {}
# The tier file's entries: {app, enabled, namespace, ...}.
apps: []
