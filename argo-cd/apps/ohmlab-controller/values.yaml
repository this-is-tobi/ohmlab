# Default values for the ohmlab controller.
#
# Nothing is rendered until a target is enabled: the instance values
# (argo-cd/instances/<instance>/values/core/ohmlab-controller.yaml) turn on
# the targets it wants.

# The controller image, as one reference pinned to an exact release and its
# digest ("ghcr.io/this-is-tobi/ohmlab/controller:0.2.0@sha256:..."): a
# sync then runs exactly the image that was reviewed. Renovate proposes each new
# release and Kyverno's verify-images policy checks the signature and the
# provenance. Required as soon as a target is enabled; there is no `latest`.
image: "ghcr.io/this-is-tobi/ohmlab/controller:0.10.0@sha256:eb80030ed3328924b6bee9866a4fbf86616e3012abfdcccaa2e6789c60374c92"
imagePullPolicy: IfNotPresent
# Accept an image that is not pinned by digest. For the kind e2e, which runs an
# image it just built and has no registry digest for it. Never set it on a
# cluster.
unsafeAllowUnpinnedImage: false

# How often every object is reconciled again (each interval is stretched or
# shrunk by up to 10%). A change to an object is acted on at once.
resync: 10m
logLevel: info

# Targets are the unit; a Deployment is only packaging. A target reconciles
# only the namespaces it lists: put the objects there, nowhere else.
targets:
  vault:
    enabled: false
    # Run the whole reconcile and write nothing to Vault: the shadow phase of
    # a cutover, and a dry run for adopters. Conditions and
    # ohmlab_planned_changes say what a real run would do.
    observeOnly: false
    # Let `deletionPolicy: Delete` remove paths. The Vault policy of the role
    # must grant delete too (vault-operator: ohmlab.controller.allowDelete).
    allowDelete: false
    watchNamespaces:
    - vault-operator-system
    backend:
      address: https://vault.vault-operator-system.svc.cluster.local:8200
      # The Secret that holds Vault's CA. bank-vaults copies `vault-tls` into
      # every namespace; key ca.crt is the CA. Empty trusts the system roots
      # (a Vault behind a public certificate) or, with an http address, nothing.
      caSecret: vault-tls
      caKey: ca.crt
      skipTLSVerify: false
      auth:
        mount: kubernetes
        # The Kubernetes-auth role the controller logs in with. It is bound to
        # this target's ServiceAccount, ohmlab-controller-<deployment>.
        role: ohmlab-controller-vault
        # The audience of the token the controller logs in with: a projected
        # ServiceAccount token valid for Vault only, instead of the pod's API
        # token, so the JWT Vault receives cannot be replayed against the API
        # server. A role without an audience accepts it too; a role with one
        # (vault-operator: ohmlab.controller.audience) accepts nothing else.
        # Empty logs in with the pod's API token.
        audience: vault
  certificates:
    enabled: false
    # The workloads that read their certificate only when they start, under
    # the cert-manager Certificate they mount. Each time the Certificate is
    # issued again (status.revision), the controller rolls them by setting the
    # pod-template annotation ohmlab.fr/certificate-revision; it also rolls
    # them once when it first sees them, since it cannot know which
    # certificate their pods loaded. A workload lives in its Certificate's
    # namespace and is listed under one Certificate only. The controller may
    # get and patch exactly these workloads, and read the Certificates of
    # these namespaces. A ValidatingAdmissionPolicy keeps those patches to the
    # one annotation (Kubernetes 1.30 or later; the core AppProject must allow
    # the kind).
    restarts: []
    # - namespace: gitea
    #   certificate: gitea-tls
    #   workloads:
    #   - {kind: Deployment, name: gitea}   # or StatefulSet, DaemonSet
  storage:
    enabled: false
    # Each S3Bucket is one app's claim: a bucket in a store, with its quota,
    # versioning and lifecycle, a user confined to it, and the app's key in the
    # claim's Vault record (<mount>/platforms/<env>/<scope>/<app>/s3). The
    # record is written first and the store follows it, so a store rebuilt
    # empty gets every key back. The target holds the stores' root keys: it
    # always runs alone, in a deployment of its own.
    #
    # Plan every bucket, identity and record change and write none: the
    # observe-only phase of a rollout. Conditions and ohmlab_planned_changes
    # say what a live run would do.
    observeOnly: false
    # Let `deletionPolicy: Delete` remove a claim's identity and record key,
    # and its bucket when that holds no object version. A bucket holding data
    # is never removed.
    allowDelete: false
    watchNamespaces:
    - ohmlab-system
    # How long the key a rotation replaces keeps working: VSO's refresh plus a
    # day's backup cycle. At least 1m.
    rotationGrace: 26h
    # Its own, instead of `resources`: every admin call that creates a user or
    # a key, or attaches a policy, encrypts its request with a 64 MiB argon2id
    # key (madmin-go), and two can be in memory at once. The target idles near
    # 40 MiB and peaks near 190 MiB while it writes, however many claims.
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 320Mi
    # The target's own Vault identity, as for the vault target. Its policy
    # writes the claims' records and reads each store's root keys, nothing
    # else (vault-operator renders it).
    backend:
      address: https://vault.vault-operator-system.svc.cluster.local:8200
      caSecret: vault-tls
      caKey: ca.crt
      skipTLSVerify: false
      auth:
        mount: kubernetes
        role: ohmlab-controller-storage
        audience: vault
    # The stores' CA: written into every record, and what the target verifies
    # the stores with. trust-manager's bundle of the internal CA by default; an
    # empty configMap trusts the system roots.
    storeCA:
      configMap: ohmlab-internal-ca
      key: ca.crt
    # The stores, set by the instance-manager from instance.yaml's
    # storage.stores. The target reads each store's root keys from Vault
    # itself, so no Secret holds a copy.
    stores: []
    # - name: backups
    #   type: rustfs                        # the only type today
    #   endpoint: https://rustfs-svc.rustfs-backups.svc:9000   # https://<host>:<port>
    #   region: eu-west-1                   # the store's own region
    #   pathStyle: true
    #   bucketPrefix: ""                    # empty on rustfs
    #   capacity: 50Gi                      # the store's volume: its quotas are alerted on against it
    #   namespace: rustfs-backups           # where its pods run, for the egress policy
    #   rootCredentials: {path: ohmlab/platforms/production/core/rustfs-backups, key: admin}

# How the targets are packaged. Empty: one Deployment per enabled target
# ("split"), each with its own ServiceAccount, RBAC, Vault role and egress.
# Otherwise a map of Deployment name -> targets, every enabled target exactly
# once, for example:
#   deployments:
#     all: [vault, harbor, sonarqube]       # one process for everything
#     vault: [vault]                        # or keep Vault alone
#     apps: [harbor, sonarqube]
#     storage: [storage]                    # storage is always alone
# A shared process shares memory, the OOM limit, the ServiceAccount, network
# egress and the failure domain: it is not a security boundary (docs/08).
deployments: {}

replicas: 1
resources:
  requests:
    cpu: 10m
    memory: 48Mi
  limits:
    cpu: 250m
    memory: 192Mi
nodeSelector: {}
tolerations: []

monitoring:
  # The PodMonitor and the PrometheusRule render only on a cluster that has
  # the Prometheus Operator CRDs (prometheus-stack); the dashboards always.
  enabled: true
  # Series per scrape; the controller exposes controller-runtime's metrics and
  # the ohmlab_* ones, about 350 per process for one target (vault or
  # certificates) and 400 for storage. Re-measure when a target is added.
  sampleLimit: 1500
  prometheusRule:
    enabled: true
  dashboards:
    enabled: true
    folder: Platform

# Zero-trust NetworkPolicy for this namespace (templates/networkpolicy.yaml).
# Disabled by default; the real rules live in the instance values, because the
# API server and Vault are reached by addresses only the cluster knows.
networkPolicy:
  enabled: false
  egressDeny: true
  # The ports Prometheus may scrape: the metrics port is 8080.
  prometheusScrapePorts: []
  prometheusNamespace: prometheus-stack
  extraIngress: []
  extraEgress: []
