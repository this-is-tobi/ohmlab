{{- range $dep, $targets := (include "ohmlab-controller.deployments" . | fromJson) }}
{{- $sa := printf "ohmlab-controller-%s" $dep }}
{{- /* The Vault identity of the deployment: the vault target's, or the storage target's, which never share a process. */}}
{{- $backend := dict }}
{{- range $t := list "vault" "storage" }}{{ if has $t $targets }}{{ $backend = (index $.Values.targets $t).backend }}{{ end }}{{ end }}
{{- $audience := dig "auth" "audience" "" $backend }}
{{- $storeCA := and (has "storage" $targets) $.Values.targets.storage.storeCA.configMap }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $sa }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "ohmlab-controller.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $dep }}
spec:
  replicas: {{ $.Values.replicas }}
  # A rollout starts the new pod before it stops the old one; the Lease of each
  # target keeps them from running it twice.
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      app.kubernetes.io/name: ohmlab-controller
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $dep }}
  template:
    metadata:
      labels:
        {{- include "ohmlab-controller.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $dep }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
    spec:
      serviceAccountName: {{ $sa }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      {{- with $.Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: controller
        image: {{ include "ohmlab-controller.image" $ }}
        imagePullPolicy: {{ $.Values.imagePullPolicy }}
        args:
        - --config=/etc/ohmlab/controller.yaml
        - --target={{ join "," $targets }}
        - --log-level={{ $.Values.logLevel }}
        - --metrics-addr=:8080
        - --probe-addr=:8081
        ports:
        - {name: metrics, containerPort: 8080, protocol: TCP}
        - {name: probes, containerPort: 8081, protocol: TCP}
        livenessProbe:
          httpGet: {path: /healthz, port: probes}
          periodSeconds: 20
        readinessProbe:
          httpGet: {path: /readyz, port: probes}
          periodSeconds: 10
        resources:
          {{- toYaml $.Values.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        volumeMounts:
        - {name: config, mountPath: /etc/ohmlab/controller.yaml, subPath: controller.yaml, readOnly: true}
        {{- if $backend.caSecret }}
        - {name: vault-ca, mountPath: /etc/ohmlab/vault-ca, readOnly: true}
        {{- end }}
        {{- if $audience }}
        - {name: vault-token, mountPath: /var/run/secrets/ohmlab/vault, readOnly: true}
        {{- end }}
        {{- if $storeCA }}
        - {name: store-ca, mountPath: /etc/ohmlab/store-ca, readOnly: true}
        {{- end }}
      volumes:
      - name: config
        configMap: {name: {{ $sa }}}
      {{- if $backend.caSecret }}
      - name: vault-ca
        secret:
          secretName: {{ $backend.caSecret }}
          items:
          - {key: {{ $backend.caKey }}, path: {{ $backend.caKey }}}
      {{- end }}
      {{- if $audience }}
      # Valid for Vault only and for ten minutes; the kubelet renews it before
      # then and every login reads the file again.
      - name: vault-token
        projected:
          sources:
          - serviceAccountToken:
              audience: {{ $audience | quote }}
              expirationSeconds: 600
              path: token
      {{- end }}
      {{- if $storeCA }}
      # The stores' CA, read again at each reconcile: a rotation reaches the
      # records without a restart.
      - name: store-ca
        configMap:
          name: {{ $.Values.targets.storage.storeCA.configMap }}
          items:
          - {key: {{ $.Values.targets.storage.storeCA.key }}, path: {{ $.Values.targets.storage.storeCA.key }}}
      {{- end }}
{{- end }}
