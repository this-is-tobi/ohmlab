{{- /* Only where the Prometheus Operator CRDs exist, as the PodMonitor. */}}
{{- if and .Values.monitoring.enabled .Values.monitoring.prometheusRule.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") (include "ohmlab-controller.enabledTargets" . | fromJsonArray) }}
{{- $ns := .Release.Namespace }}
{{- $stale := mul 3 (int (include "ohmlab-controller.resyncSeconds" .)) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-alerts
  namespace: {{ .Release.Namespace }}
spec:
  groups:
  - name: ohmlab-controller
    rules:
    - alert: OhmlabControllerDown
      expr: max(up{namespace={{ $ns | quote }}, pod=~"ohmlab-controller-.+"}) != 1 or absent(up{namespace={{ $ns | quote }}, pod=~"ohmlab-controller-.+"})
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: The ohmlab controller is not running
        description: >-
          Nothing is lost while it is down: Vault and the apps keep their
          state. Changes to the custom resources wait for it. Check the
          Deployments in {{ $ns }}.
    - alert: OhmlabObjectNotReady
      expr: ohmlab_object_ready == 0
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: An ohmlab object has not been reconciled for 15 minutes
        description: >-
          Read its conditions: kubectl get vaultseeds,s3buckets -A. RefPending
          waits for another path, BackendUnavailable and Forbidden are the
          backend's answer, OwnedByAnother is a path or a key another object
          holds, a Stalled object waits for its spec to change. For a
          Certificate of the certificates target, read its events: a listed
          workload is missing, or the certificate is not issued yet.
    - alert: OhmlabReconcileStale
      # More than three resyncs without a reconcile that completed.
      expr: time() - max by (target) (ohmlab_reconcile_last_success_timestamp_seconds) > {{ $stale }}
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: A target has not reconciled successfully for more than three resyncs
        description: >-
          The backend is probably unreachable or refusing the controller's
          login (for the certificates target, the Kubernetes API). See
          ohmlab_backend_requests_total by result.
    - alert: OhmlabBackendErrors
      expr: sum by (target) (increase(ohmlab_backend_requests_total{result="error"}[10m])) > 0
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: Requests from the ohmlab controller to a backend fail
        description: >-
          Errors that are neither a lost compare-and-set nor a refused
          policy: Vault or a store is down, sealed or unreachable. For the
          certificates target, read the controller's log: the API server, or
          its admission policy, refused a workload update.
    - alert: OhmlabBackendForbidden
      expr: sum by (target) (increase(ohmlab_backend_requests_total{result="forbidden"}[15m])) > 0
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: A backend refuses the ohmlab controller
        description: >-
          The policy of the controller's role does not allow something an
          object declares, for example a path outside platforms/+/+/*. For
          the certificates target, its RBAC does not cover a listed workload.
    - alert: OhmlabWriteLoop
      # A settled platform writes almost never. A sustained rate of writes is a
      # loop between the controller and something else that rewrites the path.
      expr: sum by (target) (rate(ohmlab_backend_writes_total{op="data"}[10m])) > 0.1
      for: 15m
      labels:
        severity: critical
      annotations:
        summary: The ohmlab controller keeps writing to a backend
        description: >-
          More than one data write every ten seconds for fifteen minutes.
          Another writer is probably undoing the controller's work. Set
          observeOnly on the target and look at the audit log.
    - alert: OhmlabRestartLoop
      # A certificate is issued again every few weeks. A workload rolled again
      # and again is a loop between the controller and something that undoes
      # its annotation.
      expr: increase(ohmlab_workload_restarts_total[1h]) > 2
      labels:
        severity: critical
      annotations:
        summary: The ohmlab controller keeps restarting a workload
        description: >-
          {{ "{{" }} $labels.kind {{ "}}" }} {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.name {{ "}}" }}
          was rolled more than twice in an hour. Something probably removes or
          changes its ohmlab.fr/certificate-revision pod-template annotation,
          or its Certificate is issued again and again: look at the workload's
          managedFields and the Certificate's events.
    - alert: OhmlabCRDRevisionMismatch
      expr: ohmlab_crd_revision_mismatch == 1
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: The installed CRD and the controller image disagree on the API revision
        description: >-
          The catalog and the image pin were released apart. A custom
          resource may use a new field only after the image pin includes it.
  {{- if .Values.targets.storage.enabled }}
  {{- $storeNs := list }}
  {{- range $s := (include "ohmlab-controller.stores" . | fromJsonArray) }}{{ $storeNs = append $storeNs $s.namespace }}{{ end }}
  {{- $nsRe := $storeNs | uniq | sortAlpha | join "|" | quote }}
  - name: ohmlab-storage
    rules:
    - alert: OhmlabStoreFilling
      expr: max by (namespace, persistentvolumeclaim) (kubelet_volume_stats_used_bytes{namespace=~{{ $nsRe }}, persistentvolumeclaim!~".*-logs|logs-.*"} / kubelet_volume_stats_capacity_bytes{namespace=~{{ $nsRe }}, persistentvolumeclaim!~".*-logs|logs-.*"}) > 0.75
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: A store's volume is more than 75% full
        description: >-
          {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.persistentvolumeclaim {{ "}}" }}
          holds a store's objects. The bucket quotas bound what apps write, so
          a store that fills holds more than its quotas allow for: compare
          ohmlab_storage_bucket_quota_bytes with the volume, then expand the
          volume online or lower a quota.
    - alert: OhmlabStoreFull
      expr: max by (namespace, persistentvolumeclaim) (kubelet_volume_stats_used_bytes{namespace=~{{ $nsRe }}, persistentvolumeclaim!~".*-logs|logs-.*"} / kubelet_volume_stats_capacity_bytes{namespace=~{{ $nsRe }}, persistentvolumeclaim!~".*-logs|logs-.*"}) > 0.85
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: A store's volume is more than 85% full
        description: >-
          {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.persistentvolumeclaim {{ "}}" }}:
          a full store refuses every write, and the backups that land in it
          stop. Expand the volume now; the apps keep running.
    - alert: OhmlabBucketNearQuota
      # Every RustFS node exports the cluster's usage: max, never sum.
      expr: max by (bucket) (rustfs_cluster_usage_buckets_total_bytes) / on (bucket) max by (bucket) (ohmlab_storage_bucket_quota_bytes) > 0.8
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: A bucket is above 80% of its quota
        description: >-
          Bucket {{ "{{" }} $labels.bucket {{ "}}" }}: its store refuses the
          writes beyond the quota. The producer's pruning (a retention policy,
          a backup job's retention) may have stopped, or the quota is too
          small for it.
    - alert: OhmlabStorageOvercommitted
      # A bucket two controller pods expose during a rollout counts once.
      expr: sum by (store) (max by (store, bucket) (ohmlab_storage_bucket_quota_bytes)) > on (store) 0.8 * max by (store) (ohmlab_storage_capacity_bytes)
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: A store's quotas exceed 80% of its capacity
        description: >-
          Store {{ "{{" }} $labels.store {{ "}}" }}: the sum of its bucket
          quotas is above 80% of its volume, so the buckets could fill it
          before their quotas stop them. Expand the store's volume and its
          capacity, or lower a quota.
    # The backups the claims carry (docs/10). The barman-cloud plugin exports
    # each cluster's newest base backup; a cluster that never backed up has no
    # series yet.
    - alert: OhmlabPostgresBackupStale
      expr: time() - max by (namespace) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp) > 26 * 3600
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: A Postgres cluster has no base backup of the last day
        description: >-
          The newest base backup of the cluster in {{ "{{" }} $labels.namespace {{ "}}" }}
          is more than 26 hours old. Look at its ObjectStore's status and at
          the plugin-barman-cloud sidecar of its instance pods.
    # No "older than an hour": a quiet cluster switches a segment every few
    # hours, so only a failure newer than the last success counts.
    - alert: OhmlabWALArchivingFailing
      expr: max by (namespace) (cnpg_pg_stat_archiver_last_failed_time) > max by (namespace) (cnpg_pg_stat_archiver_last_archived_time)
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: A Postgres cluster fails to archive its WAL
        description: >-
          The cluster in {{ "{{" }} $labels.namespace {{ "}}" }} failed to
          archive a WAL segment after its last success, so a recovery cannot
          reach past that point. Look at its ObjectStore's status and at the
          plugin-barman-cloud sidecar of its instance pods.
    - alert: OhmlabVaultSnapshotStale
      expr: time() - max by (namespace, cronjob) (kube_cronjob_status_last_successful_time{cronjob=~".+-vault-snapshot"}) > 26 * 3600
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: Vault has no snapshot of the last day
        description: >-
          {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.cronjob {{ "}}" }}
          last succeeded more than 26 hours ago. Look at the logs of its last
          Job.
  {{- end }}
{{- end }}
