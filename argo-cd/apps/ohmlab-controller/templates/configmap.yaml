{{- /* Each deployment receives only the sections of its own targets. */}}
{{- range $dep, $targets := (include "ohmlab-controller.deployments" . | fromJson) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ohmlab-controller-{{ $dep }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "ohmlab-controller.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $dep }}
data:
  controller.yaml: |
    resync: {{ $.Values.resync | quote }}
    leaseNamespace: {{ $.Release.Namespace | quote }}
    {{- if has "vault" $targets }}
    {{- $v := $.Values.targets.vault }}
    vault:
      observeOnly: {{ $v.observeOnly }}
      allowDelete: {{ $v.allowDelete }}
      watchNamespaces: {{ $v.watchNamespaces | toJson }}
      backend:
        address: {{ $v.backend.address | quote }}
        {{- if $v.backend.caSecret }}
        caFile: /etc/ohmlab/vault-ca/{{ $v.backend.caKey }}
        {{- end }}
        skipTLSVerify: {{ $v.backend.skipTLSVerify }}
        auth:
          mount: {{ $v.backend.auth.mount | quote }}
          role: {{ $v.backend.auth.role | quote }}
          {{- if $v.backend.auth.audience }}
          tokenFile: /var/run/secrets/ohmlab/vault/token
          {{- end }}
    {{- end }}
    {{- if has "certificates" $targets }}
    certificates:
      restarts: {{ include "ohmlab-controller.restarts" $ }}
    {{- end }}
    {{- if has "storage" $targets }}
    {{- $s := $.Values.targets.storage }}
    storage:
      observeOnly: {{ $s.observeOnly }}
      allowDelete: {{ $s.allowDelete }}
      watchNamespaces: {{ $s.watchNamespaces | toJson }}
      rotationGrace: {{ $s.rotationGrace | quote }}
      backend:
        address: {{ $s.backend.address | quote }}
        {{- if $s.backend.caSecret }}
        caFile: /etc/ohmlab/vault-ca/{{ $s.backend.caKey }}
        {{- end }}
        skipTLSVerify: {{ $s.backend.skipTLSVerify }}
        auth:
          mount: {{ $s.backend.auth.mount | quote }}
          role: {{ $s.backend.auth.role | quote }}
          {{- if $s.backend.auth.audience }}
          tokenFile: /var/run/secrets/ohmlab/vault/token
          {{- end }}
      {{- if $s.storeCA.configMap }}
      caFile: /etc/ohmlab/store-ca/{{ $s.storeCA.key }}
      {{- end }}
      stores: {{ include "ohmlab-controller.storeConfigs" $ }}
    {{- end }}
{{- end }}
