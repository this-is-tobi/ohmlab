apiVersion: v2
name: keycloak
type: application
version: 0.1.0
dependencies:
- name: keycloak
  alias: keycloak
  version: 0.22.0
  repository: oci://ghcr.io/cloudpirates-io/helm-charts
  condition: keycloak.enabled
- name: keycloak-config-cli
  alias: keycloakConfigCli
  version: 1.3.8
  repository: https://jkroepke.github.io/helm-charts
  condition: keycloakConfigCli.enabled
- name: cluster
  alias: cnpg
  version: 0.9.0
  repository: https://cloudnative-pg.github.io/charts
- name: vso-utils
  alias: vso
  version: 2.4.0
  repository: oci://ghcr.io/this-is-tobi/charts
