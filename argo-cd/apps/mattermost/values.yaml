gateway:
  enabled: false
  gatewayName: ""
  gatewayNamespace: ""
  # Extra gateways to also attach routes to (e.g. during the APISIX→Traefik
  # migration): [{name, namespace?}] — sectionName is reused from the route.
  extraParentRefs: []
  routes: []

# Zero-trust NetworkPolicy for this namespace (templates/networkpolicy.yaml).
# Disabled by default — real rules live in the instance override.
networkPolicy:
  enabled: false
  egressDeny: true
  prometheusScrapePorts: []
  extraIngress: []
  extraEgress: []

mattermost:
  # The data and plugins volumes are ReadWriteOnce: a rolling update's surge
  # pod on another node can never attach them while the old pod holds them,
  # so the rollout hangs forever. With one replica, maxSurge 0 stops the old
  # pod first. (Not `type: Recreate`: server-side apply can't drop the
  # API-defaulted rollingUpdate block, so that switch is rejected.)
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  persistence:
    data:
      enabled: false
      size: 10Gi
      accessMode: ReadWriteOnce
    plugins:
      enabled: false
      size: 5Gi
      accessMode: ReadWriteOnce
  # Exposed via Gateway API HTTPRoute (gateway.routes) — no Ingress.
  ingress:
    enabled: false
  mysql:
    enabled: false
  externalDB:
    enabled: true
    externalDriverType: postgres
    externalConnectionString: ""
  securityContext:
    fsGroup: 2000
    fsGroupChangePolicy: OnRootMismatch
    # Image runs as the mattermost user (2000) — assert it for the
    # require-non-root policy.
    runAsUser: 2000
    runAsGroup: 2000
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  # Restricted PSS (tenant namespace); the chart sets nothing by default.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1536Mi
  serviceAccount:
    create: true
    name: mattermost
  config:
    MATTERMOST_EDITION: team
    MM_FEATUREFLAGS_STREAMLINEDMARKETPLACE: "false"
    MM_SERVICESETTINGS_SITEURL: ""
    MM_SERVICESETTINGS_COLLAPSEDTHREAD: default_on
    MM_SERVICESETTINGS_THREADAUTOFOLLOW: "true"
    MM_FILESETTINGS_MAXFILESIZE: "26214400000"
    MM_FILESETTINGS_DRIVERNAME: amazons3 # local
    MM_FILESETTINGS_AMAZONS3ACCESSKEYID: ""
    MM_FILESETTINGS_AMAZONS3SECRETACCESSKEY: ""
    MM_FILESETTINGS_AMAZONS3BUCKET: ""
    MM_FILESETTINGS_AMAZONS3PATHPREFIX: ""
    MM_FILESETTINGS_AMAZONS3REGION: ""
    MM_FILESETTINGS_AMAZONS3ENDPOINT: ""
    MM_SQLSETTINGS_DRIVERNAME: postgres
    MM_FILESETTINGS_AMAZONS3SSE: "false"
    # MM_EMAILSETTINGS_ENABLESMTPAUTH: "true"
    # MM_EMAILSETTINGS_FEEDBACKEMAIL: ""
    # MM_EMAILSETTINGS_SMTPUSERNAME: ""
    # MM_EMAILSETTINGS_SMTPPASSWORD: ""
    # MM_EMAILSETTINGS_SMTPSERVER: ""
    # MM_EMAILSETTINGS_SMTPPORT: ""
    MM_LOCALIZATIONSETTINGS_DEFAULTCLIENTLOCALE: en
    MM_LOGSETTINGS_CONSOLELEVEL: INFO
    MM_PLUGINSETTINGS_ENABLEUPLOADS: "true"
    MM_PLUGINSETTINGS_CLIENTDIRECTORY: ./client/plugins
    # MM_PLUGINSETTINGS_PLUGINSTATES: '{"com.mattermost.apps":{"Enable":true},"focalboard":{"Enable":true},"github":{"Enable":true},"com.github.manland.mattermost-plugin-gitlab":{"Enable":true},"com.github.matterpoll.matterpoll":{"Enable":true},"com.github.scottleedavis.mattermost-plugin-remind":{"Enable":true},"com.github.moussetc.mattermost-plugin-giphy":{"Enable":true},"com.mattermost.agenda":{"Enable":true},"alertmanager":{"Enable":true},"com.github.moussetc.mattermost.plugin.giphy":{"Enable":true},"jitsi":{"Enable":true},"com.cpanato.broadcast":{"Enable":true},"com.mattermost.plugin-todo":{"Enable":true}}'

cnpg:
  fullnameOverride: mattermost-pg-cluster
  version:
    postgresql: "17"
  cluster:
    # Image resolved for the major above from the shared catalog (see the
    # cloudnative-pg app); bumping `version.postgresql` runs an in-place
    # pg_upgrade.
    imageCatalogRef:
      kind: ClusterImageCatalog
      name: postgresql-standard-trixie
    # Masters are excluded from CNPG scheduling (they run etcd), narrowing
    # placement to worker nodes. 2 instances + PDB is sufficient HA for
    # this workload's criticality at homelab scale.
    instances: 2
    # Protects against voluntary disruption (drain/descheduler): with
    # masters excluded from CNPG scheduling and only 2 instances, losing
    # one to an eviction would leave a single replica. A drain on the
    # node hosting a PDB-protected instance needs --disable-eviction/
    # --force until CNPG relocates it first.
    enablePDB: true
    enableSuperuserAccess: false
    initdb:
      database: mattermost
      owner: mattermost
    storage:
      size: 7Gi
    walStorage:
      enabled: true
      size: 3Gi
    postgresql:
      # Caps WAL retained by replication slots: a lagging/dead replica costs
      # a re-clone, not disk pressure on the primary.
      parameters:
        max_slot_wal_keep_size: 1GB
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    affinity:
      topologyKey: kubernetes.io/hostname
      # Masters run etcd — keep data-bearing workloads off them.
      nodeSelector:
        node-type: worker
    # PodMonitor for the cnpg_* metrics (chart default is disabled) — the
    # cloudnative-pg Grafana dashboard was showing no data for every cluster
    # in the repo until this was turned on.
    monitoring:
      enabled: true
      prometheusRule:
        # HAWarning fires permanently below 3 instances, and ZoneSpread
        # needs topology.kubernetes.io/zone labels the nodes don't carry.
        excludeRules:
        - CNPGClusterHAWarning
        - CNPGClusterZoneSpreadWarning
      instrumentation:
        # The chart renders this queries ConfigMap but never wires it into
        # the Cluster, so it would only sit there unused.
        logicalReplication: false
  backups:
    enabled: true
    method: plugin
    pluginConfiguration:
      name: barman-cloud.cloudnative-pg.io
    endpointURL: ""
    destinationPath: "s3://<bucket-name>/<bucket-prefix>"
    # VSO-managed (never inline keys here). The chart hardcodes the
    # ACCESS_KEY_ID / ACCESS_SECRET_KEY key names.
    secret:
      create: false
      name: mattermost-pg-cluster-backup
    # The chart has no S3 region setting; the barman sidecar picks it up
    # from the standard AWS env var instead.
    instanceSidecarConfiguration:
      env:
      - name: AWS_DEFAULT_REGION
        valueFrom:
          secretKeyRef:
            name: mattermost-pg-cluster-backup
            key: S3_REGION
    # Chart default requests AES256 server-side encryption, which not every
    # S3-compatible store implements — defer to the bucket's own default.
    wal:
      encryption: ""
    data:
      encryption: ""
    retentionPolicy: 30d
    scheduledBackups:
    - name: daily
      schedule: "0 0 0 * * *"
      backupOwnerReference: self
      method: plugin
      pluginConfiguration:
        name: barman-cloud.cloudnative-pg.io

vso:
  extraObjects:
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: vso
  vaultAuth:
    default:
      method: kubernetes
      mount: kubernetes
      kubernetes:
        role: mattermost
        serviceAccount: vso
        audiences: [vault]
  vaultConnection:
    default:
      address: "https://vault.vault-operator-system.svc.cluster.local:8200"
      skipTLSVerify: false
      caCertSecretRef: vault-tls
  vaultStaticSecrets:
    mattermostS3:
      mount: ""
      path: ""
      type: kv-v2
      vaultAuthRef: mattermost-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: mattermost-s3
        create: true
        type: Opaque
        transformation:
          excludeRaw: true
          excludes:
          - ".*"
          templates:
            S3_ENDPOINT:
              text: '{{ get .Secrets "s3" | dig "endpoint" "" }}'
            S3_BUCKET_NAME:
              text: '{{ get .Secrets "s3" | dig "bucketName" "" }}'
            S3_BUCKET_PREFIX:
              text: '{{ get .Secrets "s3" | dig "bucketPrefix" "" }}'
            S3_ACCESS_KEY:
              text: '{{ get .Secrets "s3" | dig "accessKey" "" }}'
            S3_SECRET_KEY:
              text: '{{ get .Secrets "s3" | dig "secretKey" "" }}'
            S3_REGION:
              text: '{{ get .Secrets "s3" | dig "region" "" }}'
    mattermostDbInfos:
      mount: ""
      path: ""
      type: kv-v2
      vaultAuthRef: mattermost-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: mattermost-db-infos
        create: true
        type: Opaque
        transformation:
          excludeRaw: true
          excludes:
          - ".*"
          templates:
            DB_URL:
              text: 'postgresql://{{ get .Secrets "postgres" | dig "app" "username" "" }}:{{ get .Secrets "postgres" | dig "app" "password" "" }}@{{ get .Secrets "postgres" | dig "host" "" }}:{{ get .Secrets "postgres" | dig "port" "" }}/{{ get .Secrets "postgres" | dig "database" "" }}'
            DB_HOST:
              text: '{{ get .Secrets "postgres" | dig "host" "" }}'
            DB_PORT:
              text: '{{ get .Secrets "postgres" | dig "port" "" }}'
    mattermostDbSecret:
      mount: ""
      path: ""
      type: kv-v2
      vaultAuthRef: mattermost-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: mattermost-mattermost-dbsecret
        create: true
        overwrite: true
        type: Opaque
        transformation:
          excludeRaw: true
          excludes:
          - ".*"
          templates:
            mattermost.dbsecret:
              # VSO 1.3.x has a bug rendering mixed static-text/{{ }} templates when
              # the destination key contains a dot. Use a single printf expression to
              # avoid the issue — the entire value comes from one template action.
              text: '{{ printf "postgres://%s:%s@%s:%s/%s?sslmode=require&connect_timeout=10" (get .Secrets "postgres" | dig "app" "username" "") (get .Secrets "postgres" | dig "app" "password" "") (get .Secrets "postgres" | dig "host" "") (get .Secrets "postgres" | dig "port" "") (get .Secrets "postgres" | dig "database" "") }}'
    mattermostDbAdmin:
      mount: ""
      path: ""
      type: kv-v2
      vaultAuthRef: mattermost-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: mattermost-pg-cluster-admin
        create: true
        type: kubernetes.io/basic-auth
        transformation:
          excludeRaw: true
          excludes:
          - ".*"
          templates:
            username:
              text: '{{ get .Secrets "postgres" | dig "admin" "username" "" }}'
            password:
              text: '{{ get .Secrets "postgres" | dig "admin" "password" "" }}'
    mattermostDbApp:
      mount: ""
      path: ""
      type: kv-v2
      vaultAuthRef: mattermost-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: mattermost-pg-cluster-app
        create: true
        type: kubernetes.io/basic-auth
        transformation:
          excludeRaw: true
          excludes:
          - ".*"
          templates:
            username:
              text: '{{ get .Secrets "postgres" | dig "app" "username" "" }}'
            password:
              text: '{{ get .Secrets "postgres" | dig "app" "password" "" }}'
    mattermostPgBackup:
      mount: ""
      path: ""
      type: kv-v2
      vaultAuthRef: mattermost-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: mattermost-pg-cluster-backup
        create: true
        type: Opaque
        transformation:
          excludeRaw: true
          excludes:
          - ".*"
          templates:
            S3_ENDPOINT:
              text: '{{ get .Secrets "postgres" | dig "s3" "endpoint" "" }}'
            S3_BUCKET_NAME:
              text: '{{ get .Secrets "postgres" | dig "s3" "bucketName" "" }}'
            S3_BUCKET_PREFIX:
              text: '{{ get .Secrets "postgres" | dig "s3" "bucketPrefix" "" }}'
            ACCESS_KEY_ID:
              text: '{{ get .Secrets "postgres" | dig "s3" "accessKey" "" }}'
            ACCESS_SECRET_KEY:
              text: '{{ get .Secrets "postgres" | dig "s3" "secretKey" "" }}'
            S3_REGION:
              text: '{{ get .Secrets "postgres" | dig "s3" "region" "" }}'
