# Zero-trust NetworkPolicy for this namespace (templates/networkpolicy.yaml).
# Disabled by default — real rules live in the instance override.
networkPolicy:
  enabled: false
  egressDeny: true
  prometheusScrapePorts: []
  extraIngress: []
  extraEgress: []

cert-manager:
  crds:
    enabled: true
    keep: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  webhook:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
  cainjector:
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
  # PostSync hook Job (API readiness check), re-run on every sync.
  startupapicheck:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
  prometheus:
    enabled: true
    servicemonitor:
      enabled: true

scaleway-certmanager-webhook:
  secret:
    accessKey: ""
    secretKey: ""
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

defaultWildcard:
  enabled: true
  dnsZone: ""
  ingressNamespace: traefik
  secretName: default-wildcard-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-dns-prod

clusterIssuers: []
