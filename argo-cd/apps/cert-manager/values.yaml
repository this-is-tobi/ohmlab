# Internal CA for in-cluster TLS (templates/internal-ca.yaml): a self-signed
# root kept in this namespace and the ClusterIssuer `name` (type ca) on it,
# which apps get their serving certificates from (cert-manager's 90-day
# default). The trust-manager app publishes the root (internalCaBundle).
internalCA:
  enabled: false
  name: ohmlab-internal-ca
  # Long: a new root has to reach every client that trusts the old one.
  duration: 87600h # 10 years
  # The key is kept on renewal, and the bundle follows the renewed root
  # within one renewal of its anchor (90 days).
  renewBefore: 8760h # 1 year

vso:
  extraObjects:
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: vso
  # How every VaultAuth logs in: the method and mount the instance's manager
  # gives (global.ohmlab.vault.auth, jwt for an instance that reads another
  # instance's Vault), else kubernetes.
  vaultAuthDefaults:
    method: '{{ dig "ohmlab" "vault" "auth" "method" "kubernetes" (.Values.global | default dict) }}'
    mount: '{{ dig "ohmlab" "vault" "auth" "mount" "kubernetes" (.Values.global | default dict) }}'
  vaultAuth:
    default:
      login:
        role: cert-manager
        serviceAccount: vso
        audiences: [vault]
  # The mount and path of each secret that sets none: the ones the manager
  # gives this app's tier (global.ohmlab.vault.mount, and
  # global.ohmlab.vault.pathPrefix followed by cert-manager).
  vaultStaticSecretDefaults:
    mount: '{{ dig "ohmlab" "vault" "mount" "" (.Values.global | default dict) }}'
    path: '{{ with dig "ohmlab" "vault" "pathPrefix" "" (.Values.global | default dict) }}{{ . }}/cert-manager{{ end }}'
  vaultStaticSecrets:
    scwCreds:
      type: kv-v2
      vaultAuthRef: cert-manager-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: scw-creds
        create: true
        type: Opaque
        transformation:
          excludeRaw: true
          excludes:
          - ".*"
          templates:
            SCW_ACCESS_KEY:
              text: '{{ get .Secrets "scaleway" | dig "accessKey" "" }}'
            SCW_SECRET_KEY:
              text: '{{ get .Secrets "scaleway" | dig "secretKey" "" }}'
            SCW_DEFAULT_PROJECT_ID:
              text: '{{ get .Secrets "scaleway" | dig "projectId" "" }}'

# Grafana dashboards shipped with this app (templates/dashboards.yaml).
monitoring:
  dashboards:
    enabled: true
    folder: Services
