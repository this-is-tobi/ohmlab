# Zero-trust NetworkPolicy for this namespace (templates/networkpolicy.yaml).
# Disabled by default — real rules live in the instance override.
networkPolicy:
  enabled: false
  egressDeny: true
  prometheusScrapePorts: []
  extraIngress: []
  extraEgress: []

sops:
  replicaCount: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  extraEnv:
  - name: SOPS_AGE_KEY_FILE
    value: /etc/sops-age-key-file/keys
  secretsAsFiles:
  - mountPath: /etc/sops-age-key-file/
    name: sops-age-key-file
    secretName: sops-age-key-file
  securityContext:
    enabled: true
    container:
      enabled: true
  metrics:
    # The chart's own ServiceMonitor (scheme https + bearer token) has no
    # matching Service and no TLS/RBAC-proxy wired to the container — see
    # templates/service.yaml and templates/servicemonitor.yaml for the
    # working replacement this app ships instead.
    enabled: false

vso:
  extraObjects:
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: vso
  # How every VaultAuth logs in: the method and mount the instance's manager
  # gives (global.ohmlab.vault.auth, jwt for an instance that reads another
  # instance's Vault), else kubernetes.
  vaultAuthDefaults:
    method: '{{ dig "ohmlab" "vault" "auth" "method" "kubernetes" (.Values.global | default dict) }}'
    mount: '{{ dig "ohmlab" "vault" "auth" "mount" "kubernetes" (.Values.global | default dict) }}'
  vaultAuth:
    default:
      login:
        role: sops
        serviceAccount: vso
        audiences: [vault]
  vaultConnection:
    default:
      address: "https://vault.vault-operator-system.svc.cluster.local:8200"
      skipTLSVerify: false
      caCertSecretRef: vault-tls
  # The mount and path of each secret that sets none: the ones the manager
  # gives this app's tier (global.ohmlab.vault.mount, and
  # global.ohmlab.vault.pathPrefix followed by sops).
  vaultStaticSecretDefaults:
    mount: '{{ dig "ohmlab" "vault" "mount" "" (.Values.global | default dict) }}'
    path: '{{ with dig "ohmlab" "vault" "pathPrefix" "" (.Values.global | default dict) }}{{ . }}/sops{{ end }}'
  vaultStaticSecrets:
    sopsAgeKeyFile:
      type: kv-v2
      vaultAuthRef: sops-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: sops-age-key-file
        create: true
        type: Opaque
        transformation:
          excludeRaw: true
          excludes:
          - ".*"
          templates:
            keys:
              text: '{{ get .Secrets "keys" | b64dec }}'
