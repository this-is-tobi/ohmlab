gateway:
  enabled: false
  gatewayName: ""
  gatewayNamespace: ""
  # Extra gateways to also attach routes to (e.g. during the APISIX→Traefik
  # migration): [{name, namespace?}] — sectionName is reused from the route.
  extraParentRefs: []
  routes: []
  # BackendTLSPolicy entries for TLS-serving backends (templates/
  # backendtlspolicy.yaml): [{name, serviceName, hostname, caConfigMap? |
  # wellKnownCACertificates?}]. Requires Gateway API ≥v1.6 CRDs.
  backendTLSPolicies: []

# Zero-trust NetworkPolicy for this namespace (templates/networkpolicy.yaml).
# EGRESS ONLY — the upstream chart already ships ingress NetworkPolicies for
# every component. Disabled by default — real rules live in the instance
# override.
networkPolicy:
  enabled: false
  egressDeny: true
  prometheusScrapePorts: []
  extraIngress: []
  extraEgress: []

# The issuer of Redis's certificate when argo-cd.redis.tls.enabled is on.
# Empty: a CA of this namespace issues it. To use the internal CA:
# {kind: ClusterIssuer, name: ohmlab-internal-ca}.
redisCertificate:
  issuerRef: {}

argo-cd:
  configs:
    secret:
      argocdServerAdminPassword: ""
    params:
      # TLS end-to-end: argocd-server serves TLS itself (using the cert-manager
      # issued `argocd-server-tls` secret); the ingress annotation below makes
      # APISIX use https towards the upstream.
      server.insecure: false
    rbac:
      policy.csv: |
        p, role:none, *, *, */*, deny
        p, role:admin, *, *, */*, allow
        g, /admin, role:admin
    policy.default: role:none
    scopes: "[groups]"
    cm:
      url: ""
      resource.customizations: |
        networking.k8s.io/Ingress:
          health.lua: |
            hs = {}
            hs.status = "Healthy"
            return hs
      oidc.config: |
        name: Keycloak
        issuer: ""
        clientID: ""
        clientSecret: ""
        requestedScopes: ["openid", "profile", "email", "groups"]
  redis-ha:
    enabled: false
    haproxy:
      podDisruptionBudget:
        maxUnavailable: 1
    podDisruptionBudget:
      maxUnavailable: 1
  redis:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    # The metrics Service and ServiceMonitor above scrape this sidecar: without
    # it they have no port.
    exporter:
      enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
    # On by default: every client of this Redis is set up by this chart, and
    # the namespace CA needs nothing from the instance (false turns it off).
    # Redis serves TLS only, and the server, repo-server and application
    # controller (the ApplicationSet controller does not use Redis) verify it
    # against the ca.crt of this Secret, which templates/redis-certificate.yaml
    # issues (see redisCertificate). They read that CA when they start: after a
    # change of issuer on a running install, restart them once Redis serves the
    # new certificate. The single node Redis only, not redis-ha.
    tls:
      enabled: true
      secretName: argocd-redis-tls
    # Redis reads its certificate only when it starts, and has no reload
    # setting: CONFIG SET of the same paths makes it read them again, with no
    # restart and no log line, and a failed reload keeps the old certificate.
    # This sidecar does that every minute while TLS is on, and idles otherwise,
    # as a values list cannot add it only then. --insecure: it dials Redis on
    # loopback, a name the certificate does not hold, as the chart's probes and
    # exporter do. redis-cli exits 0 on an error reply, so the reply itself
    # tells a refused reload. An instance that sets this list replaces it: keep
    # tls-reload.
    extraContainers:
    - name: tls-reload
      image: '{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}'
      imagePullPolicy: '{{ default .Values.global.image.imagePullPolicy .Values.redis.image.imagePullPolicy }}'
      command: [/bin/sh, -c]
      args:
      - >-
        trap 'exit 0' TERM;
        {{ if .Values.redis.tls.enabled }}while :; do sleep 60 & wait $!;
        r=$(redis-cli --tls --insecure -p {{ .Values.redis.containerPorts.redis }}
        CONFIG SET tls-cert-file /app/config/redis-tls/{{ .Values.redis.tls.certFile }}
        tls-key-file /app/config/redis-tls/{{ .Values.redis.tls.keyFile }} 2>&1);
        [ "$r" = OK ] || echo "could not reload the TLS certificate: $r" >&2;
        done{{ else }}while :; do sleep 3600 & wait $!; done{{ end }}
      env:
      - name: REDISCLI_AUTH
        valueFrom:
          secretKeyRef:
            name: '{{ if and .Values.redis.existingSecret (not .Values.redisSecretInit.enabled) }}{{ .Values.redis.existingSecret }}{{ else }}argocd-redis{{ end }}'
            key: auth
      resources:
        requests:
          cpu: 5m
          memory: 8Mi
        limits:
          cpu: 50m
          memory: 32Mi
      securityContext:
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop:
          - ALL
  # PreSync hook Job seeding the redis password, re-run on every sync;
  # require-resource-limits flags it without these.
  redisSecretInit:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi
  notifications:
    enabled: false
    argocdUrl: ""
    context:
      provider: ""
      cluster: ""
      environment: ""
    secret:
      create: false
      items:
        mattermost-token: ""
        email-username: ""
        email-password: ""
    notifiers:
      service.email: |
        username: $email-username
        password: $email-password
        host: ""
        port: ""
        from: ""
      service.mattermost: |
        apiURL: https://""
        token: $mattermost-token
    triggers:
      trigger.on-deployed: |
        - description: Application is synced and healthy. Triggered once per commit.
          oncePer: app.status.sync.revision
          send:
          - app-deployed
          when: app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy'
      trigger.on-health-degraded: |
        - description: Application has degraded
          send:
          - app-health-degraded
          when: app.status.health.status == 'Degraded'
      trigger.on-sync-failed: |
        - description: Application syncing has failed
          send:
          - app-sync-failed
          when: app.status.operationState.phase in ['Error', 'Failed']
      trigger.on-sync-running: |
        - description: Application is being synced
          send:
          - app-sync-running
          when: app.status.operationState.phase in ['Running']
      trigger.on-sync-status-unknown: |
        - description: Application status is 'Unknown'
          send:
          - app-sync-status-unknown
          when: app.status.sync.status == 'Unknown'
      trigger.on-sync-succeeded: |
        - description: Application syncing has succeeded
          send:
          - app-sync-succeeded
          when: app.status.operationState.phase in ['Succeeded']
    # defaultTriggers.email: |
    #   - on-deployed
    #   - on-health-degraded
    #   - on-sync-running
    #   - on-sync-succeeded
    #   - on-sync-failed
    #   - on-sync-status-unknown
    defaultTriggers.mattermost: |
      - on-deployed
      - on-health-degraded
      - on-sync-running
      - on-sync-succeeded
      - on-sync-failed
      - on-sync-status-unknown
    templates:
      template.app-deployed: |
        email:
          subject: New version of an application {{.app.metadata.name}} is up and running.
        message: |
          {{if eq .serviceType "mattermost"}}:white_check_mark:{{end}} Application {{.app.metadata.name}} is now running new version of deployments manifests.
        mattermost:
          attachments: |
            [{
              "title": "{{.app.metadata.name}}",
              "title_link":"{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
              "color": "#18be52",
              "fields": [
              {
                "title": "Sync Status",
                "value": "{{.app.status.sync.status}}",
                "short": true
              },
              {
                "title": "Repository",
                "value": "{{.app.spec.source.repoURL}}",
                "short": true
              },
              {
                "title": "Revision",
                "value": "{{.app.status.sync.revision}}",
                "short": true
              }
              {{range $index, $c := .app.status.conditions}}
              {{if not $index}},{{end}}
              {{if $index}},{{end}}
              {
                "title": "{{$c.type}}",
                "value": "{{$c.message}}",
                "short": true
              }
              {{end}}
              ]
            }]
      template.app-health-degraded: |
        email:
          subject: Application {{.app.metadata.name}} has degraded.
        message: |
          {{if eq .serviceType "mattermost"}}:exclamation:{{end}} Application {{.app.metadata.name}} has degraded.
          Application details: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}.
        mattermost:
          attachments: |-
            [{
              "title": "{{ .app.metadata.name}}",
              "title_link": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
              "color": "#f4c030",
              "fields": [
              {
                "title": "Sync Status",
                "value": "{{.app.status.sync.status}}",
                "short": true
              },
              {
                "title": "Repository",
                "value": "{{.app.spec.source.repoURL}}",
                "short": true
              }
              {{range $index, $c := .app.status.conditions}}
              {{if not $index}},{{end}}
              {{if $index}},{{end}}
              {
                "title": "{{$c.type}}",
                "value": "{{$c.message}}",
                "short": true
              }
              {{end}}
              ]
            }]
      template.app-sync-failed: |
        email:
          subject: Failed to sync application {{.app.metadata.name}}.
        message: |
          {{if eq .serviceType "mattermost"}}:exclamation:{{end}}  The sync operation of application {{.app.metadata.name}} has failed at {{.app.status.operationState.finishedAt}} with the following error: {{.app.status.operationState.message}}
          Sync operation details are available at: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}?operation=true .
        mattermost:
          attachments: |-
            [{
              "title": "{{ .app.metadata.name}}",
              "title_link":"{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
              "color": "#E96D76",
              "fields": [
              {
                "title": "Sync Status",
                "value": "{{.app.status.sync.status}}",
                "short": true
              },
              {
                "title": "Repository",
                "value": "{{.app.spec.source.repoURL}}",
                "short": true
              }
              {{range $index, $c := .app.status.conditions}}
              {{if not $index}},{{end}}
              {{if $index}},{{end}}
              {
                "title": "{{$c.type}}",
                "value": "{{$c.message}}",
                "short": true
              }
              {{end}}
              ]
            }]
      template.app-sync-running: |
        email:
          subject: Start syncing application {{.app.metadata.name}}.
        message: |
          The sync operation of application {{.app.metadata.name}} has started at {{.app.status.operationState.startedAt}}.
          Sync operation details are available at: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}?operation=true .
        mattermost:
          attachments: |-
            [{
              "title": "{{ .app.metadata.name}}",
              "title_link":"{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
              "color": "#0DADEA",
              "fields": [
              {
                "title": "Sync Status",
                "value": "{{.app.status.sync.status}}",
                "short": true
              },
              {
                "title": "Repository",
                "value": "{{.app.spec.source.repoURL}}",
                "short": true
              }
              {{range $index, $c := .app.status.conditions}}
              {{if not $index}},{{end}}
              {{if $index}},{{end}}
              {
                "title": "{{$c.type}}",
                "value": "{{$c.message}}",
                "short": true
              }
              {{end}}
              ]
            }]
      template.app-sync-status-unknown: |
        email:
          subject: Application {{.app.metadata.name}} sync status is 'Unknown'
        message: |
          {{if eq .serviceType "mattermost"}}:exclamation:{{end}} Application {{.app.metadata.name}} sync is 'Unknown'.
          Application details: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}.
          {{if ne .serviceType "mattermost"}}
          {{range $c := .app.status.conditions}}
              * {{$c.message}}
          {{end}}
          {{end}}
        mattermost:
          attachments: |-
            [{
              "title": "{{ .app.metadata.name}}",
              "title_link":"{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
              "color": "#E96D76",
              "fields": [
              {
                "title": "Sync Status",
                "value": "{{.app.status.sync.status}}",
                "short": true
              },
              {
                "title": "Repository",
                "value": "{{.app.spec.source.repoURL}}",
                "short": true
              }
              {{range $index, $c := .app.status.conditions}}
              {{if not $index}},{{end}}
              {{if $index}},{{end}}
              {
                "title": "{{$c.type}}",
                "value": "{{$c.message}}",
                "short": true
              }
              {{end}}
              ]
            }]
      template.app-sync-succeeded: |
        email:
          subject: Application {{.app.metadata.name}} has been successfully synced.
        message: |
          {{if eq .serviceType "mattermost"}}:white_check_mark:{{end}} Application {{.app.metadata.name}} has been successfully synced at {{.app.status.operationState.finishedAt}}.
          Sync operation details are available at: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}?operation=true .
        mattermost:
          attachments: |-
            [{
              "title": "{{ .app.metadata.name}}",
              "title_link":"{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
              "color": "#18be52",
              "fields": [
              {
                "title": "Sync Status",
                "value": "{{.app.status.sync.status}}",
                "short": true
              },
              {
                "title": "Repository",
                "value": "{{.app.spec.source.repoURL}}",
                "short": true
              }
              {{range $index, $c := .app.status.conditions}}
              {{if not $index}},{{end}}
              {{if $index}},{{end}}
              {
                "title": "{{$c.type}}",
                "value": "{{$c.message}}",
                "short": true
              }
              {{end}}
              ]
            }]
    replicas: 1
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
  controller:
    replicas: 1
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    pdb:
      enabled: true
      maxUnavailable: 1
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
  applicationSet:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    pdb:
      enabled: true
      maxUnavailable: 1
    # No Ingress. An instance that wants Git webhooks routes to the
    # controller and admits its gateway with a networkPolicy.extraIngress rule
    # for the webhook port (docs/05-services.md).
    ingress:
      enabled: false
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
  dex:
    enabled: false
  server:
    autoscaling:
      enabled: false
      minReplicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    pdb:
      enabled: true
      maxUnavailable: 1
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    # UI is exposed via HTTPRoute + BackendTLSPolicy — no Ingress. The
    # server's own TLS cert (argocd-server-tls) comes from the chart-native
    # cert-manager integration; set certificate.domain per instance.
    ingress:
      enabled: false
    certificate:
      enabled: true
      domain: ""
      issuer:
        group: cert-manager.io
        kind: ClusterIssuer
        name: letsencrypt-dns-prod
  repoServer:
    autoscaling:
      enabled: false
      minReplicas: 1
    # Also applied to the copyutil init container (chart default fallback).
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    pdb:
      enabled: true
      maxUnavailable: 1
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    rbac:
    - apiGroups:
      - ""
      resources:
      - secrets
      verbs:
      - get
      - watch
  crds:
    install: true
    keep: true

vso:
  extraObjects:
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: vso
  # How every VaultAuth logs in: the method and mount the instance's manager
  # gives (global.ohmlab.vault.auth, jwt for an instance that reads another
  # instance's Vault), else kubernetes.
  vaultAuthDefaults:
    method: '{{ dig "ohmlab" "vault" "auth" "method" "kubernetes" (.Values.global | default dict) }}'
    mount: '{{ dig "ohmlab" "vault" "auth" "mount" "kubernetes" (.Values.global | default dict) }}'
  vaultAuth:
    default:
      login:
        role: argo-cd
        serviceAccount: vso
        audiences: [vault]
  # The mount and path of each secret that sets none: the ones the manager
  # gives this app's tier (global.ohmlab.vault.mount, and
  # global.ohmlab.vault.pathPrefix followed by argo-cd).
  vaultStaticSecretDefaults:
    mount: '{{ dig "ohmlab" "vault" "mount" "" (.Values.global | default dict) }}'
    path: '{{ with dig "ohmlab" "vault" "pathPrefix" "" (.Values.global | default dict) }}{{ . }}/argo-cd{{ end }}'
  vaultStaticSecrets:
    argoCdAdmin:
      type: kv-v2
      vaultAuthRef: argo-cd-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: argo-cd-admin
        create: true
        type: kubernetes.io/basic-auth
        transformation:
          excludeRaw: true
          excludes:
          - ".*"
          templates:
            username:
              text: '{{ get .Secrets "admin" | dig "username" "" }}'
            password:
              text: '{{ get .Secrets "admin" | dig "password" "" }}'
    argoCdConfig:
      type: kv-v2
      vaultAuthRef: argo-cd-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: argo-cd-config
        create: true
        type: Opaque
        labels:
          app.kubernetes.io/part-of: argocd
        transformation:
          excludeRaw: true
          excludes:
          - ".*"
          templates:
            PASSWORD_HASHED:
              text: '{{ get .Secrets "admin" | dig "passwordHashed" "" }}'
    argoCdSso:
      type: kv-v2
      vaultAuthRef: argo-cd-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: argo-cd-sso
        create: true
        type: Opaque
        labels:
          app.kubernetes.io/part-of: argocd
        transformation:
          excludeRaw: true
          excludes:
          - ".*"
          templates:
            OIDC_CLIENT_ID:
              text: '{{ get .Secrets "keycloak" | dig "clientId" "" }}'
            OIDC_CLIENT_SECRET:
              text: '{{ get .Secrets "keycloak" | dig "clientSecret" "" }}'
