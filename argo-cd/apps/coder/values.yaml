coder:
  coder:
    service:
      type: ClusterIP
    ingress:
      enable: true
      className: traefik
      host: ""
      wildcardHost: "*."
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-dns-prod
      tls:
        enable: true
        secretName: ""
        wildcardSecretName: ""
    envUseClusterAccessURL: false
    env:
    # The instance points it at DB_URL of the coder-db-infos Secret, which requires TLS.
    - name: CODER_PG_CONNECTION_URL
      value: ""
    - name: CODER_ACCESS_URL
      value: ""
    - name: CODER_OIDC_ISSUER_URL
      value: ""
    - name: CODER_OIDC_CLIENT_ID
      value: ""
    - name: CODER_OIDC_CLIENT_SECRET
      value: ""
    - name: CODER_OIDC_SIGN_IN_TEXT
      value: Login with Keycloak
    - name: CODER_OIDC_SCOPES
      value: "openid,profile,email,groups,roles"
    - name: CODER_OIDC_GROUP_FIELD
      value: groups
    - name: CODER_OIDC_ADMIN_GROUP
      value: admin
    - name: CODER_OIDC_GROUP_AUTO_CREATE
      value: "true"
    # Pod Security restricted wants every capability dropped (merged with the
    # chart's own security context, which sets the rest of the profile).
    securityContext:
      capabilities:
        drop:
        - ALL

cnpg:
  fullnameOverride: coder-pg-cluster
  version:
    postgresql: "17"
  cluster:
    # Image resolved for the major above from the shared catalog (see the
    # cloudnative-pg app); bumping `version.postgresql` runs an in-place
    # pg_upgrade.
    imageCatalogRef:
      kind: ClusterImageCatalog
      name: postgresql-standard-trixie
    instances: 3
    enableSuperuserAccess: false
    initdb:
      database: coder
      owner: coder
    storage:
      size: 3Gi
    walStorage:
      enabled: true
      size: 3Gi
    postgresql:
      # Caps WAL retained by replication slots: a lagging/dead replica costs
      # a re-clone, not disk pressure on the primary.
      parameters:
        max_slot_wal_keep_size: 1GB
      # Refuses plaintext clients: CNPG's last rule (host all all all
      # scram-sha-256) would take them.
      pg_hba:
      - hostnossl all all all reject
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    affinity:
      topologyKey: kubernetes.io/hostname
    # Off until the instance-manager turns it on with the app's pg claim
    # (docs/10): the backup alerts read its PodMonitor.
    monitoring:
      prometheusRule:
        # HAWarning fires permanently below 3 instances, and ZoneSpread
        # needs topology.kubernetes.io/zone labels the nodes don't carry.
        excludeRules:
        - CNPGClusterHAWarning
        - CNPGClusterZoneSpreadWarning
      instrumentation:
        # The chart renders this queries ConfigMap but never wires it into
        # the Cluster, so it would only sit there unused.
        logicalReplication: false
  backups:
    # The instance-manager turns it on with the app's pg claim (docs/10).
    enabled: false
    method: plugin
    # A backup taken on a standby is restorable only once the primary
    # switches its WAL segment, which a quiet database may not do for hours.
    target: primary
    pluginConfiguration:
      name: barman-cloud.cloudnative-pg.io
    endpointURL: ""
    destinationPath: "s3://"
    # VSO-managed (never inline keys here). The chart hardcodes the
    # ACCESS_KEY_ID / ACCESS_SECRET_KEY key names.
    secret:
      create: false
      name: coder-pg-cluster-backup
    # The chart has no S3 region setting; the barman sidecar picks it up
    # from the standard AWS env var instead.
    instanceSidecarConfiguration:
      env:
      - name: AWS_DEFAULT_REGION
        valueFrom:
          secretKeyRef:
            name: coder-pg-cluster-backup
            key: S3_REGION
    # A plain resource synced before the Cluster: as a Helm hook, Argo CD runs
    # it as an untracked PreSync hook that outlives a disabled backup.
    objectStore:
      helmHook: false
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
    # Chart default requests AES256 server-side encryption, which not every
    # S3-compatible store implements — defer to the bucket's own default.
    wal:
      encryption: ""
      compression: gzip
    data:
      encryption: ""
      compression: gzip
    retentionPolicy: 30d
    scheduledBackups:
    - name: daily
      schedule: "0 50 20 * * *"
      backupOwnerReference: self
      method: plugin
      pluginConfiguration:
        name: barman-cloud.cloudnative-pg.io

vso:
  extraObjects:
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: vso
  # How every VaultAuth logs in: the method and mount the instance's manager
  # gives (global.ohmlab.vault.auth, jwt for an instance that reads another
  # instance's Vault), else kubernetes.
  vaultAuthDefaults:
    method: '{{ dig "ohmlab" "vault" "auth" "method" "kubernetes" (.Values.global | default dict) }}'
    mount: '{{ dig "ohmlab" "vault" "auth" "mount" "kubernetes" (.Values.global | default dict) }}'
  vaultAuth:
    default:
      login:
        role: coder
        serviceAccount: vso
        audiences: [vault]
  # The mount and path of each secret that sets none: the ones the manager
  # gives this app's tier (global.ohmlab.vault.mount, and
  # global.ohmlab.vault.pathPrefix followed by coder).
  vaultStaticSecretDefaults:
    mount: '{{ dig "ohmlab" "vault" "mount" "" (.Values.global | default dict) }}'
    path: '{{ with dig "ohmlab" "vault" "pathPrefix" "" (.Values.global | default dict) }}{{ . }}/coder{{ end }}'
  vaultStaticSecrets:
    coderDbInfos:
      type: kv-v2
      vaultAuthRef: coder-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: coder-db-infos
        create: true
        type: Opaque
        transformation:
          excludeRaw: true
          excludes:
          - ".*"
          templates:
            DB_URL:
              text: 'postgresql://{{ get .Secrets "postgres" | dig "app" "username" "" }}:{{ get .Secrets "postgres" | dig "app" "password" "" }}@{{ get .Secrets "postgres" | dig "host" "" }}:{{ get .Secrets "postgres" | dig "port" "" }}/{{ get .Secrets "postgres" | dig "database" "" }}?sslmode=require'
            DB_HOST:
              text: '{{ get .Secrets "postgres" | dig "host" "" }}'
            DB_PORT:
              text: '{{ get .Secrets "postgres" | dig "port" "" }}'
    coderDbAdmin:
      type: kv-v2
      vaultAuthRef: coder-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: coder-pg-cluster-admin
        create: true
        type: kubernetes.io/basic-auth
        transformation:
          excludeRaw: true
          excludes:
          - ".*"
          templates:
            username:
              text: '{{ get .Secrets "postgres" | dig "admin" "username" "" }}'
            password:
              text: '{{ get .Secrets "postgres" | dig "admin" "password" "" }}'
    coderDbApp:
      type: kv-v2
      vaultAuthRef: coder-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: coder-pg-cluster-app
        create: true
        type: kubernetes.io/basic-auth
        transformation:
          excludeRaw: true
          excludes:
          - ".*"
          templates:
            username:
              text: '{{ get .Secrets "postgres" | dig "app" "username" "" }}'
            password:
              text: '{{ get .Secrets "postgres" | dig "app" "password" "" }}'
            # Read by the cnpg chart's ping test, as in the app Secret CNPG
            # itself generates.
            dbname:
              text: '{{ get .Secrets "postgres" | dig "database" "" }}'
    # The plugin's key: the pg claim's record once the claim is on
    # (global.ohmlab.storage.pg), else postgres.s3 at the app's own path.
    coderPgBackup:
      type: kv-v2
      path: '{{ with dig "ohmlab" "vault" "pathPrefix" "" (.Values.global | default dict) }}{{ . }}/coder{{ if dig "ohmlab" "storage" "pg" "enabled" false ($.Values.global | default dict) }}/s3{{ end }}{{ end }}'
      vaultAuthRef: coder-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: coder-pg-cluster-backup
        create: true
        type: Opaque
        transformation:
          excludeRaw: true
          excludes:
          - ".*"
          templates:
            ACCESS_KEY_ID:
              text: '{{ with get .Secrets "pg" }}{{ dig "accessKey" "" . }}{{ else }}{{ get .Secrets "postgres" | dig "s3" "accessKey" "" }}{{ end }}'
            ACCESS_SECRET_KEY:
              text: '{{ with get .Secrets "pg" }}{{ dig "secretKey" "" . }}{{ else }}{{ get .Secrets "postgres" | dig "s3" "secretKey" "" }}{{ end }}'
            S3_REGION:
              text: '{{ with get .Secrets "pg" }}{{ dig "region" "" . }}{{ else }}{{ get .Secrets "postgres" | dig "s3" "region" "" }}{{ end }}'
            ca.crt:
              text: '{{ with get .Secrets "pg" }}{{ dig "ca" "" . }}{{ end }}'
    coderSso:
      type: kv-v2
      vaultAuthRef: coder-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: coder-sso
        create: true
        type: Opaque
        transformation:
          excludeRaw: true
          excludes:
          - ".*"
          templates:
            OIDC_CLIENT_SECRET:
              text: '{{ get .Secrets "keycloak" | dig "clientSecret" "" }}'
