sonarqube:
  community:
    enabled: true
    buildNumber: 26.3.0.120487
  ingress:
    enabled: true
    ingressClassName: apisix
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-dns-prod
    hosts:
    - name: ""
      path: /
    tls:
    - hosts:
      - ""
      secretName: ""
  plugins:
    install:
    - https://github.com/mc1arke/sonarqube-community-branch-plugin/releases/download/26.3.0/sonarqube-community-branch-plugin-26.3.0.jar
    - https://github.com/sonar-auth-oidc/sonar-auth-oidc/releases/download/v3.0.0/sonar-auth-oidc-plugin-3.0.0.jar
    - https://github.com/cnescatlab/sonar-cnes-report/releases/download/5.0.5/sonar-cnes-report-5.0.5.jar
  resources:
    limits:
      cpu: 800m
      memory: 3Gi
    requests:
      cpu: 200m
      memory: 3Gi
  postgresql:
    enabled: false
  jdbcOverwrite:
    enable: true
    # The CNPG cluster below, over TLS (it refuses plaintext anyway).
    jdbcUrl: "jdbc:postgresql://sonarqube-pg-cluster-rw:5432/sonarqube?sslmode=require&socketTimeout=1500"
    jdbcUsername: ""
    jdbcSecretName: sonarqube-pg-cluster-app
    jdbcSecretPasswordKey: password
  setAdminPassword:
    passwordSecretName: sonarqube-admin
    # securityContext: {}
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 128Mi
  monitoringPasscodeSecretName: sonarqube-admin
  monitoringPasscodeSecretKey: monitoringPasscode
  jvmOpts: "-javaagent:/opt/sonarqube/extensions/plugins/sonarqube-community-branch-plugin-26.3.0.jar=web"
  jvmCeOpts: "-javaagent:/opt/sonarqube/extensions/plugins/sonarqube-community-branch-plugin-26.3.0.jar=ce"
  # Off: the init container that raised vm.max_map_count ran privileged, which
  # the baseline policy refuses. The nodes that run SonarQube set it instead, to
  # 262144 or more: the search engine fails its bootstrap checks below that.
  initSysctl:
    enabled: false
    vmMaxMapCount: 262144
  prometheusMonitoring:
    podMonitor:
      enabled: true
      # namespace: sonarqube
  prometheusExporter:
    enabled: true
  livenessProbe:
    initialDelaySeconds: 180
    periodSeconds: 30
    failureThreshold: 20
  startupProbe:
    initialDelaySeconds: 60
    periodSeconds: 20
    failureThreshold: 30
  sonarProperties:
    # sonar.core.serverBaseURL: ""
    sonar.plugins.risk.consent: ACCEPTED
    sonar.auth.oidc.enabled: "true"
    sonar.auth.oidc.allowUsersToSignUp: "true"
    sonar.auth.oidc.autoLogin: "false"
    sonar.auth.oidc.loginButtonText: Connect with Keycloak
    sonar.auth.oidc.groupsSync.claimName: groups
    sonar.auth.oidc.loginStrategy: Email
    sonar.auth.oidc.groupsSync: "true"
    sonar.auth.oidc.scopes: openid profile email roles groups
    # sonar.auth.oidc.issuerUri: ""
    sonar.auth.oidc.loginStrategy.customClaim.name: upn
    sonar.auth.oidc.clientId.secured: ""
    # sonar.auth.oidc.clientSecret.secured: ""
  extraVolumes:
  - name: webapp
    emptyDir:
      sizeLimit: 50Mi
  extraVolumeMounts:
  - name: webapp
    mountPath: /opt/sonarqube/web
  # The chart's init containers (they copy files and fetch the plugin jars).
  initContainers:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi
  extraInitContainers:
  - name: download-webapp
    image: docker.io/busybox:1.38
    # As the SonarQube user, so what it extracts is already owned by it.
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 0
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 256Mi
    volumeMounts:
    - name: webapp
      mountPath: /web
    command:
    - sh
    - -c
    - wget -O /tmp/sonarqube-webapp.zip https://github.com/mc1arke/sonarqube-community-branch-plugin/releases/download/26.3.0/sonarqube-webapp.zip && unzip -o /tmp/sonarqube-webapp.zip -d /web && chmod -R 755 /web/* && rm -f /tmp/sonarqube-webapp.zip

cnpg:
  fullnameOverride: sonarqube-pg-cluster
  version:
    postgresql: "17"
  cluster:
    # Image resolved for the major above from the shared catalog (see the
    # cloudnative-pg app); bumping `version.postgresql` runs an in-place
    # pg_upgrade.
    imageCatalogRef:
      kind: ClusterImageCatalog
      name: postgresql-standard-trixie
    instances: 3
    enableSuperuserAccess: false
    initdb:
      database: sonarqube
      owner: sonarqube
    storage:
      size: 7Gi
    walStorage:
      enabled: true
      size: 3Gi
    postgresql:
      # Caps WAL retained by replication slots: a lagging/dead replica costs
      # a re-clone, not disk pressure on the primary.
      parameters:
        max_slot_wal_keep_size: 1GB
      # Refuses plaintext clients: CNPG's last rule (host all all all
      # scram-sha-256) would take them.
      pg_hba:
      - hostnossl all all all reject
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    affinity:
      topologyKey: kubernetes.io/hostname
    # Off until the instance-manager turns it on with the app's pg claim
    # (docs/10): the backup alerts read its PodMonitor.
    monitoring:
      prometheusRule:
        # HAWarning fires permanently below 3 instances, and ZoneSpread
        # needs topology.kubernetes.io/zone labels the nodes don't carry.
        excludeRules:
        - CNPGClusterHAWarning
        - CNPGClusterZoneSpreadWarning
      instrumentation:
        # The chart renders this queries ConfigMap but never wires it into
        # the Cluster, so it would only sit there unused.
        logicalReplication: false
  backups:
    # The instance-manager turns it on with the app's pg claim (docs/10).
    enabled: false
    method: plugin
    pluginConfiguration:
      name: barman-cloud.cloudnative-pg.io
    endpointURL: ""
    destinationPath: "s3:///<bucket-name>/<bucket-prefix>"
    # VSO-managed (never inline keys here). The chart hardcodes the
    # ACCESS_KEY_ID / ACCESS_SECRET_KEY key names.
    secret:
      create: false
      name: sonarqube-pg-cluster-backup
    # The chart has no S3 region setting; the barman sidecar picks it up
    # from the standard AWS env var instead.
    instanceSidecarConfiguration:
      env:
      - name: AWS_DEFAULT_REGION
        valueFrom:
          secretKeyRef:
            name: sonarqube-pg-cluster-backup
            key: S3_REGION
    # A plain resource synced before the Cluster: as a Helm hook, Argo CD runs
    # it as an untracked PreSync hook that outlives a disabled backup.
    objectStore:
      helmHook: false
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
    # Chart default requests AES256 server-side encryption, which not every
    # S3-compatible store implements — defer to the bucket's own default.
    wal:
      encryption: ""
      compression: gzip
    data:
      encryption: ""
      compression: gzip
    retentionPolicy: 30d
    scheduledBackups:
    - name: daily
      schedule: "0 35 20 * * *"
      backupOwnerReference: self
      method: plugin
      pluginConfiguration:
        name: barman-cloud.cloudnative-pg.io

vso:
  extraObjects:
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: vso
  # How every VaultAuth logs in: the method and mount the instance's manager
  # gives (global.ohmlab.vault.auth, jwt for an instance that reads another
  # instance's Vault), else kubernetes.
  vaultAuthDefaults:
    method: '{{ dig "ohmlab" "vault" "auth" "method" "kubernetes" (.Values.global | default dict) }}'
    mount: '{{ dig "ohmlab" "vault" "auth" "mount" "kubernetes" (.Values.global | default dict) }}'
  vaultAuth:
    default:
      login:
        role: sonarqube
        serviceAccount: vso
        audiences: [vault]
  # The mount and path of each secret that sets none: the ones the manager
  # gives this app's tier (global.ohmlab.vault.mount, and
  # global.ohmlab.vault.pathPrefix followed by sonarqube).
  vaultStaticSecretDefaults:
    mount: '{{ dig "ohmlab" "vault" "mount" "" (.Values.global | default dict) }}'
    path: '{{ with dig "ohmlab" "vault" "pathPrefix" "" (.Values.global | default dict) }}{{ . }}/sonarqube{{ end }}'
  vaultStaticSecrets:
    sonarqubeAdmin:
      type: kv-v2
      vaultAuthRef: sonarqube-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: sonarqube-admin
        create: true
        type: Opaque
        transformation:
          excludeRaw: true
          excludes:
          - ".*"
          templates:
            username:
              text: '{{ get .Secrets "admin" | dig "username" "" }}'
            password:
              text: '{{ get .Secrets "admin" | dig "password" "" }}'
            currentPassword:
              text: '{{ get .Secrets "admin" | dig "initialPassword" "" }}'
            monitoringPasscode:
              text: '{{ get .Secrets "admin" | dig "monitoringPassword" "" }}'
    sonarqubeProperties:
      type: kv-v2
      vaultAuthRef: sonarqube-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: sonarqube-properties
        create: true
        type: Opaque
        transformation:
          excludeRaw: true
          excludes:
          - ".*"
          templates:
            sonar.properties:
              text: |
                sonar.auth.oidc.clientSecret.secured: '{{ get .Secrets "keycloak" | dig "clientSecret" "" }}'
    sonarqubeDbInfos:
      type: kv-v2
      vaultAuthRef: sonarqube-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: sonarqube-db-infos
        create: true
        type: Opaque
        transformation:
          excludeRaw: true
          excludes:
          - ".*"
          templates:
            DB_URL:
              text: 'postgresql://{{ get .Secrets "postgres" | dig "app" "username" "" }}:{{ get .Secrets "postgres" | dig "app" "password" "" }}@{{ get .Secrets "postgres" | dig "host" "" }}:{{ get .Secrets "postgres" | dig "port" "" }}/{{ get .Secrets "postgres" | dig "database" "" }}?sslmode=require'
            DB_HOST:
              text: '{{ get .Secrets "postgres" | dig "host" "" }}'
            DB_PORT:
              text: '{{ get .Secrets "postgres" | dig "port" "" }}'
    sonarqubeDbAdmin:
      type: kv-v2
      vaultAuthRef: sonarqube-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: sonarqube-pg-cluster-admin
        create: true
        type: kubernetes.io/basic-auth
        transformation:
          excludeRaw: true
          excludes:
          - ".*"
          templates:
            username:
              text: '{{ get .Secrets "postgres" | dig "admin" "username" "" }}'
            password:
              text: '{{ get .Secrets "postgres" | dig "admin" "password" "" }}'
    sonarqubeDbApp:
      type: kv-v2
      vaultAuthRef: sonarqube-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: sonarqube-pg-cluster-app
        create: true
        type: kubernetes.io/basic-auth
        transformation:
          excludeRaw: true
          excludes:
          - ".*"
          templates:
            username:
              text: '{{ get .Secrets "postgres" | dig "app" "username" "" }}'
            password:
              text: '{{ get .Secrets "postgres" | dig "app" "password" "" }}'
    # The plugin's key: the pg claim's record once the claim is on
    # (global.ohmlab.storage.pg), else postgres.s3 at the app's own path.
    sonarqubePgBackup:
      type: kv-v2
      path: '{{ with dig "ohmlab" "vault" "pathPrefix" "" (.Values.global | default dict) }}{{ . }}/sonarqube{{ if dig "ohmlab" "storage" "pg" "enabled" false ($.Values.global | default dict) }}/s3{{ end }}{{ end }}'
      vaultAuthRef: sonarqube-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: sonarqube-pg-cluster-backup
        create: true
        type: Opaque
        transformation:
          excludeRaw: true
          excludes:
          - ".*"
          templates:
            ACCESS_KEY_ID:
              text: '{{ with get .Secrets "pg" }}{{ dig "accessKey" "" . }}{{ else }}{{ get .Secrets "postgres" | dig "s3" "accessKey" "" }}{{ end }}'
            ACCESS_SECRET_KEY:
              text: '{{ with get .Secrets "pg" }}{{ dig "secretKey" "" . }}{{ else }}{{ get .Secrets "postgres" | dig "s3" "secretKey" "" }}{{ end }}'
            S3_REGION:
              text: '{{ with get .Secrets "pg" }}{{ dig "region" "" . }}{{ else }}{{ get .Secrets "postgres" | dig "s3" "region" "" }}{{ end }}'
            ca.crt:
              text: '{{ with get .Secrets "pg" }}{{ dig "ca" "" . }}{{ end }}'
    sonarqubeSso:
      type: kv-v2
      vaultAuthRef: sonarqube-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: sonarqube-sso
        create: true
        type: Opaque
        transformation:
          excludeRaw: true
          excludes:
          - ".*"
          templates:
            OIDC_CLIENT_ID:
              text: '{{ get .Secrets "keycloak" | dig "clientId" "" }}'
            OIDC_CLIENT_SECRET:
              text: '{{ get .Secrets "keycloak" | dig "clientSecret" "" }}'
