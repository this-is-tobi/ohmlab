rule_files: [rules.yaml]
evaluation_interval: 1m
tests:
# Pushed metrics have no scrape target, so TargetDown cannot see RustFS go
# silent: 15m without its target_info fires; a live push never does. The job
# label is the OTLP service.name, which RustFS sets with a capital R and S, and
# each RustFS reports its namespace as its environment (charts render into
# namespace "test").
- interval: 1m
  input_series:
  - series: 'target_info{job="RustFS", instance="10.45.1.2", deployment_environment_name="test"}'
    values: '1x5 _x30'
  alert_rule_test:
  - eval_time: 10m
    alertname: RustFSMetricsAbsent
    exp_alerts: []
  - eval_time: 30m
    alertname: RustFSMetricsAbsent
    exp_alerts:
    - exp_labels: {severity: warning, deployment_environment_name: test}
      exp_annotations:
        summary: The RustFS in test has stopped pushing metrics
        description: "No metrics of the RustFS in test reached Prometheus for 15m. Check its pod, then Alloy's OTLP receiver (otelcol_receiver_* metrics) and the rustfs to Alloy network policy. Its metrics count only while its RUSTFS_OBS_ENVIRONMENT is its namespace: an extraEnv list that replaces the chart's keeps that entry."
# Still pushing at 30m: never fires.
- interval: 1m
  input_series:
  - series: 'target_info{job="RustFS", instance="10.45.1.2", deployment_environment_name="test"}'
    values: '1x35'
  alert_rule_test:
  - eval_time: 30m
    alertname: RustFSMetricsAbsent
    exp_alerts: []
# Another RustFS still pushing, from its own namespace, does not hide this
# one's silence.
- interval: 1m
  input_series:
  - series: 'target_info{job="RustFS", instance="10.45.1.2", deployment_environment_name="test"}'
    values: '1x5 _x30'
  - series: 'target_info{job="RustFS", instance="10.45.5.6", deployment_environment_name="rustfs-backups"}'
    values: '1x35'
  alert_rule_test:
  - eval_time: 30m
    alertname: RustFSMetricsAbsent
    exp_alerts:
    - exp_labels: {severity: warning, deployment_environment_name: test}
      exp_annotations:
        summary: The RustFS in test has stopped pushing metrics
        description: "No metrics of the RustFS in test reached Prometheus for 15m. Check its pod, then Alloy's OTLP receiver (otelcol_receiver_* metrics) and the rustfs to Alloy network policy. Its metrics count only while its RUSTFS_OBS_ENVIRONMENT is its namespace: an extraEnv list that replaces the chart's keeps that entry."
# The cloud replica copies hourly from 05:40 to 23:40 UTC: a last success 6
# hours old is quiet, one over 7 hours old fires after 15m; another namespace's
# success does not hide it (release "ci", namespace "test").
- interval: 1m
  input_series:
  - series: 'kube_cronjob_status_last_successful_time{namespace="test", cronjob="ci-replica"}'
    values: '0+0x540'
  - series: 'kube_cronjob_status_last_successful_time{namespace="other", cronjob="ci-replica"}'
    values: '0+60x540'
  alert_rule_test:
  - eval_time: 6h30m
    alertname: OhmlabReplicaStale
    exp_alerts: []
  - eval_time: 7h30m
    alertname: OhmlabReplicaStale
    exp_alerts:
    - exp_labels: {severity: warning, namespace: test, cronjob: ci-replica}
      exp_annotations:
        summary: The cloud replica of the store in test is more than 7 hours old
        description: "test/ci-replica has not succeeded in more than 7 hours, counted from its creation if it never did. Look at the logs of its last Job: a bucket missing from the store or that it refused to shrink, a missing Secret, or the cloud's answer."
# A replica job that never succeeded counts from its creation.
- interval: 1m
  input_series:
  - series: 'kube_cronjob_created{namespace="test", cronjob="ci-replica"}'
    values: '0+0x540'
  alert_rule_test:
  - eval_time: 7h
    alertname: OhmlabReplicaStale
    exp_alerts: []
  - eval_time: 7h20m
    alertname: OhmlabReplicaStale
    exp_alerts:
    - exp_labels: {severity: warning, namespace: test, cronjob: ci-replica}
      exp_annotations:
        summary: The cloud replica of the store in test is more than 7 hours old
        description: "test/ci-replica has not succeeded in more than 7 hours, counted from its creation if it never did. Look at the logs of its last Job: a bucket missing from the store or that it refused to shrink, a missing Secret, or the cloud's answer."
