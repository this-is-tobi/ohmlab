{{- /*
The replica job's three secrets, with the store's own VaultAuth. They are
rendered here rather than through the vso subchart, whose tpl'd paths are
evaluated in the subchart's values, which cannot see replica.*.
*/}}
{{- if .Values.replica.enabled }}
{{- include "rustfs.replica.check" . }}
{{- $auth := .Values.vso.vaultStaticSecrets.rustfsAdmin.vaultAuthRef }}
{{- $secrets := list
  (dict "name" "source" "path" .Values.replica.vault.record "templates" (dict
    "ACCESS_KEY" `{{ get .Secrets "replicator" | dig "accessKey" "" }}`
    "SECRET_KEY" `{{ get .Secrets "replicator" | dig "secretKey" "" }}`
    "ENDPOINT" `{{ get .Secrets "replicator" | dig "endpoint" "" }}`
    "REGION" `{{ get .Secrets "replicator" | dig "region" "" }}`
    "BUCKETS" `{{ get .Secrets "replicator" | dig "buckets" "" }}`
    "ca.crt" `{{ get .Secrets "replicator" | dig "ca" "" }}`))
  (dict "name" "target" "path" .Values.replica.vault.target "templates" (dict
    "ACCESS_KEY" `{{ get .Secrets "accessKey" }}`
    "SECRET_KEY" `{{ get .Secrets "secretKey" }}`))
  (dict "name" "crypt" "path" .Values.replica.vault.crypt "templates" (dict
    "PASSWORD" `{{ get .Secrets "password" }}`
    "PASSWORD2" `{{ get .Secrets "password2" }}`)) }}
{{- range $s := $secrets }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ $.Release.Name }}-replica-{{ $s.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "rustfs.replica.labels" $ | nindent 4 }}
spec:
  mount: {{ $.Values.replica.vault.mount }}
  path: {{ $s.path }}
  type: kv-v2
  vaultAuthRef: {{ $auth }}
  refreshAfter: 1h
  hmacSecretData: true
  destination:
    name: {{ $.Release.Name }}-replica-{{ $s.name }}
    create: true
    type: Opaque
    transformation:
      excludeRaw: true
      excludes:
      - ".*"
      templates:
        {{- range $key := keys $s.templates | sortAlpha }}
        {{ $key }}:
          text: {{ get $s.templates $key | quote }}
        {{- end }}
{{- end }}
{{- end }}
