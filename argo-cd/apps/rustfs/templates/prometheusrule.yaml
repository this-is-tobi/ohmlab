{{- if .Values.monitoring.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-alerts
  namespace: {{ .Release.Namespace }}
spec:
  groups:
  - name: rustfs
    rules:
    - alert: RustFSMetricsAbsent
      # The job label is the OTLP service.name, which RustFS sets as
      # "RustFS"; label matchers are case-sensitive, hence (?i). Each RustFS
      # reports its namespace as its environment (RUSTFS_OBS_ENVIRONMENT,
      # values.yaml), so another RustFS's metrics cannot hide this one's
      # silence.
      expr: absent_over_time(target_info{job=~"(?i).*rustfs.*", deployment_environment_name="{{ .Release.Namespace }}"}[15m])
      labels:
        severity: warning
      annotations:
        summary: The RustFS in {{ .Release.Namespace }} has stopped pushing metrics
        description: >-
          No metrics of the RustFS in {{ .Release.Namespace }} reached
          Prometheus for 15m. Check its pod, then Alloy's OTLP receiver
          (otelcol_receiver_* metrics) and the rustfs to Alloy network policy.
          Its metrics count only while its RUSTFS_OBS_ENVIRONMENT is its
          namespace: an extraEnv list that replaces the chart's keeps that
          entry.
    {{- if .Values.replica.enabled }}
    # The copy runs hourly from 05:40 to 23:40 UTC, so 6 hours apart at most. A
    # CronJob that never succeeded has no last success: its creation counts.
    - alert: OhmlabReplicaStale
      expr: >-
        time() - max by (namespace, cronjob) (kube_cronjob_status_last_successful_time{namespace="{{ .Release.Namespace }}", cronjob="{{ .Release.Name }}-replica"}
        or kube_cronjob_created{namespace="{{ .Release.Namespace }}", cronjob="{{ .Release.Name }}-replica"}) > 7 * 3600
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: The cloud replica of the store in {{ .Release.Namespace }} is more than 7 hours old
        description: >-
          {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.cronjob {{ "}}" }}
          has not succeeded in more than 7 hours, counted from its creation if
          it never did. Look at the logs of its last Job: a bucket missing from
          the store or that it refused to shrink, a missing Secret, or the
          cloud's answer.
    {{- end }}
{{- end }}
