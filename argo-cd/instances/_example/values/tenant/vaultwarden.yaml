waultwarden:
  domain: "https://vaultwarden.example.com"
  adminToken:
    existingSecret: vaultwarden-admin
    existingSecretKey: token
  database:
    host: vaultwarden-pg-cluster-rw
    port: 5432
    dbName: vaultwarden
    existingSecret: vaultwarden-pg-cluster-app
    existingSecretUserKey: username
    existingSecretPasswordKey: password
  invitationOrgName: Ohmlab
  ingress:
    hostname: vaultwarden.example.com
    tlsSecret: vaultwarden.example.com-tls

cnpg:
  cluster:
    superuserSecret: vaultwarden-pg-cluster-admin
    initdb:
      secret:
        name: vaultwarden-pg-cluster-app
  backups:
    enabled: true
    endpointURL: "https://s3.example.com"
    destinationPath: "s3://backups/cnpg"

vso:
  vaultStaticSecrets:
    vaultwardenAdmin:
      mount: example
      path: platforms/production/tenant/vaultwarden
    vaultwardenDbInfos:
      mount: example
      path: platforms/production/tenant/vaultwarden
    vaultwardenDbAdmin:
      mount: example
      path: platforms/production/tenant/vaultwarden
    vaultwardenDbApp:
      mount: example
      path: platforms/production/tenant/vaultwarden
    vaultwardenPgBackup:
      mount: example
      path: platforms/production/tenant/vaultwarden
    vaultwardenSso:
      mount: example
      path: platforms/production/tenant/vaultwarden
