mlflow:
  ingress:
    hosts:
    - host: mlflow.example.com
      paths:
      - path: /
        pathType: ImplementationSpecific
    tls:
    - hosts:
      - mlflow.example.com
      secretName: mlflow.example.com-tls
  backendStore:
    postgres:
      host: mlflow-pg-cluster-rw
      database: mlflow
      user: mlflow
    # Credentials come from the CNPG app-user secret (see cnpg.credentials
    # below) — never put the password inline here.
    existingDatabaseSecret:
      name: mlflow-pg-cluster-app
      usernameKey: username
      passwordKey: password
  artifactRoot:
    s3:
      bucket: mlflow
      path: ""
  extraEnvVars:
    MLFLOW_S3_ENDPOINT_URL: "https://s3.example.com"
    AWS_DEFAULT_REGION: fr-par
  extraSecretNamesForEnvFrom:
  - mlflow-s3 # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY

cnpg:
  cluster:
    superuserSecret: mlflow-pg-cluster-admin
    initdb:
      secret:
        name: mlflow-pg-cluster-app
  backups:
    enabled: true
    endpointURL: "https://s3.example.com"
    destinationPath: "s3://backups/cnpg"

sso:
  config:
    configFile: |-
      provider = "keycloak-oidc"
      provider_display_name = "Keycloak"
      email_domains = [ "*" ]
      upstreams = [ "http://mlflow.mlflow.svc.cluster.local:5000/" ]
      redirect_url = "https://mlflow.example.com/oauth2/callback"
      oidc_issuer_url = "https://keycloak.example.com/realms/example"
  ingress:
    hosts:
    - mlflow.example.com
    tls:
    - secretName: mlflow.example.com
      hosts:
      - mlflow.example.com
