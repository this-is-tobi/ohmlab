mattermost:
  image:
    repository: ghcr.io/this-is-tobi/mirror/mattermost
    tag: 12.0.1
  persistence:
    data:
      enabled: true
    plugins:
      enabled: true
  ingress:
    hosts:
    - mattermost.example.com
    tls:
    - hosts:
      - mattermost.example.com
      secretName: mattermost.example.com-tls
  config:
    MM_SERVICESETTINGS_SITEURL: "https://mattermost.example.com"
    MM_FILESETTINGS_AMAZONS3BUCKET: mattermost
    MM_FILESETTINGS_AMAZONS3PATHPREFIX: ""
    MM_FILESETTINGS_AMAZONS3REGION: fr-par
    MM_FILESETTINGS_AMAZONS3ENDPOINT: "https://s3.example.com"
  extraEnvVars:
  - name: MM_SQLSETTINGS_DATASOURCE
    valueFrom:
      secretKeyRef:
        name: mattermost-pg-cluster-infos
        key: connectionString
  - name: MM_FILESETTINGS_AMAZONS3ACCESSKEYID
    valueFrom:
      secretKeyRef:
        name: mattermost-s3
        key: S3_ACCESS_KEY
  - name: MM_FILESETTINGS_AMAZONS3SECRETACCESSKEY
    valueFrom:
      secretKeyRef:
        name: mattermost-s3
        key: S3_SECRET_KEY

cnpg:
  cluster:
    superuserSecret: mattermost-pg-cluster-admin
    initdb:
      secret:
        name: mattermost-pg-cluster-app
  backups:
    enabled: true
    endpointURL: "https://s3.example.com"
    destinationPath: "s3://backups/cnpg"

vso:
  vaultStaticSecrets:
    mattermostDbSecret:
      mount: example
      path: platforms/production/tenant/mattermost
    mattermostS3:
      mount: example
      path: platforms/production/tenant/mattermost
    mattermostDbInfos:
      mount: example
      path: platforms/production/tenant/mattermost
    mattermostDbAdmin:
      mount: example
      path: platforms/production/tenant/mattermost
    mattermostDbApp:
      mount: example
      path: platforms/production/tenant/mattermost
    mattermostPgBackup:
      mount: example
      path: platforms/production/tenant/mattermost
