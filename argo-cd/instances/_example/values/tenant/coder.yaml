coder:
  coder:
    ingress:
      host: coder.example.com
      wildcardHost: "*.coder.example.com"
      tls:
        secretName: coder.example.com-tls
        wildcardSecretName: coder.example.com-tls-wild
    envUseClusterAccessURL: false
    env:
    - name: CODER_PG_CONNECTION_URL
      valueFrom:
        secretKeyRef:
          name: coder-db-infos
          key: DB_URL
    - name: CODER_ACCESS_URL
      value: "https://coder.example.com"
    - name: CODER_OIDC_ISSUER_URL
      value: "https://keycloak.example.com/realms/example"
    - name: CODER_OIDC_CLIENT_ID
      value: coder
    - name: CODER_OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: coder-sso
          key: OIDC_CLIENT_SECRET
    - name: CODER_OIDC_SIGN_IN_TEXT
      value: Login with Keycloak
    - name: CODER_OIDC_SCOPES
      value: "openid,profile,email,groups,roles"
    - name: CODER_OIDC_GROUP_FIELD
      value: groups
    - name: CODER_OIDC_ADMIN_GROUP
      value: admin
    - name: CODER_OIDC_GROUP_AUTO_CREATE
      value: "true"
    envFrom: []
    # - configMapRef:
    #     name: coder-config
    # - secretRef:
    #     name: coder-config
    # - secretRef:
    #     name: coder-sso

cnpg:
  cluster:
    superuserSecret: coder-pg-cluster-admin
    initdb:
      secret:
        name: coder-pg-cluster-app
