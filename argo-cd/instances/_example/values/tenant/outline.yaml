outline:
  url: "https://outline.example.com"
  ingress:
    hosts:
    - host: outline.example.com
      paths:
      - path: /
        pathType: Prefix
    tls:
    - hosts:
      - outline.example.com
      secretName: outline.example.com-tls
  fileStorage:
    s3:
      bucket: outline
      bucketUrl: "https://s3.example.com/outline"
      region: fr-par
  auth:
    oidc:
      authUri: "https://keycloak.example.com/realms/example/protocol/openid-connect/auth"
      tokenUri: "https://keycloak.example.com/realms/example/protocol/openid-connect/token"
      userInfoUri: "https://keycloak.example.com/realms/example/protocol/openid-connect/userinfo"

cnpg:
  cluster:
    superuserSecret: outline-pg-cluster-admin
    initdb:
      secret:
        name: outline-pg-cluster-app
