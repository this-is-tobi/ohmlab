# The ohmlab controller: keeps Vault configured from VaultSeed objects
# (docs/08-controller.md). Nothing runs until a target is enabled.
#
# 1. Enable the Vault target. Start with observeOnly to see what it would do.
# 2. In values/core/vault-operator.yaml set ohmlab.controller.enabled and
#    ohmlab.vault.seeds.enabled, and enable the app in core.yaml.
#
# The chart pins the image to a release and its digest; set `image` here only
# to run another one:
# image: ghcr.io/this-is-tobi/ohmlab/controller:<version>@sha256:<digest>
#
# targets:
#   vault:
#     enabled: true
#     observeOnly: true
#     watchNamespaces:
#     - vault-operator-system
#
# Zero-trust NetworkPolicy for the namespace: egress to your API server and to
# the Vault pods on 8200 (DNS is added by the chart), Prometheus scrapes 8080.
# networkPolicy:
#   enabled: true
#   prometheusScrapePorts:
#   - { protocol: TCP, port: 8080 }
#   extraEgress:
#   - name: apiserver
#     rules:
#     - to:
#       - ipBlock: { cidr: 192.0.2.10/32 } # your API server
#       ports:
#       - { protocol: TCP, port: 6443 }
#   - name: vault
#     rules:
#     - to:
#       - namespaceSelector:
#           matchLabels:
#             kubernetes.io/metadata.name: vault-operator-system
#         podSelector:
#           matchLabels:
#             app.kubernetes.io/name: vault
#       ports:
#       - { protocol: TCP, port: 8200 }
