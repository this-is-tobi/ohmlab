gateway:
  enabled: false
  name: example-gateway
  domain: example.com
  clusterIssuer: letsencrypt-http-prod
  dnsClusterIssuer: letsencrypt-dns-prod
  wildcardTlsSecret: gateway-wildcard-tls
  apexTlsSecret: gateway-wildcard-tls
  extraListeners: []
  tlsPassthroughListeners: []

cilium:
  # The address the agents reach the Kubernetes API at (required): an API
  # server VIP or a control-plane node.
  k8sServiceHost: 192.0.2.10 # documentation address (RFC 5737): replace with yours
