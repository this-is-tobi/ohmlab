# ohmlab wrapper values — TEMPLATE (see values/core/ohmlab.yaml of the homelab
# instance, https://github.com/this-is-tobi/homelab, for a real, working example).
#
# Owns:
# - The CORE ArgoCD installation (in argocd-system namespace)
# - The root `manager` ApplicationSet (discovers every instance under
#   `argo-cd/instances/*` and renders one per-instance Application)
# - The `admin-core` and `admin-tenant` AppProjects
#
# Bootstrap is intentionally bare: admin login only, no OIDC, no notifications.
# This avoids any chicken-and-egg with vault-operator / Vault / Keycloak.

# Gateway API routes for the core ArgoCD UI. Enable once a Gateway exists
# (e.g. the apisix or cilium app); leave disabled for ingress-based setups.
gateway:
  enabled: false
  gatewayName: ""
  gatewayNamespace: ""
  routes: []
  # - name: argocd-core
  #   hostnames:
  #   - gitops.core.example.com
  #   rules:
  #   - backendService: argocd-server
  #     backendPort: 80

rootManager:
  enabled: true
  repoURL:
    # Repo holding the `argo-cd/` tree (charts + instances + values).
    sources: https://github.com/this-is-tobi/ohmlab.git
    # Optional separate values repo. Defaults to `sources`.
    values: ""
  targetRevision: main

# AppProjects for the two tiers. Names are referenced by
# `instances/<name>/instance.yaml` (projects.core / projects.tenant).
projects:
  core:
    enabled: true
    name: admin-core
  tenant:
    enabled: true
    name: admin-tenant

argo-cd:
  enabled: true
  configs:
    secret:
      # Set at bootstrap via:
      #   ARGOCD_ADMIN_PASSWORD=... ./run.sh -b <instance>
      # or leave empty to let the chart auto-generate one.
      argocdServerAdminPassword: ""
    cm:
      url: "" # e.g. https://gitops.core.example.com
      # OIDC via Keycloak — enable once Keycloak is up (see the homelab
      # instance for a full example wired to VSO).
      # oidc.config: |
      #   name: "Keycloak"
      #   issuer: "https://sso.core.example.com/realms/homelab"
      #   clientID: "argo-cd-core"
      #   clientSecret: "$argocd-core-oidc:OIDC_CLIENT_SECRET"
      #   requestedScopes: ["openid", "profile", "email", "groups"]
  # One replica of everything and no Redis HA, so the bootstrap works on a
  # single node. The chart defaults are highly available (Redis HA with hard
  # pod anti-affinity, two replicas of each component) and a bootstrap on one
  # node never becomes ready: drop these overrides on three nodes or more.
  redis-ha:
    enabled: false
  redis:
    enabled: true
  controller:
    replicas: 1
  repoServer:
    replicas: 1
  applicationSet:
    replicas: 1
  server:
    replicas: 1
    ingress:
      enabled: false
  crds:
    install: true
    keep: true

# VSO integration — injects secrets from Vault into argocd-system after
# vault-operator is deployed. Keep disabled until the Vault stack is running
# (run.sh forces --set vso.enabled=false during bootstrap anyway).
vso:
  enabled: false

# Optional, dormant CoreDNS replacement for your CNI/distro's bundled one
# (templates/coredns.yaml in this chart, which explains the full
# reasoning). coredns.enabled defaults to false in the base chart — leave
# it off unless you've deliberately decided to take DNS ownership (see the
# homelab instance for a worked example). If/when you do, supply your real
# node list here:
# coredns:
#   enabled: true
#   replicas: 2
#   nodeHosts:
#   - { ip: 192.168.1.100, name: node0 }
#   - { ip: 192.168.1.101, name: node1 }
