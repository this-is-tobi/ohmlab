# Core (platform) tier app catalog for the `homelab` instance.
# Slim list — only what is actually deployed.
# Schema reference: ../_example/core.yaml

apps:
- app: ohmlab
  enabled: "true"
  namespace: argocd-system
  syncWave: -10
  releaseName: ohmlab
  # Pinned published chart: a change under utils/helm only reaches the
  # cluster once its version is released and bumped here.
  catalog: ohmlab
  targetRevision: 0.1.7
- app: longhorn
  enabled: "true"
  namespace: longhorn-system
  releaseName: longhorn-system
  syncWave: 0
- app: cilium
  enabled: "true"
  namespace: kube-system
  syncWave: 5
- app: cert-manager
  enabled: "true"
  syncWave: 10
- app: ingress-nginx
  enabled: "false"
  syncWave: 10
# THE ingress controller — Gateway API only, zero Ingress objects in this
# cluster. apisix below is kept disabled as an escape hatch.
- app: traefik
  enabled: "true"
  namespace: traefik
  syncWave: 11
- app: apisix
  # Decommissioned — traefik is the ingress controller. The catalog app is
  # kept as an escape hatch (like ingress-nginx): re-enabling deploys a
  # fresh stack, but port 80/443 ownership (traefik's externalIPs Service
  # currently owns both) must be resolved first. Application deletion
  # does not cascade — the namespace was cleaned up manually.
  enabled: "false"
  namespace: apisix
  # After vault-operator (10): the admin credentials come from Vault via VSO.
  syncWave: 12
  ignoreDifferences:
  # etcd-jwt-token and webhook cert are auto-managed by the operator.
  # ValidatingWebhookConfiguration caBundle is injected at runtime.
  - group: ""
    kind: Secret
    name: apisix-etcd-jwt-token
    jqPathExpressions:
    - .data
  - group: ""
    kind: Secret
    name: apisix-ingress-controller-webhook-cert
    jqPathExpressions:
    - .data
  - group: admissionregistration.k8s.io
    kind: ValidatingWebhookConfiguration
    name: apisix-ingress-controller-webhook
    jqPathExpressions:
    - .webhooks[].clientConfig.caBundle
  # etcd StatefulSet: VCT status injected by Kubernetes; checksum annotation
  # derived from the operator-managed jwt-token secret (ignored above).
  - group: apps
    kind: StatefulSet
    name: apisix-etcd
    jqPathExpressions:
    - .spec.volumeClaimTemplates[].status
    - .spec.template.metadata.annotations["checksum/token-secret"]
- app: vault-operator
  enabled: "true"
  namespace: vault-operator-system
  syncWave: 10
# The ohmlab controller keeps Vault configured from VaultSeed objects
# (docs/08-controller.md). After vault-operator (10): its Roles go in the
# namespace vault-operator creates and it logs in with the role vault-operator
# grants. vault-operator renders the objects once this app's CRD exists.
- app: ohmlab-controller
  enabled: "true"
  namespace: ohmlab-system
  syncWave: 11
# After cert-manager (10): its webhook certificate. Publishes the Vault CA
# ConfigMap Traefik validates Vault against, so Kyverno needs no Secret access.
- app: trust-manager
  enabled: "true"
  namespace: trust-manager
  syncWave: 13
- app: kyverno
  enabled: "true"
  namespace: kyverno
  syncWave: 15
- app: cloudnative-pg
  enabled: "true"
  syncWave: 20
- app: prometheus-stack
  enabled: "true"
  syncWave: 50
- app: keycloak
  enabled: "true"
  namespace: keycloak-system
  syncWave: 55
- app: teleport
  enabled: "true"
  namespace: teleport-system
  syncWave: 60
- app: system-upgrade
  enabled: "true"
  syncWave: 60
- app: crowdsec
  enabled: "true"
  namespace: crowdsec
  syncWave: 60
  ignoreDifferences:
  # lapi-secrets contains randomly-generated csLapiSecret and registrationToken
  # created at first install — must not be overwritten on re-sync.
  - group: ""
    kind: Secret
    name: crowdsec-lapi-secrets
    jqPathExpressions:
    - .data
  # The chart re-randomizes the secret on every render, so the deployment's
  # checksum/lapi-secret pod-template annotation never converges (permanent
  # OutOfSync noise even though every sync succeeds).
  - group: apps
    kind: Deployment
    name: crowdsec-lapi
    jqPathExpressions:
    - .spec.template.metadata.annotations["checksum/lapi-secret"]
