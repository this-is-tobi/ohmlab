vaultOidcCredentials:
  enabled: true
  mount: homelab
  path: platforms/production/core/keycloak

vso:
  enabled: true
  vaultConnection:
    default:
      address: "https://vault.vault-operator-system.svc.cluster.local:8200"
      skipTLSVerify: false
      caCertSecretRef: vault-tls
  vaultAuth:
    default:
      method: kubernetes
      mount: kubernetes
      kubernetes:
        role: vault-operator
        serviceAccount: vso
      vaultConnectionRef: default

backup-utils:
  enabled: false  # S3 keys not configured yet — re-enable when available

# Zero-trust NetworkPolicy: default-deny with explicit allow rules for
# only the traffic this namespace needs. No probe-only ingress rule
# (dropped — no webhook config in this cluster targets this namespace).
# Covers BOTH Vault's own raft/API needs AND the centralized VSO
# controller's apiserver-watch (both run here).
networkPolicy:
  enabled: true
  egressDeny: true
  prometheusScrapePorts:
  - { protocol: TCP, port: 8200 }
  extraIngress:
  - name: traefik
    rules:
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: traefik
      ports:
      - { protocol: TCP, port: 8200 }
  # The ohmlab controller's Vault target.
  - name: ohmlab-controller
    rules:
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: ohmlab-system
      ports:
      - { protocol: TCP, port: 8200 }
  extraEgress:
  - name: apiserver
    rules:
    - to:
      - ipBlock: { cidr: 192.168.1.0/24 }
      ports:
      - { protocol: TCP, port: 6443 }
  # Vault's OIDC auth (oidcEnabled: true above) dials sso.core.ohmlab.fr
  # directly — a real NAT hairpin, not just a theoretical path. Hairpin
  # goes to the gateway's public IP, not a node IP; https only.
  - name: sso-hairpin
    rules:
    - to:
      - ipBlock: { cidr: 82.66.77.140/32 }
      ports:
      - { protocol: TCP, port: 443 }
