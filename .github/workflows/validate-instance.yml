name: Validate an instance

# The checks that read an instance's values, for an instance kept in a
# repository of its own: the caller's repository holds the instance folders,
# and the checks come from the product at the revision the instance consumes,
# so they always match the charts it deploys. This repository runs it on its
# own instances too (ci.yml, job validate-instance), and on an instance
# repository that follows its main (job validate-homelab), against each change
# before it is merged.
on:
  workflow_call:
    inputs:
      ref:
        description: Revision of the product the instance consumes (main, a tag, catalog-vX.Y.Z for an OCI bundle at that version)
        type: string
        default: main
      product-repository:
        description: The product repository (owner/name)
        type: string
        default: this-is-tobi/ohmlab
      instances-path:
        description: Path of the instance folders in the instance repository
        type: string
        default: argo-cd/instances
      instance-repository:
        description: The instance repository (owner/name); empty for the caller's
        type: string
        default: ""
      instance-ref:
        description: Revision of the instance repository; empty for the event's own (the caller) or the default branch
        type: string
        default: ""
      base-ref:
        description: A revision of the product to compare with (a pull request's base); the instance is rendered from both, and an object the base renders but `ref` does not fails
        type: string
        default: ""

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      INSTANCES_DIR: ${{ github.workspace }}/instance/${{ inputs.instances-path }}
    defaults:
      run:
        working-directory: ohmlab
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.instance-repository || github.repository }}
          ref: ${{ inputs.instance-ref }}
          path: instance
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.product-repository }}
          ref: ${{ inputs.ref }}
          path: ohmlab
      - uses: azure/setup-helm@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: ohmlab/utils/go.mod
          cache-dependency-path: ohmlab/utils/go.sum
      - uses: actions/checkout@v7
        if: inputs.base-ref != ''
        with:
          repository: ${{ inputs.product-repository }}
          ref: ${{ inputs.base-ref }}
          path: ohmlab-base
      - name: Build the chart dependencies
        run: |
          set -euo pipefail
          source scripts/lib/helm-repos.sh
          add_dependency_repos argo-cd/apps/*/Chart.yaml
          locked=()
          for chart in argo-cd/apps/*/; do
            chart="${chart%/}"
            [ -f "$chart/Chart.lock" ] && locked+=("$chart")
          done
          logs="$RUNNER_TEMP/deps"
          mkdir -p "$logs"
          if ! vendor_dependencies "$logs" "${locked[@]}"; then
            while IFS= read -r chart; do
              echo "::error::helm dependency build failed for $chart: $(tail -1 "$logs/$(printf '%s' "$chart" | tr / _).log")"
            done <"$logs/failed"
            exit 1
          fi
      - name: Build the chart dependencies of the base
        if: inputs.base-ref != ''
        working-directory: ohmlab-base
        run: |
          set -euo pipefail
          source ../ohmlab/scripts/lib/helm-repos.sh
          add_dependency_repos argo-cd/apps/*/Chart.yaml
          locked=()
          for chart in argo-cd/apps/*/; do
            chart="${chart%/}"
            [ -f "$chart/Chart.lock" ] && locked+=("$chart")
          done
          logs="$RUNNER_TEMP/deps-base"
          mkdir -p "$logs"
          # A base that no longer builds is reported by the comparison (apps
          # that no longer render), not here.
          vendor_dependencies "$logs" "${locked[@]}" || true
      - name: Check that every chart can read its secrets from Vault
        run: scripts/ci/check-vault-access.sh
      - name: Validate the VaultSeed objects each instance would deploy
        run: scripts/ci/check-vault-seeds.sh
      - name: Check that Vault-managed Secrets carry only their own keys
        run: scripts/ci/check-vso-isolation.sh
      - name: Render every app the instance enables with its values
        env:
          RENDER_OUT: ${{ runner.temp }}/render-head
        run: scripts/ci/render-instance.sh
      - name: Render the instance with the base's charts
        if: inputs.base-ref != ''
        env:
          APPS_DIR: ${{ github.workspace }}/ohmlab-base/argo-cd/apps
          RENDER_OUT: ${{ runner.temp }}/render-base
        # What the base itself cannot render is not this change's doing.
        run: scripts/ci/render-instance.sh || true
      - name: Check that the change deletes or renames nothing on the instance
        if: inputs.base-ref != ''
        run: scripts/ci/compare-instance-renders.sh "$RUNNER_TEMP/render-base" "$RUNNER_TEMP/render-head"
